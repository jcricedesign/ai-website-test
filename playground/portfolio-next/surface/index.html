<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Four Compositions</title><style>:root{--u:48px;--field:#171716;--grid:rgba(255,255,255,.042);--guide:rgba(255,255,255,.56);--light:#d8d8d5;--mid:#a9a9a7;--dark:#555553;--ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:var(--field)}.surface::before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110 0%,#1b1b19 48%,#141413 100%);animation:breathe 34s ease-in-out infinite alternate;transform:scale(1.05)}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:var(--u) var(--u);background-position:-1px -1px;mix-blend-mode:screen;animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;left:50%;top:50%;width:min(68vw,760px);height:min(68vh,650px);transform:translate(-50%,-50%)}.guide,.block{position:absolute;transition:all 850ms var(--ease)}.guide{background:var(--guide)}.gv1,.gv2{width:1px;top:3%;height:94%}.gh{height:1px;left:-12%;width:124%;top:15%}.gv1{left:4%}.gv2{left:96%}.block{background:var(--light)}.b1{left:14%;top:22%;width:22%;height:38%}.b2{left:40%;top:22%;width:22%;height:38%}.b3{left:66%;top:22%;width:22%;height:38%}.b4{left:14%;top:62%;width:22%;height:18%}.b5{left:40%;top:62%;width:22%;height:18%;background:var(--mid)}.b6{left:66%;top:62%;width:22%;height:18%;background:var(--dark)}.b7,.b8{opacity:0}.layout-2 .b1{left:14%;top:22%;width:74%;height:17%}.layout-2 .b2{left:14%;top:42%;width:74%;height:17%}.layout-2 .b3{left:14%;top:62%;width:74%;height:17%;background:var(--mid)}.layout-2 .b4,.layout-2 .b5,.layout-2 .b6{opacity:0}.layout-3 .b1{left:14%;top:22%;width:44%;height:39%}.layout-3 .b2{left:60%;top:22%;width:27%;height:18%;background:var(--mid)}.layout-3 .b3{left:60%;top:42%;width:12%;height:18%;background:var(--mid)}.layout-3 .b4{left:75%;top:42%;width:12%;height:18%}.layout-3 .b5{left:14%;top:63%;width:22%;height:18%}.layout-3 .b6{left:38%;top:63%;width:20%;height:9%;background:var(--dark)}.layout-3 .b7{opacity:1;left:38%;top:74%;width:20%;height:8%;background:var(--mid)}.layout-3 .b8{opacity:1;left:60%;top:63%;width:27%;height:9%;background:var(--dark)}.layout-4 .b1{left:14%;top:22%;width:74%;height:39%}.layout-4 .b2{left:14%;top:63%;width:22%;height:18%;background:var(--mid)}.layout-4 .b3{left:38%;top:63%;width:20%;height:8%;background:var(--mid)}.layout-4 .b4{left:38%;top:73%;width:20%;height:8%}.layout-4 .b5{left:60%;top:63%;width:28%;height:18%;background:var(--mid)}.layout-4 .b6,.layout-4 .b7,.layout-4 .b8{opacity:0}.counter{position:fixed;left:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px/1 Arial,sans-serif;letter-spacing:.12em}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px/1.3 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;user-select:none}.hint strong{color:rgba(255,255,255,.5);font-weight:400}@keyframes breathe{0%{transform:translate3d(-2%,-1%,0) scale(1.06);filter:brightness(.94)}45%{transform:translate3d(1%,2%,0) scale(1.08);filter:brightness(1.02)}100%{transform:translate3d(3%,-2%,0) scale(1.06);filter:brightness(.97)}}@keyframes gridBreath{0%{opacity:.68}40%{opacity:.94}72%{opacity:.74}100%{opacity:.88}}@media(prefers-reduced-motion:reduce){.surface::before,.grid{animation:none}.block{transition:none}}@media(max-width:760px){.stage{width:82vw;height:62vh}}</style></head><body><div class="surface"><div class="grid"></div><div class="stage" id="stage"><i class="guide gv1"></i><i class="guide gv2"></i><i class="guide gh"></i><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i></div></div><div class="counter" id="counter">01 / 04</div><div class="hint">click / space — <strong>next composition</strong></div><script>const stage=document.getElementById('stage'),counter=document.getElementById('counter');let i=1;function next(){i=i%4+1;stage.className='stage '+(i===1?'':'layout-'+i);counter.textContent=String(i).padStart(2,'0')+' / 04'}document.addEventListener('click',next);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();next()}});</script></body></html>
