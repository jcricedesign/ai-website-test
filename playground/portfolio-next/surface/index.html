<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Four Compositions</title><style>:root{--u:48px;--ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:#171716;cursor:pointer}.surface:before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;left:50%;top:46%;width:min(84vw,1120px);height:min(74vh,740px);transform:translate(-50%,-50%)}.guide,.block{position:absolute}.guide{background:rgba(255,255,255,.62);z-index:5;pointer-events:none}.gv1,.gv2{width:1px;top:3%;height:94%}.gh{height:1px;left:-7%;width:114%;top:15%}.gv1{left:4%}.gv2{left:96%}.block{background:#d8d8d5;z-index:2;outline:none;cursor:crosshair;transition:left .85s var(--ease),top .85s var(--ease),width .85s var(--ease),height .85s var(--ease),opacity .82s ease,filter .82s ease,transform .82s ease}.stage.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.58);opacity:.52}.block.intent{filter:brightness(1.24)!important;transform:scale(1.035)}.block.demo-focus{filter:brightness(1.14)!important;transform:scale(1.02)}.b1{left:14%;top:22%;width:22%;height:38%}.b2{left:40%;top:22%;width:22%;height:38%}.b3{left:66%;top:22%;width:22%;height:38%}.b4{left:14%;top:62%;width:22%;height:18%}.b5{left:40%;top:62%;width:22%;height:18%;background:#a9a9a7}.b6{left:66%;top:62%;width:22%;height:18%;background:#555553}.b7,.b8{opacity:0;pointer-events:none}.layout-2 .b1{left:14%;top:22%;width:74%;height:17%}.layout-2 .b2{left:14%;top:42%;width:74%;height:17%}.layout-2 .b3{left:14%;top:62%;width:74%;height:17%;background:#a9a9a7}.layout-2 .b4,.layout-2 .b5,.layout-2 .b6{opacity:0;pointer-events:none}.layout-3 .b1{left:14%;top:22%;width:44%;height:39%}.layout-3 .b2{left:60%;top:22%;width:27%;height:18%;background:#a9a9a7}.layout-3 .b3{left:60%;top:42%;width:12%;height:18%;background:#a9a9a7}.layout-3 .b4{left:75%;top:42%;width:12%;height:18%}.layout-3 .b5{left:14%;top:63%;width:22%;height:18%}.layout-3 .b6{left:38%;top:63%;width:20%;height:9%;background:#555553}.layout-3 .b7{opacity:1;left:38%;top:74%;width:20%;height:8%;background:#a9a9a7;pointer-events:auto}.layout-3 .b8{opacity:1;left:60%;top:63%;width:27%;height:9%;background:#555553;pointer-events:auto}.layout-4 .b1{left:14%;top:22%;width:74%;height:39%}.layout-4 .b2{left:14%;top:63%;width:22%;height:18%;background:#a9a9a7}.layout-4 .b3{left:38%;top:63%;width:20%;height:8%;background:#a9a9a7}.layout-4 .b4{left:38%;top:73%;width:20%;height:8%}.layout-4 .b5{left:60%;top:63%;width:28%;height:18%;background:#a9a9a7}.layout-4 .b6,.layout-4 .b7,.layout-4 .b8{opacity:0;pointer-events:none}.pager{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:14px;z-index:99}.pager button{appearance:none;border:1px solid rgba(255,255,255,.3);width:14px;height:14px;border-radius:50%;padding:0;background:rgba(255,255,255,.38);cursor:pointer}.pager button.active{background:#fff;transform:scale(1.12)}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px Arial}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body><div class="surface" id="surface"><div class="grid"></div><div class="stage" id="stage"><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i><i class="guide gv1"></i><i class="guide gv2"></i><i class="guide gh"></i></div><nav class="pager"><button class="active" data-layout="1"></button><button data-layout="2"></button><button data-layout="3"></button><button data-layout="4"></button></nav></div><div class="hint">hover — interest · click — next composition</div><script>const surface=document.getElementById('surface'),stage=document.getElementById('stage'),blocks=[...stage.querySelectorAll('.block')],dots=[...document.querySelectorAll('.pager button')];let layout=1,idle,demo,idx=0,hovered=null;const visible=()=>blocks.filter(b=>getComputedStyle(b).opacity!=='0'&&getComputedStyle(b).pointerEvents!=='none');function clearDemo(){clearTimeout(idle);clearInterval(demo);blocks.forEach(b=>b.classList.remove('demo-focus'))}function schedule(){clearDemo();if(hovered)return;idle=setTimeout(()=>{const list=visible();if(!list.length)return;idx=Math.floor(Math.random()*list.length);stage.classList.add('has-intent');list[idx].classList.add('demo-focus');demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx=(idx+1)%list.length;list[idx].classList.add('demo-focus')},4200)},6500)}blocks.forEach(b=>{b.onmouseenter=()=>{hovered=b;clearDemo();stage.classList.add('has-intent');blocks.forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{hovered=null;b.classList.remove('intent');stage.classList.remove('has-intent');schedule()}});function setLayout(n){layout=n;clearDemo();stage.className='stage '+(n===1?'':'layout-'+n);dots.forEach((d,j)=>d.classList.toggle('active',j===n-1));schedule()}dots.forEach(d=>d.onclick=e=>{e.stopPropagation();setLayout(Number(d.dataset.layout))});surface.onclick=e=>{if(e.target.closest('.pager'))return;setLayout(layout%4+1)};schedule();</script></body></html>
