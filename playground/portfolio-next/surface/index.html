<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Draw Compose Preview</title><style>:root{--u:48px;--attention:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;transition:filter .5s,opacity .5s;animation:gridBreath 28s ease-in-out infinite alternate}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;transform-origin:center;transition:left .55s var(--attention),top .55s var(--attention),width .55s var(--attention),height .55s var(--attention),opacity .82s var(--attention),filter .82s var(--attention),transform .82s var(--attention)}.objects.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.62);opacity:.58}.block.intent{filter:brightness(1.18)!important;opacity:1!important;transform:scale(1.025)}.block.demo-focus{filter:brightness(1.12)!important;opacity:1!important;transform:scale(1.016)}.action{position:fixed;right:28px;top:24px;z-index:100;border:0;background:none;color:rgba(255,255,255,.55);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px}.action:hover{color:#fff}.editmode .grid,.composemode .grid{opacity:1!important;filter:brightness(2.2)}.editmode .block{opacity:.72}.editmode .block:hover{opacity:.38;cursor:crosshair}.editmode .surface{cursor:crosshair}.previewbox{position:absolute;display:none;z-index:3;background:rgba(255,255,255,.3);outline:1px solid rgba(255,255,255,.65);pointer-events:none}.composebar{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:12px;color:rgba(255,255,255,.48);font:10px Arial;letter-spacing:.08em;text-transform:uppercase}.composemode .composebar{display:flex}.composebar button{border:1px solid rgba(255,255,255,.18);background:rgba(20,20,20,.35);color:rgba(255,255,255,.65);padding:7px 10px;cursor:pointer}.composebar button:hover{color:#fff;border-color:rgba(255,255,255,.4)}.hint{position:fixed;left:24px;bottom:22px;z-index:100;color:rgba(255,255,255,.3);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.editmode .hint,.composemode .hint{color:rgba(255,255,255,.5)}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="previewbox" id="previewbox"></div></div><button class="action" id="action">Edit</button><div class="composebar"><span>Gutter</span><button id="less">−48</button><span id="gutterValue">48</span><button id="more">+48</button></div><div class="hint" id="hint">Edit to draw a composition</div><script>const U=48,surface=document.getElementById('surface'),objects=document.getElementById('objects'),previewbox=document.getElementById('previewbox'),action=document.getElementById('action'),hint=document.getElementById('hint'),gutterValue=document.getElementById('gutterValue');let mode='view',drawing=false,start=null,idle,demo,idx=0,hovered=null,offsetX=0,offsetY=0,gutter=48;const rects=[];function visible(){return [...objects.querySelectorAll('.block')]}function clearDemo(){clearTimeout(idle);clearInterval(demo);visible().forEach(b=>b.classList.remove('demo-focus'));objects.classList.remove('has-intent')}function schedule(){clearDemo();if(mode!=='view'||hovered)return;idle=setTimeout(()=>{const list=visible();if(!list.length)return;idx=Math.floor(Math.random()*list.length);objects.classList.add('has-intent');list[idx].classList.add('demo-focus');demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx=(idx+1)%list.length;list[idx].classList.add('demo-focus')},4200)},6500)}function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){const l=Math.min(a.x,b.x),t=Math.min(a.y,b.y),r=Math.max(a.x,b.x)+U,bt=Math.max(a.y,b.y)+U;return{x:l,y:t,w:r-l,h:bt-t}}function intersects(q){return rects.some(r=>!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}function wrap(v,max){return((v%max)+max)%max}function displayRect(r){const cols=Math.max(1,Math.round(r.w/U)),rows=Math.max(1,Math.round(r.h/U)),inset=gutter===0?0:Math.min(gutter/2,Math.max(0,(cols*U-U)/2),Math.max(0,(rows*U-U)/2));return{x:wrap(r.x+offsetX+inset,innerWidth),y:wrap(r.y+offsetY+inset,innerHeight),w:Math.max(U,r.w-inset*2),h:Math.max(U,r.h-inset*2)}}function addBlock(r,i,x,y){const b=document.createElement('div');b.className='block';Object.assign(b.style,{left:x+'px',top:y+'px',width:r.w+'px',height:r.h+'px'});b.onmouseenter=()=>{if(mode!=='view')return;hovered=b;clearDemo();objects.classList.add('has-intent');visible().forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{if(mode!=='view')return;hovered=null;b.classList.remove('intent');objects.classList.remove('has-intent');schedule()};b.onclick=e=>{if(mode!=='edit')return;e.stopPropagation();rects.splice(i,1);render()};objects.appendChild(b);const right=x+r.w,bottom=y+r.h;if(right>innerWidth){const c=b.cloneNode();c.style.left=(x-innerWidth)+'px';objects.appendChild(c)}if(bottom>innerHeight){const c=b.cloneNode();c.style.top=(y-innerHeight)+'px';objects.appendChild(c)}if(right>innerWidth&&bottom>innerHeight){const c=b.cloneNode();c.style.left=(x-innerWidth)+'px';c.style.top=(y-innerHeight)+'px';objects.appendChild(c)}}function render(){objects.innerHTML='';rects.forEach((base,i)=>{const r=mode==='edit'?base:displayRect(base);addBlock(r,i,r.x,r.y)});schedule()}function setMode(next){mode=next;drawing=false;previewbox.style.display='none';document.body.classList.toggle('editmode',mode==='edit');document.body.classList.toggle('composemode',mode==='compose');if(mode==='edit'){action.textContent='Done';hint.textContent='Drag empty grid squares to paint · click a rectangle to delete';clearDemo()}else if(mode==='compose'){action.textContent='Preview';hint.textContent='Arrow keys move the composition · edges wrap';clearDemo()}else{action.textContent='Edit';hint.textContent='Hover — interest · idle — dwell';schedule()}render()}action.onclick=e=>{e.stopPropagation();if(mode==='view')setMode('edit');else if(mode==='edit')setMode('compose');else setMode('view')};surface.onpointerdown=e=>{if(mode!=='edit'||e.button!==0||e.target.closest('.block'))return;drawing=true;start=cell(e.clientX,e.clientY);previewbox.style.display='block';surface.setPointerCapture(e.pointerId)};surface.onpointermove=e=>{if(!drawing)return;const q=box(start,cell(e.clientX,e.clientY));Object.assign(previewbox.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:intersects(q)?'rgba(255,255,255,.08)':'rgba(255,255,255,.3)'})};surface.onpointerup=e=>{if(!drawing)return;drawing=false;const q=box(start,cell(e.clientX,e.clientY));previewbox.style.display='none';if(!intersects(q)){rects.push(q);render()}};document.addEventListener('keydown',e=>{if(mode!=='compose')return;let moved=true;if(e.key==='ArrowLeft')offsetX-=U;else if(e.key==='ArrowRight')offsetX+=U;else if(e.key==='ArrowUp')offsetY-=U;else if(e.key==='ArrowDown')offsetY+=U;else moved=false;if(moved){e.preventDefault();render()}});document.getElementById('less').onclick=()=>{if(mode!=='compose')return;gutter=Math.max(0,gutter-U);gutterValue.textContent=gutter;render()};document.getElementById('more').onclick=()=>{if(mode!=='compose')return;gutter=Math.min(U*3,gutter+U);gutterValue.textContent=gutter;render()};addEventListener('resize',()=>mode!=='edit'&&render());setMode('view');</script></body></html>
