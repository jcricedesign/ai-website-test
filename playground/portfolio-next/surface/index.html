<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Diverse Sources</title><style>:root{--u:48px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif;touch-action:none}.surface{position:fixed;inset:0;overflow:hidden;background:#171716;cursor:crosshair}.surface:before{content:"";position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413)}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;overflow:hidden;cursor:grab;transition:left .25s ease,top .25s ease}.block.dragging{transition:none;z-index:10;opacity:.88;cursor:grabbing}.block video,.block img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.04);pointer-events:none}.block.map img{object-fit:contain;background:#e8e8e5}.edge{position:absolute;right:0;top:0;width:22px;height:100%;z-index:6;cursor:e-resize;background:linear-gradient(to left,rgba(255,255,255,.30),rgba(255,255,255,.08) 60%,transparent);border-right:3px solid rgba(255,255,255,.65)}.block:hover .edge{background:linear-gradient(to left,rgba(255,255,255,.55),rgba(255,255,255,.16) 65%,transparent);border-right-color:#fff}.kind{position:absolute;left:7px;bottom:6px;z-index:5;color:#fff;background:rgba(0,0,0,.56);padding:3px 5px;font:9px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.controls{position:fixed;right:28px;top:24px;z-index:100}.controls button{border:0;background:rgba(255,255,255,.05);color:rgba(255,255,255,.68);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px 12px}.controls button:hover,.controls button.active{color:#fff;background:rgba(255,255,255,.1)}.preview,.pullpreview{position:fixed;display:none;z-index:50;background:rgba(255,255,255,.24);outline:1px solid rgba(255,255,255,.6);pointer-events:none}.preview:after,.pullpreview:after{content:attr(data-kind);position:absolute;left:8px;top:8px;color:#fff;background:rgba(0,0,0,.55);padding:4px 6px;font:10px Arial;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}.hint{position:fixed;left:24px;bottom:22px;color:rgba(255,255,255,.35);font:10px Arial;letter-spacing:.08em;text-transform:uppercase}.sound{position:fixed;right:28px;bottom:22px;border:0;background:none;color:rgba(255,255,255,.28);font:10px Arial;text-transform:uppercase}</style></head><body><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="preview" id="preview"></div><div class="pullpreview" id="pullpreview"></div></div><div class="controls"><button id="sourceBtn">Add Source</button></div><div class="hint" id="hint">Draw = discover · pull lit edge = follow · drag = relate</div><button class="sound" id="sound">Sound on</button><script>
const U=48,PD='https://commons.wikimedia.org/wiki/Special:Redirect/file/';
const DECK=[
 {type:'video',label:'weather',src:'https://www.nesdis.noaa.gov/s3/2021-07/104640_Katrina.mp4',at:.18},
 {type:'slideshow',label:'aftermath',slides:[PD+'17StreetCanalWestEndAfterKatrina.jpg',PD+'NOAA_Katrina_NOLA_17th_Street_breach_Aug_31_2005.jpg',PD+'Katrina-track-08-23-2005.jpg']},
 {type:'map',label:'storm track',src:PD+'Katrina_2005_path.png'},
 {type:'photo',label:'levee breach',src:PD+'NOAA_Katrina_NOLA_17th_Street_breach_Aug_31_2005.jpg'},
 {type:'video',label:'storm',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hurricane_Katrina_Impacts_the_U.S..webm',at:.48},
 {type:'photo',label:'aftermath',src:PD+'17StreetCanalWestEndAfterKatrina.jpg'},
 {type:'map',label:'first advisory',src:PD+'Katrina-track-08-23-2005.jpg'},
 {type:'video',label:'satellite',src:'https://www.nesdis.noaa.gov/s3/2025-08/Katrina-2005-09-01-am.mp4',at:.62}
];
const $=x=>document.getElementById(x),surface=$('surface'),objects=$('objects'),preview=$('preview'),pullpreview=$('pullpreview'),sourceBtn=$('sourceBtn'),hint=$('hint'),soundBtn=$('sound');let rects=[],els=new Map(),nextId=1,gesture=null,pointer=null,start=null,dragRec=null,dx=0,dy=0,pullParent=null,pullEnd=0,loaded=false,soundOn=true,audio=null;
function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){let x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);return{x,y,w:Math.max(a.x,b.x)-x+U,h:Math.max(a.y,b.y)-y+U}}function hit(q,ignore){return rects.some(r=>r!==ignore&&!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}
function nextSourceIndex(parent=null){return parent?(parent.sourceIndex+1):rects.length}function nextLabel(parent=null){return DECK[nextSourceIndex(parent)%DECK.length].label}
function tone(r){if(!soundOn)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.value=120+((r.x/U+r.y/U)%5)*22;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.018,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.7)}
function material(rec,b){if(rec.made)return;rec.made=true;let s=DECK[rec.sourceIndex%DECK.length];b.classList.toggle('map',s.type==='map');let tag=document.createElement('div');tag.className='kind';tag.textContent=s.label;b.appendChild(tag);if(s.type==='video'){let v=document.createElement('video');v.src=s.src;v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload='metadata';v.onloadedmetadata=()=>{v.currentTime=v.duration*(s.at||0);v.play().catch(()=>{})};b.insertBefore(v,b.firstChild)}else{let img=document.createElement('img');b.insertBefore(img,b.firstChild);if(s.type==='slideshow'){let i=0;img.src=s.slides[0];rec.timer=setInterval(()=>{i=(i+1)%s.slides.length;img.src=s.slides[i]},3200)}else img.src=s.src}}
function make(rec){let b=document.createElement('div');b.className='block';let edge=document.createElement('div');edge.className='edge';edge.title='Pull for more';b.appendChild(edge);objects.appendChild(b);els.set(rec.id,b);edge.onpointerdown=e=>beginPull(e,rec);b.onpointerdown=e=>{if(e.target!==edge)beginDrag(e,rec)};b.ondblclick=e=>{e.stopPropagation();remove(rec)};if(loaded)material(rec,b);return b}function layout(){rects.forEach(r=>{let b=els.get(r.id)||make(r);if(!b.classList.contains('dragging'))Object.assign(b.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});if(loaded)material(r,b)})}function remove(r){clearInterval(r.timer);els.get(r.id)?.remove();els.delete(r.id);rects=rects.filter(x=>x!==r)}function add(q,parent){if(hit(q))return;let r={...q,id:nextId++,sourceIndex:nextSourceIndex(parent),made:false};rects.push(r);tone(r);make(r);if(loaded)material(r,els.get(r.id));layout()}
function beginPaint(e){if(e.button!==0||e.target.closest('.block'))return;gesture='paint';pointer=e.pointerId;start=cell(e.clientX,e.clientY);preview.dataset.kind=nextLabel();preview.style.display='block';surface.setPointerCapture(pointer);movePaint(e.clientX,e.clientY)}function movePaint(x,y){let q=box(start,cell(x,y));Object.assign(preview.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:hit(q)?'rgba(255,255,255,.06)':'rgba(255,255,255,.24)'})}
function beginDrag(e,r){e.preventDefault();e.stopPropagation();gesture='drag';pointer=e.pointerId;dragRec=r;dx=e.clientX-r.x;dy=e.clientY-r.y;let b=els.get(r.id);b.classList.add('dragging');b.setPointerCapture(pointer)}function beginPull(e,r){e.preventDefault();e.stopPropagation();gesture='pull';pointer=e.pointerId;pullParent=r;pullpreview.dataset.kind=nextLabel(r);e.currentTarget.setPointerCapture(pointer);movePull(e.clientX)}function movePull(x){let sx=pullParent.x+pullParent.w,ex=Math.max(sx+U,Math.round(x/U)*U);pullEnd=ex;Object.assign(pullpreview.style,{display:'block',left:sx+'px',top:pullParent.y+'px',width:(ex-sx)+'px',height:pullParent.h+'px'})}
surface.onpointerdown=beginPaint;window.onpointermove=e=>{if(e.pointerId!==pointer)return;if(gesture==='paint')movePaint(e.clientX,e.clientY);if(gesture==='drag'){let b=els.get(dragRec.id);b.style.left=e.clientX-dx+'px';b.style.top=e.clientY-dy+'px'}if(gesture==='pull')movePull(e.clientX)};window.onpointerup=e=>{if(e.pointerId!==pointer)return;if(gesture==='paint'){let q=box(start,cell(e.clientX,e.clientY));if(!hit(q))add(q)}if(gesture==='drag'){let q={x:Math.round((e.clientX-dx)/U)*U,y:Math.round((e.clientY-dy)/U)*U,w:dragRec.w,h:dragRec.h};if(!hit(q,dragRec)){dragRec.x=q.x;dragRec.y=q.y}els.get(dragRec.id).classList.remove('dragging')}if(gesture==='pull'){let q={x:pullParent.x+pullParent.w,y:pullParent.y,w:Math.max(U,pullEnd-(pullParent.x+pullParent.w)),h:pullParent.h};if(!hit(q))add(q,pullParent)}preview.style.display=pullpreview.style.display='none';gesture=pointer=dragRec=pullParent=null;layout()};
sourceBtn.onclick=()=>{if(!rects.length){hint.textContent='Draw a rectangle first';return}loaded=true;sourceBtn.classList.add('active');rects.forEach(r=>material(r,els.get(r.id)||make(r)));hint.textContent='Different source types live · draw or pull for more'};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off'};layout();
</script></body></html>
