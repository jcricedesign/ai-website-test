<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Edge Resize</title><style>:root{--u:48px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;left:50%;top:46%;width:min(84vw,1120px);height:min(74vh,740px);transform:translate(-50%,-50%)}.block{position:absolute;background:#d8d8d5;z-index:2;cursor:grab;user-select:none;transform-origin:center;transition:left .85s var(--ease),top .85s var(--ease),width .85s var(--ease),height .85s var(--ease),opacity .72s ease,filter .72s ease,transform .72s var(--spring)}.stage.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.62);opacity:.58}.block.intent{filter:brightness(1.18)!important;transform:scale(1.02)}.block.demo-focus{filter:brightness(1.12)!important;transform:scale(1.016)}.block.dragging{transition:filter .2s,opacity .2s,transform .2s;filter:brightness(1.22)!important;z-index:6}.block.commit{animation:snap .48s var(--spring)}@keyframes snap{0%{transform:scale(1)}48%{transform:scale(1.045)}100%{transform:scale(1)}}.handle{position:absolute;z-index:9;opacity:0;transition:opacity .3s ease;background:transparent}.block:hover .handle,.block.resizing .handle{opacity:1}.handle:after{content:"";position:absolute;background:rgba(20,20,20,.48);border:1px solid rgba(255,255,255,.7)}.handle.n,.handle.s{left:18%;width:64%;height:16px}.handle.n{top:-8px;cursor:ns-resize}.handle.s{bottom:-8px;cursor:ns-resize}.handle.n:after,.handle.s:after{left:0;right:0;top:7px;height:1px}.handle.e,.handle.w{top:18%;height:64%;width:16px}.handle.e{right:-8px;cursor:ew-resize}.handle.w{left:-8px;cursor:ew-resize}.handle.e:after,.handle.w:after{top:0;bottom:0;left:7px;width:1px}.b1{left:14%;top:22%;width:22%;height:38%}.b2{left:40%;top:22%;width:22%;height:38%}.b3{left:66%;top:22%;width:22%;height:38%}.b4{left:14%;top:62%;width:22%;height:18%}.b5{left:40%;top:62%;width:22%;height:18%;background:#a9a9a7}.b6{left:66%;top:62%;width:22%;height:18%;background:#555553}.b7,.b8{opacity:0;pointer-events:none}.layout-2 .b1{left:14%;top:22%;width:74%;height:17%}.layout-2 .b2{left:14%;top:42%;width:74%;height:17%}.layout-2 .b3{left:14%;top:62%;width:74%;height:17%;background:#a9a9a7}.layout-2 .b4,.layout-2 .b5,.layout-2 .b6{opacity:0;pointer-events:none}.layout-3 .b1{left:14%;top:22%;width:44%;height:39%}.layout-3 .b2{left:60%;top:22%;width:27%;height:18%;background:#a9a9a7}.layout-3 .b3{left:60%;top:42%;width:12%;height:18%;background:#a9a9a7}.layout-3 .b4{left:75%;top:42%;width:12%;height:18%}.layout-3 .b5{left:14%;top:63%;width:22%;height:18%}.layout-3 .b6{left:38%;top:63%;width:20%;height:9%;background:#555553}.layout-3 .b7{opacity:1;left:38%;top:74%;width:20%;height:8%;background:#a9a9a7;pointer-events:auto}.layout-3 .b8{opacity:1;left:60%;top:63%;width:27%;height:9%;background:#555553;pointer-events:auto}.layout-4 .b1{left:14%;top:22%;width:74%;height:39%}.layout-4 .b2{left:14%;top:63%;width:22%;height:18%;background:#a9a9a7}.layout-4 .b3{left:38%;top:63%;width:20%;height:8%;background:#a9a9a7}.layout-4 .b4{left:38%;top:73%;width:20%;height:8%}.layout-4 .b5{left:60%;top:63%;width:28%;height:18%;background:#a9a9a7}.layout-4 .b6,.layout-4 .b7,.layout-4 .b8{opacity:0;pointer-events:none}.pager{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:14px;z-index:99}.pager button{appearance:none;border:1px solid rgba(255,255,255,.3);width:14px;height:14px;border-radius:50%;padding:0;background:rgba(255,255,255,.38);cursor:pointer}.pager button.active{background:#fff;transform:scale(1.12)}.edgehint{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);color:rgba(255,255,255,.3);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px Arial}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body><div class="surface"><div class="grid"></div><div class="stage" id="stage"><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i></div><nav class="pager"><button class="active" data-layout="1"></button><button data-layout="2"></button><button data-layout="3"></button><button data-layout="4"></button></nav></div><div class="edgehint">hover an edge · pull · release to snap to 48px grid</div><div class="hint">edge — resize · body — merge / divide</div><script>const stage=document.getElementById('stage'),blocks=[...stage.querySelectorAll('.block')],dots=[...document.querySelectorAll('.pager button')];let layout=1,idle,demo,idx=0,hovered=null,drag=null,resize=null;blocks.forEach(b=>{['n','e','s','w'].forEach(edge=>{const h=document.createElement('span');h.className='handle '+edge;h.dataset.edge=edge;b.appendChild(h)})});const visible=()=>blocks.filter(b=>getComputedStyle(b).opacity!=='0'&&getComputedStyle(b).pointerEvents!=='none');function clearDemo(){clearTimeout(idle);clearInterval(demo);blocks.forEach(b=>b.classList.remove('demo-focus'))}function schedule(){clearDemo();if(hovered||drag||resize)return;idle=setTimeout(()=>{const list=visible();if(!list.length)return;idx=Math.floor(Math.random()*list.length);stage.classList.add('has-intent');list[idx].classList.add('demo-focus');demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx=(idx+1)%list.length;list[idx].classList.add('demo-focus')},4200)},6500)}function resetCustom(){blocks.forEach(b=>{['left','top','width','height','opacity','pointer-events'].forEach(p=>b.style.removeProperty(p));b.dataset.merged='0'})}function setLayout(n){layout=n;clearDemo();resetCustom();stage.className='stage '+(n===1?'':'layout-'+n);dots.forEach((d,j)=>d.classList.toggle('active',j===n-1));schedule()}dots.forEach(d=>d.onclick=e=>{e.stopPropagation();setLayout(Number(d.dataset.layout))});function px(el,p){return parseFloat(getComputedStyle(el)[p])}function snap(v){return Math.round(v/48)*48}blocks.forEach(b=>{b.onmouseenter=()=>{if(drag||resize)return;hovered=b;clearDemo();stage.classList.add('has-intent');blocks.forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{if(drag||resize)return;hovered=null;b.classList.remove('intent');stage.classList.remove('has-intent');schedule()};b.onpointerdown=e=>{if(e.button!==0)return;const h=e.target.closest('.handle');clearDemo();e.preventDefault();const sr=stage.getBoundingClientRect(),r=b.getBoundingClientRect();if(h){resize={b,edge:h.dataset.edge,x:e.clientX,y:e.clientY,left:r.left-sr.left,top:r.top-sr.top,w:r.width,h:r.height};b.classList.add('resizing');h.setPointerCapture(e.pointerId);return}drag={b,x:e.clientX,y:e.clientY,merged:b.dataset.merged==='1'};b.classList.add('dragging');b.setPointerCapture(e.pointerId)}});stage.onpointermove=e=>{if(resize){const q=resize,dx=e.clientX-q.x,dy=e.clientY-q.y,min=48;if(q.edge==='e')q.b.style.width=Math.max(min,q.w+dx)+'px';if(q.edge==='s')q.b.style.height=Math.max(min,q.h+dy)+'px';if(q.edge==='w'){const w=Math.max(min,q.w-dx);q.b.style.left=(q.left+q.w-w)+'px';q.b.style.width=w+'px'}if(q.edge==='n'){const h=Math.max(min,q.h-dy);q.b.style.top=(q.top+q.h-h)+'px';q.b.style.height=h+'px'}return}if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.b.style.transform=`translate(${dx*.10}px,${dy*.10}px) scale(1.03)`}};stage.onpointerup=e=>{if(resize){const q=resize,b=q.b,sr=stage.getBoundingClientRect(),r=b.getBoundingClientRect();let l=snap(r.left-sr.left),t=snap(r.top-sr.top),right=snap(r.right-sr.left),bottom=snap(r.bottom-sr.top);if(right-l<48)right=l+48;if(bottom-t<48)bottom=t+48;b.style.left=l+'px';b.style.top=t+'px';b.style.width=(right-l)+'px';b.style.height=(bottom-t)+'px';b.classList.remove('resizing');b.classList.add('commit');setTimeout(()=>b.classList.remove('commit'),520);resize=null;schedule();return}if(drag){drag.b.classList.remove('dragging');drag.b.style.transform='';drag.b.classList.add('commit');setTimeout(()=>drag&&drag.b.classList.remove('commit'),520);drag=null;schedule()}};schedule();</script></body></html>
