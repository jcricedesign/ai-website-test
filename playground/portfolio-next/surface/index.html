<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Paint Layout</title><style>:root{--u:48px;--attention:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;transition:filter .5s,opacity .5s;animation:gridBreath 28s ease-in-out infinite alternate}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;transform-origin:center;transition:opacity .82s var(--attention),filter .82s var(--attention),transform .82s var(--attention)}.objects.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.62);opacity:.58}.block.intent{filter:brightness(1.18)!important;opacity:1!important;transform:scale(1.025)}.block.demo-focus{filter:brightness(1.12)!important;opacity:1!important;transform:scale(1.016)}.edit{position:fixed;right:28px;top:24px;z-index:100;border:0;background:none;color:rgba(255,255,255,.55);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px}.edit:hover{color:#fff}.editmode .grid{opacity:1!important;filter:brightness(2.4)}.editmode .block{opacity:.72;filter:saturate(0)}.editmode .block:hover{opacity:.38;cursor:crosshair}.editmode .surface{cursor:crosshair}.preview{position:absolute;display:none;z-index:3;background:rgba(255,255,255,.3);outline:1px solid rgba(255,255,255,.65);pointer-events:none}.hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:100;color:rgba(255,255,255,.3);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.editmode .hint{color:rgba(255,255,255,.55)}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="preview" id="preview"></div></div><button class="edit" id="edit">Edit</button><div class="hint" id="hint">Edit to draw a composition</div><script>const U=48,surface=document.getElementById('surface'),objects=document.getElementById('objects'),preview=document.getElementById('preview'),edit=document.getElementById('edit'),hint=document.getElementById('hint');let editing=false,drawing=false,start=null,idle,demo,idx=0,hovered=null;const rects=[];function visible(){return [...objects.querySelectorAll('.block')]}function clearDemo(){clearTimeout(idle);clearInterval(demo);visible().forEach(b=>b.classList.remove('demo-focus'));objects.classList.remove('has-intent')}function schedule(){clearDemo();if(editing||hovered)return;idle=setTimeout(()=>{const list=visible();if(!list.length)return;idx=Math.floor(Math.random()*list.length);objects.classList.add('has-intent');list[idx].classList.add('demo-focus');demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx=(idx+1)%list.length;list[idx].classList.add('demo-focus')},4200)},6500)}function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){const l=Math.min(a.x,b.x),t=Math.min(a.y,b.y),r=Math.max(a.x,b.x)+U,bt=Math.max(a.y,b.y)+U;return{x:l,y:t,w:r-l,h:bt-t}}function intersects(q){return rects.some(r=>!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}function render(){objects.innerHTML='';rects.forEach((r,i)=>{const b=document.createElement('div');b.className='block';Object.assign(b.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});b.onmouseenter=()=>{if(editing)return;hovered=b;clearDemo();objects.classList.add('has-intent');visible().forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{if(editing)return;hovered=null;b.classList.remove('intent');objects.classList.remove('has-intent');schedule()};b.onclick=e=>{if(!editing)return;e.stopPropagation();rects.splice(i,1);render()};objects.appendChild(b)});schedule()}function setEdit(on){editing=on;drawing=false;preview.style.display='none';document.body.classList.toggle('editmode',on);edit.textContent=on?'Done':'Edit';hint.textContent=on?'Drag empty grid squares to paint · click a rectangle to delete':'Edit to draw a composition';if(on)clearDemo();else schedule()}edit.onclick=e=>{e.stopPropagation();setEdit(!editing)};surface.onpointerdown=e=>{if(!editing||e.button!==0||e.target.closest('.block'))return;drawing=true;start=cell(e.clientX,e.clientY);preview.style.display='block';surface.setPointerCapture(e.pointerId)};surface.onpointermove=e=>{if(!drawing)return;const q=box(start,cell(e.clientX,e.clientY));Object.assign(preview.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:intersects(q)?'rgba(255,255,255,.08)':'rgba(255,255,255,.3)'})};surface.onpointerup=e=>{if(!drawing)return;drawing=false;const q=box(start,cell(e.clientX,e.clientY));preview.style.display='none';if(!intersects(q)){rects.push(q);render()}};setEdit(false);</script></body></html>
