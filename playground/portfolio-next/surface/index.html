<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Responsive Structure</title><style>:root{--u:48px;--field:#171716;--grid:rgba(255,255,255,.042);--rule:rgba(255,255,255,.72);--object:#d8d8d5;--gutter:14px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:var(--field)}.surface::before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110 0%,#1b1b19 48%,#141413 100%);animation:breathe 34s ease-in-out infinite alternate;transform:scale(1.05)}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:var(--u) var(--u);background-position:-1px -1px;mix-blend-mode:screen;animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;left:calc(var(--u) * 2);top:calc(var(--u) * 2);width:calc(var(--u) * 20);height:calc(var(--u) * 15);transition:width 900ms cubic-bezier(.2,.8,.2,1),height 900ms cubic-bezier(.2,.8,.2,1)}.frame{position:absolute;inset:0;border-left:3px solid var(--rule);border-top:3px solid var(--rule);border-right:3px solid var(--rule);border-bottom:3px solid var(--rule);pointer-events:none;transition:all 900ms cubic-bezier(.2,.8,.2,1)}.rule{position:absolute;background:var(--rule);transition:all 900ms cubic-bezier(.2,.8,.2,1)}.v-main{left:calc(var(--u) * 12);top:calc(var(--u) * 4);width:3px;height:calc(var(--u) * 9)}.h-main{left:0;top:calc(var(--u) * 4);height:3px;width:100%}.h-low{left:calc(var(--u) * 3);top:calc(var(--u) * 13);height:3px;width:calc(var(--u) * 15)}.blocks{position:absolute;inset:0}.block{position:absolute;background:var(--object);transition:left 900ms cubic-bezier(.2,.8,.2,1),top 900ms cubic-bezier(.2,.8,.2,1),width 900ms cubic-bezier(.2,.8,.2,1),height 900ms cubic-bezier(.2,.8,.2,1),opacity 500ms ease;box-shadow:0 0 0 0 rgba(255,255,255,0)}.b1{left:calc(var(--u) * 1);top:calc(var(--u) * 5);width:calc(var(--u) * 10);height:calc(var(--u) * 6)}.b2{left:calc(var(--u) * 13);top:calc(var(--u) * 5);width:calc(var(--u) * 5);height:calc(var(--u) * 3)}.b3{left:calc(var(--u) * 13);top:calc(var(--u) * 9);width:calc(var(--u) * 2.5);height:calc(var(--u) * 2.5)}.b4{left:calc(var(--u) * 16);top:calc(var(--u) * 9);width:calc(var(--u) * 2);height:calc(var(--u) * 2.5)}.b5{left:calc(var(--u) * 1);top:calc(var(--u) * 12);width:calc(var(--u) * 4.5);height:calc(var(--u) * 2)}.b6{left:calc(var(--u) * 6);top:calc(var(--u) * 12);width:calc(var(--u) * 5);height:calc(var(--u) * 1)}.b7{left:calc(var(--u) * 6);top:calc(var(--u) * 13.4);width:calc(var(--u) * 5);height:calc(var(--u) * 1.6)}.b8{left:calc(var(--u) * 13);top:calc(var(--u) * 12);width:calc(var(--u) * 5);height:calc(var(--u) * 1)}.stage.layout-b .v-main{left:calc(var(--u) * 9);top:calc(var(--u) * 2);height:calc(var(--u) * 12)}.stage.layout-b .h-main{top:calc(var(--u) * 6)}.stage.layout-b .h-low{left:calc(var(--u) * 9);top:calc(var(--u) * 11);width:calc(var(--u) * 9)}.stage.layout-b .b1{left:calc(var(--u) * 1);top:calc(var(--u) * 1);width:calc(var(--u) * 7);height:calc(var(--u) * 4)}.stage.layout-b .b2{left:calc(var(--u) * 10);top:calc(var(--u) * 1);width:calc(var(--u) * 8);height:calc(var(--u) * 4)}.stage.layout-b .b3{left:calc(var(--u) * 1);top:calc(var(--u) * 7);width:calc(var(--u) * 3);height:calc(var(--u) * 3)}.stage.layout-b .b4{left:calc(var(--u) * 5);top:calc(var(--u) * 7);width:calc(var(--u) * 3);height:calc(var(--u) * 3)}.stage.layout-b .b5{left:calc(var(--u) * 10);top:calc(var(--u) * 7);width:calc(var(--u) * 3);height:calc(var(--u) * 3)}.stage.layout-b .b6{left:calc(var(--u) * 14);top:calc(var(--u) * 7);width:calc(var(--u) * 4);height:calc(var(--u) * 3)}.stage.layout-b .b7{left:calc(var(--u) * 10);top:calc(var(--u) * 12);width:calc(var(--u) * 8);height:calc(var(--u) * 2)}.stage.layout-b .b8{left:calc(var(--u) * 1);top:calc(var(--u) * 11);width:calc(var(--u) * 7);height:calc(var(--u) * 3)}.stage.layout-c .v-main{left:calc(var(--u) * 14);top:0;height:calc(var(--u) * 15)}.stage.layout-c .h-main{top:calc(var(--u) * 8)}.stage.layout-c .h-low{left:0;top:calc(var(--u) * 12);width:calc(var(--u) * 14)}.stage.layout-c .b1{left:calc(var(--u) * 1);top:calc(var(--u) * 1);width:calc(var(--u) * 12);height:calc(var(--u) * 6)}.stage.layout-c .b2{left:calc(var(--u) * 15);top:calc(var(--u) * 1);width:calc(var(--u) * 3);height:calc(var(--u) * 3)}.stage.layout-c .b3{left:calc(var(--u) * 15);top:calc(var(--u) * 5);width:calc(var(--u) * 3);height:calc(var(--u) * 2)}.stage.layout-c .b4{left:calc(var(--u) * 1);top:calc(var(--u) * 9);width:calc(var(--u) * 4);height:calc(var(--u) * 2)}.stage.layout-c .b5{left:calc(var(--u) * 6);top:calc(var(--u) * 9);width:calc(var(--u) * 3);height:calc(var(--u) * 2)}.stage.layout-c .b6{left:calc(var(--u) * 10);top:calc(var(--u) * 9);width:calc(var(--u) * 3);height:calc(var(--u) * 2)}.stage.layout-c .b7{left:calc(var(--u) * 1);top:calc(var(--u) * 13);width:calc(var(--u) * 8);height:calc(var(--u) * 1.5)}.stage.layout-c .b8{left:calc(var(--u) * 10);top:calc(var(--u) * 13);width:calc(var(--u) * 8);height:calc(var(--u) * 1.5)}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px/1.3 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;user-select:none}.hint strong{color:rgba(255,255,255,.48);font-weight:400}@keyframes breathe{0%{transform:translate3d(-2%,-1%,0) scale(1.06);filter:brightness(.94)}45%{transform:translate3d(1%,2%,0) scale(1.08);filter:brightness(1.02)}100%{transform:translate3d(3%,-2%,0) scale(1.06);filter:brightness(.97)}}@keyframes gridBreath{0%{opacity:.68}40%{opacity:.94}72%{opacity:.74}100%{opacity:.88}}@media(prefers-reduced-motion:reduce){.surface::before,.grid{animation:none}.stage,.rule,.block{transition:none}}@media(max-width:1100px){:root{--u:36px}.stage{left:36px;top:36px}}@media(max-width:760px){:root{--u:24px}.stage{left:24px;top:24px}}</style></head><body><div class="surface"><div class="grid"></div><div class="stage" id="stage"><div class="frame"></div><i class="rule v-main"></i><i class="rule h-main"></i><i class="rule h-low"></i><div class="blocks"><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i></div></div></div><div class="hint">click / space — <strong>reconfigure</strong></div><script>const stage=document.getElementById('stage');const layouts=['','layout-b','layout-c'];let i=0;function next(){i=(i+1)%layouts.length;stage.className='stage '+layouts[i]}document.addEventListener('click',next);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();next()}});</script></body></html>
