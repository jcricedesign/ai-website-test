<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Paint Pull Drag</title><style>:root{--u:48px;--ease:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif;touch-action:none}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;pointer-events:none;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;animation:gridBreath 28s ease-in-out infinite alternate}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;overflow:hidden;transition:left .3s var(--ease),top .3s var(--ease),width .3s var(--ease),height .3s var(--ease),opacity .3s}.block.dragging{transition:none;z-index:10;opacity:.86}.block video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);pointer-events:none}.edge{position:absolute;right:0;top:0;width:14px;height:100%;z-index:5;cursor:e-resize}.edge:after{content:"";position:absolute;right:2px;top:50%;width:2px;height:24px;transform:translateY(-50%);background:rgba(255,255,255,0);transition:background .2s}.block:hover .edge:after{background:rgba(255,255,255,.32)}.controls{position:fixed;right:28px;top:24px;z-index:100;display:flex;gap:4px}.controls button{border:0;background:none;color:rgba(255,255,255,.45);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px 12px}.controls button:hover,.controls button.active{color:#fff}.controls button.active{background:rgba(255,255,255,.07)}.editmode .grid,.movemode .grid{filter:brightness(2.2)}.previewbox{position:fixed;display:none;z-index:50;background:rgba(255,255,255,.3);outline:1px solid rgba(255,255,255,.65);pointer-events:none}.pullpreview{position:fixed;display:none;z-index:4;background:rgba(255,255,255,.16);outline:1px solid rgba(255,255,255,.38);pointer-events:none}.movebar{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:none;gap:12px;color:rgba(255,255,255,.48);font:10px Arial;letter-spacing:.08em;text-transform:uppercase}.movemode .movebar{display:flex}.hint{position:fixed;left:24px;bottom:22px;z-index:100;color:rgba(255,255,255,.34);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.sound{position:fixed;right:28px;bottom:22px;z-index:100;border:0;background:none;color:rgba(255,255,255,.28);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body class="viewmode"><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="previewbox" id="previewbox"></div><div class="pullpreview" id="pullpreview"></div></div><div class="controls"><button id="editBtn">Edit</button><button id="moveBtn">Move</button><button id="videoBtn">Katrina</button></div><div class="movebar">Drag an object to relate · arrow keys move all</div><div class="hint" id="hint">Paint = discover · pull right edge = follow · Move = arrange</div><button class="sound" id="sound">Sound on</button><script>
const U=48,DECK=[
{name:'NOAA satellite',src:'https://www.nesdis.noaa.gov/s3/2021-07/104640_Katrina.mp4',at:.12},{name:'Katrina impacts U.S.',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hurricane_Katrina_Impacts_the_U.S..webm',at:.42},{name:'Arrival animation',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Katrina_Arrival_Animation.ogv',at:.2},{name:'GOES-12',src:'https://www.nesdis.noaa.gov/s3/2025-08/Katrina-2005-09-01-am.mp4',at:.62},{name:'NOAA satellite',src:'https://www.nesdis.noaa.gov/s3/2021-07/104640_Katrina.mp4',at:.58},{name:'Katrina impacts U.S.',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hurricane_Katrina_Impacts_the_U.S..webm',at:.78},{name:'Arrival animation',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Katrina_Arrival_Animation.ogv',at:.66},{name:'GOES-12',src:'https://www.nesdis.noaa.gov/s3/2025-08/Katrina-2005-09-01-am.mp4',at:.2}];
const $=id=>document.getElementById(id),surface=$('surface'),objects=$('objects'),previewbox=$('previewbox'),pullpreview=$('pullpreview'),editBtn=$('editBtn'),moveBtn=$('moveBtn'),videoBtn=$('videoBtn'),hint=$('hint'),soundBtn=$('sound');let mode='view',gesture=null,start=null,pointer=null,dragRec=null,dragDX=0,dragDY=0,pullParent=null,pullEnd=null,offsetX=0,offsetY=0,lastPreview='',soundOn=true,audio=null,materialLoaded=false,playing=false,nextId=1;const rects=[],els=new Map(),pent=[220,247,294,330,392];
function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(r){if(!soundOn)return;ensureAudio();const n=(Math.round(r.x/U)+Math.round(r.y/U))%5,now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=pent[n]*.55;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.018,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.62);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.7)}function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){const l=Math.min(a.x,b.x),t=Math.min(a.y,b.y),r=Math.max(a.x,b.x)+U,bt=Math.max(a.y,b.y)+U;return{x:l,y:t,w:r-l,h:bt-t}}function intersects(q,ignore=null){return rects.some(r=>r!==ignore&&!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}function source(rec){return DECK[rec.sourceIndex%DECK.length]}function attach(rec,b){if(rec.video)return;const s=source(rec),v=document.createElement('video');rec.video=v;v.src=s.src;v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';v.onloadedmetadata=()=>{v.currentTime=Math.max(0,v.duration*s.at);if(playing)v.play().catch(()=>{});status()};b.insertBefore(v,b.firstChild)}function status(){if(!materialLoaded)return;videoBtn.textContent=playing?'Pause video':'Play video';hint.textContent=mode==='move'?'Drag objects · pull right edge to follow · arrows move all':mode==='edit'?'Paint empty space · click object to delete · pull edge to follow':playing?'Playing · paint, pull, or Move while material stays live':'Paused · paint, pull, or Move while frames stay'}function make(rec){const b=document.createElement('div');b.className='block';const edge=document.createElement('div');edge.className='edge';b.appendChild(edge);objects.appendChild(b);els.set(rec.id,b);edge.onpointerdown=e=>beginPull(e,rec);b.onpointerdown=e=>{if(e.target===edge)return;if(mode==='move')beginDrag(e,rec)};b.onclick=e=>{if(mode==='edit'&&!gesture){e.stopPropagation();remove(rec)}};if(materialLoaded)attach(rec,b);return b}function remove(rec){if(rec.video)rec.video.pause();els.get(rec.id)?.remove();els.delete(rec.id);const i=rects.indexOf(rec);if(i>=0)rects.splice(i,1)}function layout(){rects.forEach(rec=>{let b=els.get(rec.id)||make(rec);if(!b.classList.contains('dragging'))Object.assign(b.style,{left:(rec.x+offsetX)+'px',top:(rec.y+offsetY)+'px',width:rec.w+'px',height:rec.h+'px'});if(materialLoaded&&!rec.video)attach(rec,b)});status()}function setMode(m){mode=m;editBtn.classList.toggle('active',m==='edit');moveBtn.classList.toggle('active',m==='move');document.body.className=m==='edit'?'editmode':m==='move'?'movemode':'viewmode';status()}
function beginPaint(e){if(mode!=='edit'||e.target.closest('.block'))return;e.preventDefault();gesture='paint';pointer=e.pointerId;start=cell(e.clientX,e.clientY);previewbox.style.display='block';surface.setPointerCapture(pointer);updatePaint(e.clientX,e.clientY)}function updatePaint(x,y){const q=box(start,cell(x,y));Object.assign(previewbox.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:intersects(q)?'rgba(255,255,255,.08)':'rgba(255,255,255,.3)'})}
function beginDrag(e,rec){e.preventDefault();e.stopPropagation();gesture='drag';pointer=e.pointerId;dragRec=rec;const b=els.get(rec.id);dragDX=e.clientX-(rec.x+offsetX);dragDY=e.clientY-(rec.y+offsetY);b.classList.add('dragging');b.setPointerCapture(pointer)}function updateDrag(x,y){const b=els.get(dragRec.id);b.style.left=(x-dragDX)+'px';b.style.top=(y-dragDY)+'px'}
function beginPull(e,rec){e.preventDefault();e.stopPropagation();gesture='pull';pointer=e.pointerId;pullParent=rec;pullEnd=rec.x+rec.w+U;const edge=e.currentTarget;edge.setPointerCapture(pointer);updatePull(e.clientX)}function updatePull(x){const startX=pullParent.x+pullParent.w,endX=Math.max(startX+U,Math.round((x-offsetX)/U)*U),w=endX-startX;pullEnd=endX;Object.assign(pullpreview.style,{display:'block',left:(startX+offsetX)+'px',top:(pullParent.y+offsetY)+'px',width:w+'px',height:pullParent.h+'px'})}
function instantiate(q,parent=null){if(intersects(q))return;const rec={...q,id:nextId++,sourceIndex:parent?(parent.sourceIndex+1):rects.length,video:null,parentId:parent?.id||null};rects.push(rec);tone(rec);make(rec);if(materialLoaded)attach(rec,els.get(rec.id));layout()}
surface.onpointerdown=beginPaint;window.onpointermove=e=>{if(e.pointerId!==pointer)return;if(gesture==='paint')updatePaint(e.clientX,e.clientY);else if(gesture==='drag')updateDrag(e.clientX,e.clientY);else if(gesture==='pull')updatePull(e.clientX)};window.onpointerup=e=>{if(e.pointerId!==pointer)return;if(gesture==='paint'){const q=box(start,cell(e.clientX,e.clientY));if(!intersects(q))instantiate(q)}else if(gesture==='drag'){const nx=Math.round((e.clientX-dragDX-offsetX)/U)*U,ny=Math.round((e.clientY-dragDY-offsetY)/U)*U,q={x:nx,y:ny,w:dragRec.w,h:dragRec.h};if(!intersects(q,dragRec)){dragRec.x=nx;dragRec.y=ny}els.get(dragRec.id).classList.remove('dragging')}else if(gesture==='pull'){const q={x:pullParent.x+pullParent.w,y:pullParent.y,w:Math.max(U,pullEnd-(pullParent.x+pullParent.w)),h:pullParent.h};if(!intersects(q))instantiate(q,pullParent)}previewbox.style.display='none';pullpreview.style.display='none';gesture=null;pointer=null;dragRec=null;pullParent=null;layout()};
editBtn.onclick=()=>{ensureAudio();setMode(mode==='edit'?'view':'edit')};moveBtn.onclick=()=>setMode(mode==='move'?'view':'move');videoBtn.onclick=()=>{if(!rects.length)return;if(!materialLoaded){materialLoaded=true;playing=true;rects.forEach(r=>attach(r,els.get(r.id)||make(r)))}else{playing=!playing;rects.forEach(r=>r.video&&(playing?r.video.play().catch(()=>{}):r.video.pause()))}videoBtn.classList.toggle('active',playing);status()};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off'};document.onkeydown=e=>{if(mode!=='move')return;if(e.key==='ArrowLeft')offsetX-=U;else if(e.key==='ArrowRight')offsetX+=U;else if(e.key==='ArrowUp')offsetY-=U;else if(e.key==='ArrowDown')offsetY+=U;else return;e.preventDefault();layout()};layout();
