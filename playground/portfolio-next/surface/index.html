<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Draw Move Video</title><style>:root{--u:48px;--attention:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif;touch-action:none}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;pointer-events:none;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;transition:filter 1s ease,opacity 1s ease;animation:gridBreath 28s ease-in-out infinite alternate}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;overflow:hidden;transform-origin:center;transition:left .55s var(--attention),top .55s var(--attention),width .55s var(--attention),height .55s var(--attention),opacity .9s var(--attention),filter .9s var(--attention),transform .9s var(--attention)}.block video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);pointer-events:none}.objects.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.62);opacity:.58}.block.intent{filter:brightness(1.18)!important;opacity:1!important;transform:scale(1.025)}.block.demo-focus{filter:brightness(1.12)!important;opacity:1!important;transform:scale(1.016)}.controls{position:fixed;right:28px;top:24px;z-index:100;display:flex;gap:4px}.controls button{border:0;background:none;color:rgba(255,255,255,.45);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px 12px;transition:color .25s,background .25s}.controls button:hover{color:#fff}.controls button.active{color:#fff;background:rgba(255,255,255,.07)}.editmode .grid,.movemode .grid{opacity:1!important;filter:brightness(2.2)}.viewmode .grid{filter:brightness(.82)}.editmode .block{opacity:.72}.editmode .block:hover{opacity:.38;cursor:crosshair}.editmode .surface{cursor:crosshair}.previewbox{position:fixed;display:none;z-index:50;background:rgba(255,255,255,.3);outline:1px solid rgba(255,255,255,.65);pointer-events:none}.movebar{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:12px;color:rgba(255,255,255,.48);font:10px Arial;letter-spacing:.08em;text-transform:uppercase}.movemode .movebar{display:flex}.movebar button{border:1px solid rgba(255,255,255,.18);background:rgba(20,20,20,.35);color:rgba(255,255,255,.65);padding:7px 10px;cursor:pointer}.sound{position:fixed;right:28px;bottom:22px;z-index:100;border:0;background:none;color:rgba(255,255,255,.28);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.hint{position:fixed;left:24px;bottom:22px;z-index:100;color:rgba(255,255,255,.3);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.editmode .hint,.movemode .hint{color:rgba(255,255,255,.5)}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body class="viewmode"><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="previewbox" id="previewbox"></div></div><div class="controls"><button id="editBtn">Edit</button><button id="moveBtn">Move</button><button id="videoBtn">Video</button></div><div class="movebar"><span>Gutter</span><button id="less">−48</button><span id="gutterValue">48</span><button id="more">+48</button></div><div class="hint" id="hint">Edit to draw · Move to position</div><button class="sound" id="sound">Sound on</button><script>const U=48,VIDEO='https://commons.wikimedia.org/wiki/Special:Redirect/file/A_Railway_Collision_(1900)_-_yt.webm',OFFSET=.75;const surface=document.getElementById('surface'),objects=document.getElementById('objects'),previewbox=document.getElementById('previewbox'),editBtn=document.getElementById('editBtn'),moveBtn=document.getElementById('moveBtn'),videoBtn=document.getElementById('videoBtn'),hint=document.getElementById('hint'),gutterValue=document.getElementById('gutterValue'),soundBtn=document.getElementById('sound');let mode='view',drawing=false,start=null,activePointer=null,demo,idx=0,hovered=null,offsetX=0,offsetY=0,gutterSteps=1,lastPreview='',soundOn=true,audio=null,videoOn=false,loadedVideos=0,failedVideos=0;const rects=[];const pent=[220,247,294,330,392];function visible(){return [...objects.querySelectorAll('.block[data-primary="1"]')]}function clearDemo(){clearInterval(demo);visible().forEach(b=>b.classList.remove('demo-focus'));objects.classList.remove('has-intent')}function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function freqForRect(r){const row=Math.round(r.y/U),col=Math.round(r.x/U),note=(col+row)%pent.length,oct=Math.max(.5,Math.min(2,1.5-r.y/innerHeight));return pent[note]*oct}function playTone(freq,{type='sine',gain=.035,attack=.07,duration=1.15,filter=1100}={}){if(!soundOn)return;ensureAudio();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,now);f.type='lowpass';f.frequency.value=filter;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+attack);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.12)}function shadowTone(r){playTone(freqForRect(r)*.5,{type:'triangle',gain:.018,attack:.025,duration:.62,filter:620})}function celebrationTone(i){const r=rects[i];if(r)playTone(freqForRect(r),{type:'sine',gain:.034,attack:.06,duration:1.25,filter:1200})}function celebrate(){if(videoOn)return;clearDemo();const list=visible();if(!list.length)return;idx=0;objects.classList.add('has-intent');list[0].classList.add('demo-focus');celebrationTone(0);demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx++;if(idx>=list.length){clearInterval(demo);objects.classList.remove('has-intent');return}list[idx].classList.add('demo-focus');celebrationTone(idx)},900)}function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){const l=Math.min(a.x,b.x),t=Math.min(a.y,b.y),r=Math.max(a.x,b.x)+U,bt=Math.max(a.y,b.y)+U;return{x:l,y:t,w:r-l,h:bt-t}}function intersects(q){return rects.some(r=>!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}function wrap(v,max){return((v%max)+max)%max}function compositionBounds(){if(!rects.length)return{cx:innerWidth/2,cy:innerHeight/2};let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;rects.forEach(q=>{l=Math.min(l,q.x);t=Math.min(t,q.y);r=Math.max(r,q.x+q.w);b=Math.max(b,q.y+q.h)});return{cx:(l+r)/2,cy:(t+b)/2}}function displayRect(r){const bounds=compositionBounds(),cx=r.x+r.w/2,cy=r.y+r.h/2,delta=(gutterSteps-1)*U;let gx=0,gy=0;if(delta!==0){if(cx<bounds.cx-U/2)gx=-delta;else if(cx>bounds.cx+U/2)gx=delta;if(cy<bounds.cy-U/2)gy=-delta;else if(cy>bounds.cy+U/2)gy=delta}return{x:wrap(r.x+offsetX+gx,innerWidth),y:wrap(r.y+offsetY+gy,innerHeight),w:r.w,h:r.h}}function updateVideoStatus(){if(!videoOn)return;if(failedVideos){hint.textContent='Video failed to load';videoBtn.textContent='Retry video'}else if(loadedVideos>=rects.length){hint.textContent='Playing · one source · 0.75s offsets';videoBtn.textContent='Stop video'}else{hint.textContent='Loading video '+loadedVideos+' / '+rects.length+'…';videoBtn.textContent='Loading…'}}function addVideo(b,i,primary){const v=document.createElement('video');v.src=VIDEO;v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.addEventListener('loadedmetadata',()=>{const usable=Math.max(2,v.duration-OFFSET*rects.length-1),base=Math.min(5,usable*.15);v.currentTime=(base+i*OFFSET)%usable;v.play().catch(()=>{});if(primary){loadedVideos++;updateVideoStatus()}},{once:true});if(primary)v.addEventListener('error',()=>{failedVideos++;updateVideoStatus()},{once:true});b.appendChild(v)}function addBlock(r,i,x,y,primary=true){const b=document.createElement('div');b.className='block';b.dataset.primary=primary?'1':'0';Object.assign(b.style,{left:x+'px',top:y+'px',width:r.w+'px',height:r.h+'px'});if(videoOn)addVideo(b,i,primary);if(primary){b.onmouseenter=()=>{if(mode!=='view'||videoOn)return;hovered=b;clearDemo();objects.classList.add('has-intent');visible().forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{if(mode!=='view'||videoOn)return;hovered=null;b.classList.remove('intent');objects.classList.remove('has-intent')};b.onclick=e=>{if(mode!=='edit')return;e.stopPropagation();rects.splice(i,1);render()}}objects.appendChild(b);const right=x+r.w,bottom=y+r.h;if(primary&&right>innerWidth)addBlock(r,i,x-innerWidth,y,false);if(primary&&bottom>innerHeight)addBlock(r,i,x,y-innerHeight,false);if(primary&&right>innerWidth&&bottom>innerHeight)addBlock(r,i,x-innerWidth,y-innerHeight,false)}function render(){objects.innerHTML='';rects.forEach((base,i)=>{const r=mode==='edit'?base:displayRect(base);addBlock(r,i,r.x,r.y,true)})}function cancelDraw(){drawing=false;activePointer=null;lastPreview='';previewbox.style.display='none'}function setMode(next,{celebrateOnExit=false}={}){const wasActive=mode!=='view';mode=next;videoOn=false;videoBtn.classList.remove('active');videoBtn.textContent='Video';document.body.classList.remove('videoactive');cancelDraw();clearDemo();document.body.classList.toggle('editmode',mode==='edit');document.body.classList.toggle('movemode',mode==='move');document.body.classList.toggle('viewmode',mode==='view');editBtn.classList.toggle('active',mode==='edit');moveBtn.classList.toggle('active',mode==='move');if(mode==='edit')hint.textContent='Paint rectangles · click a rectangle to delete';else if(mode==='move')hint.textContent='Arrow keys move the composition · edges wrap';else hint.textContent='Hover — interest';render();if(mode==='view'&&wasActive&&celebrateOnExit)setTimeout(celebrate,450)}function updatePreview(x,y){const q=box(start,cell(x,y)),key=q.x+','+q.y+','+q.w+','+q.h;if(key===lastPreview)return;lastPreview=key;Object.assign(previewbox.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:intersects(q)?'rgba(255,255,255,.08)':'rgba(255,255,255,.3)'})}editBtn.onclick=()=>{ensureAudio();if(mode==='edit')setMode('view',{celebrateOnExit:true});else setMode('edit')};moveBtn.onclick=()=>{ensureAudio();if(mode==='move')setMode('view',{celebrateOnExit:true});else setMode('move')};videoBtn.onclick=()=>{if(!rects.length)return;if(mode!=='view')setMode('view');clearDemo();videoOn=!videoOn;loadedVideos=0;failedVideos=0;videoBtn.classList.toggle('active',videoOn);document.body.classList.toggle('videoactive',videoOn);videoBtn.textContent=videoOn?'Loading…':'Video';hint.textContent=videoOn?'Loading archival film…':'Hover — interest';render()};soundBtn.onclick=()=>{ensureAudio();soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off'};surface.addEventListener('pointerdown',e=>{if(mode!=='edit'||e.button!==0||e.target.closest('.block'))return;e.preventDefault();ensureAudio();drawing=true;activePointer=e.pointerId;start=cell(e.clientX,e.clientY);lastPreview='';previewbox.style.display='block';surface.setPointerCapture(e.pointerId);updatePreview(e.clientX,e.clientY)});window.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();updatePreview(e.clientX,e.clientY)},{passive:false});window.addEventListener('pointerup',e=>{if(!drawing||e.pointerId!==activePointer)return;const q=box(start,cell(e.clientX,e.clientY));if(!intersects(q)){rects.push(q);shadowTone(q)}try{surface.releasePointerCapture(e.pointerId)}catch(_){}cancelDraw();render()});window.addEventListener('pointercancel',e=>{if(e.pointerId===activePointer)cancelDraw()});document.addEventListener('keydown',e=>{if(mode!=='move')return;let moved=true;if(e.key==='ArrowLeft')offsetX-=U;else if(e.key==='ArrowRight')offsetX+=U;else if(e.key==='ArrowUp')offsetY-=U;else if(e.key==='ArrowDown')offsetY+=U;else moved=false;if(moved){e.preventDefault();render()}});document.getElementById('less').onclick=()=>{if(mode!=='move')return;gutterSteps=Math.max(0,gutterSteps-1);gutterValue.textContent=gutterSteps*U;render()};document.getElementById('more').onclick=()=>{if(mode!=='move')return;gutterSteps=Math.min(3,gutterSteps+1);gutterValue.textContent=gutterSteps*U;render()};render();</script></body></html>
