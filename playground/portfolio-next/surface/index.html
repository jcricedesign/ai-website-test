<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Hover / Dwell</title><style>:root{--u:48px;--ease:cubic-bezier(.2,.8,.2,1);--attention:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:var(--u) var(--u);animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;width:calc(var(--u)*23);height:calc(var(--u)*15)}.block{position:absolute;background:#d8d8d5;z-index:2;cursor:default;user-select:none;transform-origin:center;transition:left .85s var(--ease),top .85s var(--ease),width .85s var(--ease),height .85s var(--ease),opacity .82s var(--attention),filter .82s var(--attention),transform .82s var(--attention)}.stage.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.62);opacity:.58}.block.intent{filter:brightness(1.18)!important;opacity:1!important;transform:scale(1.025)}.block.demo-focus{filter:brightness(1.12)!important;opacity:1!important;transform:scale(1.016)}.b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*5);height:calc(var(--u)*6)}.b2{left:calc(var(--u)*9);top:calc(var(--u)*3);width:calc(var(--u)*5);height:calc(var(--u)*6)}.b3{left:calc(var(--u)*15);top:calc(var(--u)*3);width:calc(var(--u)*5);height:calc(var(--u)*6)}.b4{left:calc(var(--u)*3);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3)}.b5{left:calc(var(--u)*9);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3);background:#a9a9a7}.b6{left:calc(var(--u)*15);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3);background:#555553}.b7,.b8{opacity:0;pointer-events:none}.layout-2 .b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*17);height:calc(var(--u)*3)}.layout-2 .b2{left:calc(var(--u)*3);top:calc(var(--u)*7);width:calc(var(--u)*17);height:calc(var(--u)*3)}.layout-2 .b3{left:calc(var(--u)*3);top:calc(var(--u)*11);width:calc(var(--u)*17);height:calc(var(--u)*3);background:#a9a9a7}.layout-2 .b4,.layout-2 .b5,.layout-2 .b6{opacity:0;pointer-events:none}.layout-3 .b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*10);height:calc(var(--u)*6)}.layout-3 .b2{left:calc(var(--u)*14);top:calc(var(--u)*3);width:calc(var(--u)*6);height:calc(var(--u)*3);background:#a9a9a7}.layout-3 .b3{left:calc(var(--u)*14);top:calc(var(--u)*7);width:calc(var(--u)*3);height:calc(var(--u)*2);background:#a9a9a7}.layout-3 .b4{left:calc(var(--u)*18);top:calc(var(--u)*7);width:calc(var(--u)*2);height:calc(var(--u)*2)}.layout-3 .b5{left:calc(var(--u)*3);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3)}.layout-3 .b6{left:calc(var(--u)*9);top:calc(var(--u)*10);width:calc(var(--u)*4);height:calc(var(--u)*1);background:#555553}.layout-3 .b7{opacity:1;left:calc(var(--u)*9);top:calc(var(--u)*12);width:calc(var(--u)*4);height:calc(var(--u)*1);background:#a9a9a7;pointer-events:auto}.layout-3 .b8{opacity:1;left:calc(var(--u)*14);top:calc(var(--u)*10);width:calc(var(--u)*6);height:calc(var(--u)*1);background:#555553;pointer-events:auto}.layout-4 .b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*17);height:calc(var(--u)*6)}.layout-4 .b2{left:calc(var(--u)*3);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3);background:#a9a9a7}.layout-4 .b3{left:calc(var(--u)*9);top:calc(var(--u)*10);width:calc(var(--u)*4);height:calc(var(--u)*1);background:#a9a9a7}.layout-4 .b4{left:calc(var(--u)*9);top:calc(var(--u)*12);width:calc(var(--u)*4);height:calc(var(--u)*1)}.layout-4 .b5{left:calc(var(--u)*14);top:calc(var(--u)*10);width:calc(var(--u)*6);height:calc(var(--u)*3);background:#a9a9a7}.layout-4 .b6,.layout-4 .b7,.layout-4 .b8{opacity:0;pointer-events:none}.pager{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:14px;z-index:99}.pager button{appearance:none;border:1px solid rgba(255,255,255,.3);width:14px;height:14px;border-radius:50%;padding:0;background:rgba(255,255,255,.38);cursor:pointer;transition:background .7s var(--attention),transform .7s var(--attention)}.pager button.active{background:#fff;transform:scale(1.12)}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px Arial;letter-spacing:.06em;text-transform:uppercase}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}@media(max-width:1180px){.stage{transform:scale(.78);transform-origin:top left}}</style></head><body><div class="surface"><div class="grid"></div><div class="stage" id="stage"><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i></div><nav class="pager"><button class="active" data-layout="1" aria-label="Composition 1"></button><button data-layout="2" aria-label="Composition 2"></button><button data-layout="3" aria-label="Composition 3"></button><button data-layout="4" aria-label="Composition 4"></button></nav></div><div class="hint">hover — interest · idle — dwell</div><script>const stage=document.getElementById('stage'),blocks=[...stage.querySelectorAll('.block')],dots=[...document.querySelectorAll('.pager button')],U=48;let layout=1,idle,demo,idx=0,hovered=null;function alignStage(){const scale=innerWidth<1180?.78:1,w=23*U*scale,h=15*U*scale;stage.style.left=Math.max(U,Math.round(((innerWidth-w)/2)/U)*U)+'px';stage.style.top=Math.max(U,Math.round(((innerHeight-h)/2-24)/U)*U)+'px'}alignStage();addEventListener('resize',alignStage);const visible=()=>blocks.filter(b=>getComputedStyle(b).opacity!=='0'&&getComputedStyle(b).pointerEvents!=='none');function clearDemo(){clearTimeout(idle);clearInterval(demo);blocks.forEach(b=>b.classList.remove('demo-focus'))}function schedule(){clearDemo();if(hovered)return;idle=setTimeout(()=>{const list=visible();if(!list.length)return;idx=Math.floor(Math.random()*list.length);stage.classList.add('has-intent');list[idx].classList.add('demo-focus');demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx=(idx+1)%list.length;list[idx].classList.add('demo-focus')},4200)},6500)}function setLayout(n){layout=n;clearDemo();stage.className='stage '+(n===1?'':'layout-'+n);dots.forEach((d,j)=>d.classList.toggle('active',j===n-1));schedule()}dots.forEach(d=>d.onclick=e=>{e.stopPropagation();setLayout(Number(d.dataset.layout))});blocks.forEach(b=>{b.onmouseenter=()=>{hovered=b;clearDemo();stage.classList.add('has-intent');blocks.forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{hovered=null;b.classList.remove('intent');stage.classList.remove('has-intent');schedule()}});schedule();</script></body></html>
