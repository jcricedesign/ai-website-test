<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface::before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110 0%,#1b1b19 48%,#141413 100%);animation:breathe 34s ease-in-out infinite alternate;transform:scale(1.05)}.surface::after{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;mix-blend-mode:screen;animation:gridBreath 28s ease-in-out infinite alternate;pointer-events:none}@keyframes breathe{0%{transform:translate3d(-2%,-1%,0) scale(1.06);filter:brightness(.94)}45%{transform:translate3d(1%,2%,0) scale(1.08);filter:brightness(1.02)}100%{transform:translate3d(3%,-2%,0) scale(1.06);filter:brightness(.97)}}@keyframes gridBreath{0%{opacity:.68}40%{opacity:.94}72%{opacity:.74}100%{opacity:.88}}@media(prefers-reduced-motion:reduce){.surface::before,.surface::after{animation:none}}</style></head><body><div class="surface"></div></body></html>
