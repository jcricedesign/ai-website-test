<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Live Material</title><style>:root{--u:48px;--attention:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif;touch-action:none}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;pointer-events:none;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;transition:filter 1s,opacity 1s;animation:gridBreath 28s ease-in-out infinite alternate}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;overflow:hidden;transform-origin:center;transition:left .45s var(--attention),top .45s var(--attention),width .45s var(--attention),height .45s var(--attention),opacity .7s,filter .7s,transform .7s}.block video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);pointer-events:none}.controls{position:fixed;right:28px;top:24px;z-index:100;display:flex;gap:4px}.controls button{border:0;background:none;color:rgba(255,255,255,.45);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px 12px}.controls button:hover,.controls button.active{color:#fff}.controls button.active{background:rgba(255,255,255,.07)}.editmode .grid,.movemode .grid{opacity:1!important;filter:brightness(2.2)}.viewmode .grid{filter:brightness(.82)}.editmode .block:hover{opacity:.52;cursor:crosshair}.editmode .surface{cursor:crosshair}.previewbox{position:fixed;display:none;z-index:50;background:rgba(255,255,255,.3);outline:1px solid rgba(255,255,255,.65);pointer-events:none}.movebar{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:12px;color:rgba(255,255,255,.48);font:10px Arial;letter-spacing:.08em;text-transform:uppercase}.movemode .movebar{display:flex}.movebar button{border:1px solid rgba(255,255,255,.18);background:rgba(20,20,20,.35);color:rgba(255,255,255,.65);padding:7px 10px;cursor:pointer}.sound{position:fixed;right:28px;bottom:22px;z-index:100;border:0;background:none;color:rgba(255,255,255,.28);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.hint{position:fixed;left:24px;bottom:22px;z-index:100;color:rgba(255,255,255,.3);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body class="viewmode"><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="previewbox" id="previewbox"></div></div><div class="controls"><button id="editBtn">Edit</button><button id="moveBtn">Move</button><button id="videoBtn">Video</button></div><div class="movebar"><span>Gutter</span><button id="less">−48</button><span id="gutterValue">48</span><button id="more">+48</button></div><div class="hint" id="hint">Edit to draw · Move to position</div><button class="sound" id="sound">Sound on</button><script>const U=48,VIDEO='https://commons.wikimedia.org/wiki/Special:Redirect/file/A_Railway_Collision_(1900)_-_yt.webm',TIME_SLICES=[.08,.64,.31,.82,.47,.16,.72,.55,.92,.24,.68,.39];const surface=document.getElementById('surface'),objects=document.getElementById('objects'),previewbox=document.getElementById('previewbox'),editBtn=document.getElementById('editBtn'),moveBtn=document.getElementById('moveBtn'),videoBtn=document.getElementById('videoBtn'),hint=document.getElementById('hint'),gutterValue=document.getElementById('gutterValue'),soundBtn=document.getElementById('sound');let mode='view',drawing=false,start=null,activePointer=null,offsetX=0,offsetY=0,gutterSteps=1,lastPreview='',soundOn=true,audio=null,videoOn=false,failedVideos=0;const rects=[],els=new Map(),pent=[220,247,294,330,392];let nextId=1;function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function freqForRect(r){const row=Math.round(r.y/U),col=Math.round(r.x/U),note=(col+row)%pent.length,oct=Math.max(.5,Math.min(2,1.5-r.y/innerHeight));return pent[note]*oct}function playTone(freq,{type='sine',gain=.035,attack=.07,duration=1.15,filter=1100}={}){if(!soundOn)return;ensureAudio();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=filter;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+attack);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.12)}function shadowTone(r){playTone(freqForRect(r)*.5,{type:'triangle',gain:.018,attack:.025,duration:.62,filter:620})}function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){const l=Math.min(a.x,b.x),t=Math.min(a.y,b.y),r=Math.max(a.x,b.x)+U,bt=Math.max(a.y,b.y)+U;return{x:l,y:t,w:r-l,h:bt-t}}function intersects(q){return rects.some(r=>!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}function wrap(v,max){return((v%max)+max)%max}function bounds(){if(!rects.length)return{cx:innerWidth/2,cy:innerHeight/2};let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;rects.forEach(q=>{l=Math.min(l,q.x);t=Math.min(t,q.y);r=Math.max(r,q.x+q.w);b=Math.max(b,q.y+q.h)});return{cx:(l+r)/2,cy:(t+b)/2}}function displayRect(r){if(mode==='edit')return{x:r.x,y:r.y,w:r.w,h:r.h};const b=bounds(),cx=r.x+r.w/2,cy=r.y+r.h/2,d=(gutterSteps-1)*U;let gx=0,gy=0;if(d){if(cx<b.cx-U/2)gx=-d;else if(cx>b.cx+U/2)gx=d;if(cy<b.cy-U/2)gy=-d;else if(cy>b.cy+U/2)gy=d}return{x:wrap(r.x+offsetX+gx,innerWidth),y:wrap(r.y+offsetY+gy,innerHeight),w:r.w,h:r.h}}function startTime(i,duration){const pad=1.25,usable=Math.max(2,duration-pad*2);return pad+usable*TIME_SLICES[i%TIME_SLICES.length]}function attachVideo(rec,b,i){if(rec.video)return;const v=document.createElement('video');rec.video=v;v.src=VIDEO;v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.addEventListener('loadedmetadata',()=>{v.currentTime=startTime(i,v.duration);v.play().catch(()=>{});updateStatus()},{once:true});v.addEventListener('error',()=>{failedVideos++;updateStatus()},{once:true});b.appendChild(v)}function updateStatus(){if(!videoOn)return;const ready=rects.filter(r=>r.video&&r.video.readyState>=1).length;if(failedVideos){hint.textContent='Video failed to load'}else if(ready>=rects.length){hint.textContent='Playing · live material · mixed moments';videoBtn.textContent='Stop video'}else{hint.textContent='Loading video '+ready+' / '+rects.length+'…';videoBtn.textContent='Loading…'}}function makeElement(rec,i){const b=document.createElement('div');b.className='block';b.dataset.id=rec.id;objects.appendChild(b);els.set(rec.id,b);b.onclick=e=>{if(mode!=='edit')return;e.stopPropagation();if(rec.video){rec.video.pause();rec.video.remove()}const n=rects.findIndex(x=>x.id===rec.id);if(n>=0)rects.splice(n,1);b.remove();els.delete(rec.id);layout()};if(videoOn)attachVideo(rec,b,i);return b}function layout(){rects.forEach((rec,i)=>{let b=els.get(rec.id);if(!b)b=makeElement(rec,i);const d=displayRect(rec);Object.assign(b.style,{left:d.x+'px',top:d.y+'px',width:d.w+'px',height:d.h+'px'});if(videoOn&&!rec.video)attachVideo(rec,b,i)});for(const[id,b]of els){if(!rects.some(r=>r.id===id)){b.remove();els.delete(id)}}updateStatus()}function setMode(next){mode=next;cancelDraw();document.body.classList.toggle('editmode',mode==='edit');document.body.classList.toggle('movemode',mode==='move');document.body.classList.toggle('viewmode',mode==='view');editBtn.classList.toggle('active',mode==='edit');moveBtn.classList.toggle('active',mode==='move');hint.textContent=mode==='edit'?(videoOn?'Paint live regions · click one to delete':'Paint rectangles · click one to delete'):mode==='move'?(videoOn?'Arrow keys move live material · edges wrap':'Arrow keys move the composition · edges wrap'):(videoOn?'Playing · live material · mixed moments':'Edit to draw · Move to position');layout()}function cancelDraw(){drawing=false;activePointer=null;lastPreview='';previewbox.style.display='none'}function updatePreview(x,y){const q=box(start,cell(x,y)),key=q.x+','+q.y+','+q.w+','+q.h;if(key===lastPreview)return;lastPreview=key;Object.assign(previewbox.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:intersects(q)?'rgba(255,255,255,.08)':'rgba(255,255,255,.3)'})}editBtn.onclick=()=>{ensureAudio();setMode(mode==='edit'?'view':'edit')};moveBtn.onclick=()=>{ensureAudio();setMode(mode==='move'?'view':'move')};videoBtn.onclick=()=>{if(!rects.length)return;videoOn=!videoOn;failedVideos=0;videoBtn.classList.toggle('active',videoOn);if(videoOn){videoBtn.textContent='Loading…';rects.forEach((r,i)=>{const b=els.get(r.id)||makeElement(r,i);attachVideo(r,b,i)})}else{videoBtn.textContent='Video';rects.forEach(r=>{if(r.video){r.video.pause();r.video.remove();r.video=null}})}setMode(mode)};soundBtn.onclick=()=>{ensureAudio();soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off'};surface.addEventListener('pointerdown',e=>{if(mode!=='edit'||e.button!==0||e.target.closest('.block'))return;e.preventDefault();ensureAudio();drawing=true;activePointer=e.pointerId;start=cell(e.clientX,e.clientY);previewbox.style.display='block';surface.setPointerCapture(e.pointerId);updatePreview(e.clientX,e.clientY)});window.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==activePointer)return;e.preventDefault();updatePreview(e.clientX,e.clientY)},{passive:false});window.addEventListener('pointerup',e=>{if(!drawing||e.pointerId!==activePointer)return;const q=box(start,cell(e.clientX,e.clientY));if(!intersects(q)){const rec={...q,id:nextId++,video:null};rects.push(rec);shadowTone(rec);const b=makeElement(rec,rects.length-1);if(videoOn)attachVideo(rec,b,rects.length-1)}try{surface.releasePointerCapture(e.pointerId)}catch(_){}cancelDraw();layout()});window.addEventListener('pointercancel',e=>{if(e.pointerId===activePointer)cancelDraw()});document.addEventListener('keydown',e=>{if(mode!=='move')return;let yes=true;if(e.key==='ArrowLeft')offsetX-=U;else if(e.key==='ArrowRight')offsetX+=U;else if(e.key==='ArrowUp')offsetY-=U;else if(e.key==='ArrowDown')offsetY+=U;else yes=false;if(yes){e.preventDefault();layout()}});document.getElementById('less').onclick=()=>{if(mode==='move'){gutterSteps=Math.max(0,gutterSteps-1);gutterValue.textContent=gutterSteps*U;layout()}};document.getElementById('more').onclick=()=>{if(mode==='move'){gutterSteps=Math.min(3,gutterSteps+1);gutterValue.textContent=gutterSteps*U;layout()}};layout();</script></body></html>
