<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Structure</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface::before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110 0%,#1b1b19 48%,#141413 100%);animation:breathe 34s ease-in-out infinite alternate;transform:scale(1.05)}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;mix-blend-mode:screen;animation:gridBreath 28s ease-in-out infinite alternate}.structure{position:absolute;inset:0;pointer-events:none}.rule{position:absolute;background:rgba(255,255,255,.24)}.v1{left:calc(48px * 5 - 1px);top:0;width:1px;height:calc(48px * 11)}.v2{left:calc(48px * 13 - 1px);top:calc(48px * 4);width:1px;height:calc(48px * 12)}.v3{left:calc(48px * 22 - 1px);top:calc(48px * 9);width:1px;height:calc(48px * 9)}.h1{left:calc(48px * 5);top:calc(48px * 4 - 1px);height:1px;width:calc(48px * 17)}.h2{left:0;top:calc(48px * 11 - 1px);height:1px;width:calc(48px * 13)}.h3{left:calc(48px * 13);top:calc(48px * 16 - 1px);height:1px;width:calc(48px * 9)}@keyframes breathe{0%{transform:translate3d(-2%,-1%,0) scale(1.06);filter:brightness(.94)}45%{transform:translate3d(1%,2%,0) scale(1.08);filter:brightness(1.02)}100%{transform:translate3d(3%,-2%,0) scale(1.06);filter:brightness(.97)}}@keyframes gridBreath{0%{opacity:.68}40%{opacity:.94}72%{opacity:.74}100%{opacity:.88}}@media(prefers-reduced-motion:reduce){.surface::before,.grid{animation:none}}</style></head><body><div class="surface"><div class="grid"></div><div class="structure"><i class="rule v1"></i><i class="rule v2"></i><i class="rule v3"></i><i class="rule h1"></i><i class="rule h2"></i><i class="rule h3"></i></div></div></body></html>
