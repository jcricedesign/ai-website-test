<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Merge / Divide</title><style>:root{--u:48px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:#171716}.surface:before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:var(--u) var(--u);background-position:0 0;animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;width:calc(var(--u)*23);height:calc(var(--u)*15)}.block{position:absolute;background:#d8d8d5;z-index:2;cursor:grab;user-select:none;transform-origin:center;transition:left .85s var(--ease),top .85s var(--ease),width .85s var(--ease),height .85s var(--ease),opacity .72s ease,filter .72s ease,transform .72s var(--spring)}.block:active{cursor:grabbing}.stage.has-intent .block:not(.intent):not(.demo-focus){filter:brightness(.62);opacity:.58}.block.intent{filter:brightness(1.18)!important;transform:scale(1.025)}.block.demo-focus{filter:brightness(1.12)!important;transform:scale(1.016)}.block.dragging{transition:filter .2s,opacity .2s,transform .2s;filter:brightness(1.22)!important;transform:scale(1.035);z-index:6}.block.candidate{filter:brightness(.9);transform:scale(.985)}.block.commit{animation:snap .48s var(--spring)}@keyframes snap{0%{transform:scale(1)}48%{transform:scale(1.065)}100%{transform:scale(1)}}.b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*5);height:calc(var(--u)*6)}.b2{left:calc(var(--u)*9);top:calc(var(--u)*3);width:calc(var(--u)*5);height:calc(var(--u)*6)}.b3{left:calc(var(--u)*15);top:calc(var(--u)*3);width:calc(var(--u)*5);height:calc(var(--u)*6)}.b4{left:calc(var(--u)*3);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3)}.b5{left:calc(var(--u)*9);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3);background:#a9a9a7}.b6{left:calc(var(--u)*15);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3);background:#555553}.b7,.b8{opacity:0;pointer-events:none}.layout-2 .b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*17);height:calc(var(--u)*3)}.layout-2 .b2{left:calc(var(--u)*3);top:calc(var(--u)*7);width:calc(var(--u)*17);height:calc(var(--u)*3)}.layout-2 .b3{left:calc(var(--u)*3);top:calc(var(--u)*11);width:calc(var(--u)*17);height:calc(var(--u)*3);background:#a9a9a7}.layout-2 .b4,.layout-2 .b5,.layout-2 .b6{opacity:0;pointer-events:none}.layout-3 .b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*10);height:calc(var(--u)*6)}.layout-3 .b2{left:calc(var(--u)*14);top:calc(var(--u)*3);width:calc(var(--u)*6);height:calc(var(--u)*3);background:#a9a9a7}.layout-3 .b3{left:calc(var(--u)*14);top:calc(var(--u)*7);width:calc(var(--u)*3);height:calc(var(--u)*2);background:#a9a9a7}.layout-3 .b4{left:calc(var(--u)*18);top:calc(var(--u)*7);width:calc(var(--u)*2);height:calc(var(--u)*2)}.layout-3 .b5{left:calc(var(--u)*3);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3)}.layout-3 .b6{left:calc(var(--u)*9);top:calc(var(--u)*10);width:calc(var(--u)*4);height:calc(var(--u)*1);background:#555553}.layout-3 .b7{opacity:1;left:calc(var(--u)*9);top:calc(var(--u)*12);width:calc(var(--u)*4);height:calc(var(--u)*1);background:#a9a9a7;pointer-events:auto}.layout-3 .b8{opacity:1;left:calc(var(--u)*14);top:calc(var(--u)*10);width:calc(var(--u)*6);height:calc(var(--u)*1);background:#555553;pointer-events:auto}.layout-4 .b1{left:calc(var(--u)*3);top:calc(var(--u)*3);width:calc(var(--u)*17);height:calc(var(--u)*6)}.layout-4 .b2{left:calc(var(--u)*3);top:calc(var(--u)*10);width:calc(var(--u)*5);height:calc(var(--u)*3);background:#a9a9a7}.layout-4 .b3{left:calc(var(--u)*9);top:calc(var(--u)*10);width:calc(var(--u)*4);height:calc(var(--u)*1);background:#a9a9a7}.layout-4 .b4{left:calc(var(--u)*9);top:calc(var(--u)*12);width:calc(var(--u)*4);height:calc(var(--u)*1)}.layout-4 .b5{left:calc(var(--u)*14);top:calc(var(--u)*10);width:calc(var(--u)*6);height:calc(var(--u)*3);background:#a9a9a7}.layout-4 .b6,.layout-4 .b7,.layout-4 .b8{opacity:0;pointer-events:none}.pager{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:14px;z-index:99}.pager button{appearance:none;border:1px solid rgba(255,255,255,.3);width:14px;height:14px;border-radius:50%;padding:0;background:rgba(255,255,255,.38);cursor:pointer}.pager button.active{background:#fff;transform:scale(1.12)}.edgehint{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);color:rgba(255,255,255,.3);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px Arial}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}@media(max-width:1180px){.stage{transform:scale(.78);transform-origin:top left}}</style></head><body><div class="surface" id="surface"><div class="grid"></div><div class="stage" id="stage"><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i></div><nav class="pager"><button class="active" data-layout="1"></button><button data-layout="2"></button><button data-layout="3"></button><button data-layout="4"></button></nav></div><div class="edgehint">drag toward a neighbor to merge · drag across a merged cell to divide</div><div class="hint">hover — interest · drag — restructure</div><script>const surface=document.getElementById('surface'),stage=document.getElementById('stage'),blocks=[...stage.querySelectorAll('.block')],dots=[...document.querySelectorAll('.pager button')];let layout=1,idle,demo,idx=0,hovered=null,drag=null;const U=48;function alignStage(){const scale=innerWidth<1180?.78:1,w=23*U*scale,h=15*U*scale;const x=Math.round(((innerWidth-w)/2)/U)*U;const y=Math.round(((innerHeight-h)/2-24)/U)*U;stage.style.left=Math.max(U,x)+'px';stage.style.top=Math.max(U,y)+'px'}alignStage();addEventListener('resize',alignStage);const visible=()=>blocks.filter(b=>getComputedStyle(b).opacity!=='0'&&getComputedStyle(b).pointerEvents!=='none');function clearDemo(){clearTimeout(idle);clearInterval(demo);blocks.forEach(b=>b.classList.remove('demo-focus'))}function schedule(){clearDemo();if(hovered||drag)return;idle=setTimeout(()=>{const list=visible();if(!list.length)return;idx=Math.floor(Math.random()*list.length);stage.classList.add('has-intent');list[idx].classList.add('demo-focus');demo=setInterval(()=>{list.forEach(b=>b.classList.remove('demo-focus'));idx=(idx+1)%list.length;list[idx].classList.add('demo-focus')},4200)},6500)}function resetCustom(){blocks.forEach(b=>{b.style.removeProperty('left');b.style.removeProperty('top');b.style.removeProperty('width');b.style.removeProperty('height');b.style.removeProperty('opacity');b.style.removeProperty('pointer-events')})}function setLayout(n){layout=n;clearDemo();resetCustom();stage.className='stage '+(n===1?'':'layout-'+n);dots.forEach((d,j)=>d.classList.toggle('active',j===n-1));schedule()}dots.forEach(d=>d.onclick=e=>{e.stopPropagation();setLayout(Number(d.dataset.layout))});blocks.forEach(b=>{b.onmouseenter=()=>{if(drag)return;hovered=b;clearDemo();stage.classList.add('has-intent');blocks.forEach(x=>x.classList.remove('intent'));b.classList.add('intent')};b.onmouseleave=()=>{if(drag)return;hovered=null;b.classList.remove('intent');stage.classList.remove('has-intent');schedule()};b.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();clearDemo();hovered=null;stage.classList.remove('has-intent');const r=b.getBoundingClientRect();drag={b,x:e.clientX,y:e.clientY,r,merged:b.dataset.merged==='1'};b.classList.add('dragging');b.setPointerCapture(e.pointerId)}});function nearestNeighbor(src,dx,dy){let best=null,score=Infinity;for(const n of visible()){if(n===src)continue;const r=n.getBoundingClientRect(),sx=src.getBoundingClientRect();const cx=r.left+r.width/2-(sx.left+sx.width/2),cy=r.top+r.height/2-(sx.top+sx.height/2);if(cx*dx+cy*dy<=0)continue;const s=Math.hypot(cx,cy);if(s<score){score=s;best=n}}return best}stage.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dist=Math.hypot(dx,dy);blocks.forEach(x=>x.classList.remove('candidate'));if(dist<22)return;if(drag.merged){drag.b.style.transform=`translate(${dx*.12}px,${dy*.12}px) scale(1.035)`;return}const n=nearestNeighbor(drag.b,dx,dy);if(n)n.classList.add('candidate');drag.b.style.transform=`translate(${dx*.10}px,${dy*.10}px) scale(1.035)`};stage.onpointerup=e=>{if(!drag)return;const {b,x,y,merged}=drag,dx=e.clientX-x,dy=e.clientY-y,dist=Math.hypot(dx,dy);b.classList.remove('dragging');b.style.transform='';blocks.forEach(x=>x.classList.remove('candidate'));if(dist>30&&merged){const horizontal=Math.abs(dx)>Math.abs(dy);const br=b.getBoundingClientRect();const spare=blocks.find(x=>x!==b&&getComputedStyle(x).pointerEvents==='none');if(spare){const sr=stage.getBoundingClientRect(),gap=48;if(horizontal){const w=Math.round(((br.width-gap)/2)/U)*U;b.style.width=w+'px';spare.style.left=Math.round((br.left-sr.left+w+gap)/U)*U+'px';spare.style.top=Math.round((br.top-sr.top)/U)*U+'px';spare.style.width=w+'px';spare.style.height=Math.round(br.height/U)*U+'px'}else{const h=Math.round(((br.height-gap)/2)/U)*U;b.style.height=h+'px';spare.style.left=Math.round((br.left-sr.left)/U)*U+'px';spare.style.top=Math.round((br.top-sr.top+h+gap)/U)*U+'px';spare.style.width=Math.round(br.width/U)*U+'px';spare.style.height=h+'px'}spare.style.opacity='1';spare.style.pointerEvents='auto';b.dataset.merged='0';spare.dataset.merged='0';b.classList.add('commit');spare.classList.add('commit')}}else if(dist>30&&!merged){const n=nearestNeighbor(b,dx,dy);if(n){const a=b.getBoundingClientRect(),nr=n.getBoundingClientRect(),sr=stage.getBoundingClientRect();const left=Math.round((Math.min(a.left,nr.left)-sr.left)/U)*U,top=Math.round((Math.min(a.top,nr.top)-sr.top)/U)*U,right=Math.round((Math.max(a.right,nr.right)-sr.left)/U)*U,bottom=Math.round((Math.max(a.bottom,nr.bottom)-sr.top)/U)*U;b.style.left=left+'px';b.style.top=top+'px';b.style.width=(right-left)+'px';b.style.height=(bottom-top)+'px';n.style.opacity='0';n.style.pointerEvents='none';b.dataset.merged='1';b.classList.add('commit')}}setTimeout(()=>blocks.forEach(x=>x.classList.remove('commit')),520);drag=null;schedule()};schedule();</script></body></html>
