<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#181817;font-family:Arial,sans-serif}.surface{position:fixed;inset:0;background-color:var(--field,#181817);background-image:linear-gradient(to right,rgba(255,255,255,var(--alpha,.045)) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,var(--alpha,.045)) 1px,transparent 1px);background-size:var(--unit,32px) var(--unit,32px);background-position:-1px -1px}.controls{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;padding:8px;background:rgba(20,20,19,.82);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(10px);opacity:.18;transition:opacity .2s}.controls:hover{opacity:1}.controls button{appearance:none;border:1px solid rgba(255,255,255,.16);background:transparent;color:#aaa;font:11px/1 Arial,sans-serif;padding:8px 10px;cursor:pointer}.controls button:hover{color:#fff;border-color:rgba(255,255,255,.35)}</style></head><body><div class="surface" id="surface"></div><div class="controls"><button data-size="24">24</button><button data-size="32">32</button><button data-size="48">48</button><button id="lighter">− line</button><button id="darker">+ line</button><button id="field">field</button></div><script>const s=document.getElementById('surface');let alpha=.045,field=0;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>s.style.setProperty('--unit',b.dataset.size+'px'));document.getElementById('lighter').onclick=()=>{alpha=Math.max(.01,alpha-.01);s.style.setProperty('--alpha',alpha)};document.getElementById('darker').onclick=()=>{alpha=Math.min(.16,alpha+.01);s.style.setProperty('--alpha',alpha)};const fields=['#181817','#20201e','#111','#262622','#e8e8e2','#d9d9d1'];document.getElementById('field').onclick=()=>{field=(field+1)%fields.length;s.style.setProperty('--field',fields[field]);if(field>3){alpha=.09;s.style.backgroundImage=`linear-gradient(to right,rgba(0,0,0,var(--alpha)) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,var(--alpha)) 1px,transparent 1px)`}else{s.style.backgroundImage=`linear-gradient(to right,rgba(255,255,255,var(--alpha)) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,var(--alpha)) 1px,transparent 1px)`}};</script></body></html>
