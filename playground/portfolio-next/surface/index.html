<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Five Compositions</title><style>:root{--u:48px;--field:#171716;--grid:rgba(255,255,255,.042);--rule:rgba(255,255,255,.72);--object:#d8d8d5;--ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#121211}.surface{position:fixed;inset:0;overflow:hidden;background:var(--field)}.surface::before{content:"";position:absolute;inset:-28%;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),radial-gradient(circle at 74% 62%,rgba(255,255,255,.018),transparent 31%),linear-gradient(135deg,#111110 0%,#1b1b19 48%,#141413 100%);animation:breathe 34s ease-in-out infinite alternate;transform:scale(1.05)}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:var(--u) var(--u);background-position:-1px -1px;mix-blend-mode:screen;animation:gridBreath 28s ease-in-out infinite alternate}.stage{position:absolute;left:calc(var(--u)*2);right:calc(var(--u)*2);top:calc(var(--u)*2);height:calc(var(--u)*15);max-width:calc(var(--u)*26);transition:all 850ms var(--ease)}.frame{position:absolute;inset:0;border:3px solid var(--rule);pointer-events:none}.rule,.block{position:absolute;transition:all 850ms var(--ease)}.rule{background:var(--rule)}.block{background:var(--object)}.v1{width:3px}.h1,.h2{height:3px}.v1{left:60%;top:25%;height:62%}.h1{left:0;top:25%;width:100%}.h2{left:12%;top:87%;width:76%}.b1{left:5%;top:31%;width:50%;height:43%}.b2{left:65%;top:31%;width:26%;height:21%}.b3{left:65%;top:58%;width:12%;height:17%}.b4{left:80%;top:58%;width:11%;height:17%}.b5{left:5%;top:80%;width:23%;height:12%}.b6{left:31%;top:80%;width:24%;height:7%}.b7{left:31%;top:90%;width:24%;height:9%}.b8{left:65%;top:80%;width:26%;height:7%}.layout-2 .v1{left:42%;top:0;height:100%}.layout-2 .h1{top:44%}.layout-2 .h2{left:42%;top:78%;width:58%}.layout-2 .b1{left:5%;top:6%;width:32%;height:31%}.layout-2 .b2{left:47%;top:6%;width:46%;height:31%}.layout-2 .b3{left:5%;top:51%;width:14%;height:21%}.layout-2 .b4{left:23%;top:51%;width:14%;height:21%}.layout-2 .b5{left:47%;top:51%;width:17%;height:21%}.layout-2 .b6{left:68%;top:51%;width:25%;height:21%}.layout-2 .b7{left:47%;top:84%;width:46%;height:10%}.layout-2 .b8{left:5%;top:80%;width:32%;height:14%}.layout-3 .v1{left:72%;top:0;height:100%}.layout-3 .h1{top:54%}.layout-3 .h2{left:0;top:82%;width:72%}.layout-3 .b1{left:5%;top:7%;width:62%;height:39%}.layout-3 .b2{left:77%;top:7%;width:16%;height:20%}.layout-3 .b3{left:77%;top:33%;width:16%;height:13%}.layout-3 .b4{left:5%;top:61%;width:21%;height:14%}.layout-3 .b5{left:30%;top:61%;width:16%;height:14%}.layout-3 .b6{left:50%;top:61%;width:17%;height:14%}.layout-3 .b7{left:5%;top:87%;width:42%;height:7%}.layout-3 .b8{left:51%;top:87%;width:42%;height:7%}.layout-4 .v1{left:30%;top:18%;height:82%}.layout-4 .h1{top:18%}.layout-4 .h2{left:30%;top:68%;width:70%}.layout-4 .b1{left:5%;top:24%;width:20%;height:64%}.layout-4 .b2{left:35%;top:24%;width:58%;height:37%}.layout-4 .b3{left:35%;top:75%;width:16%;height:18%}.layout-4 .b4{left:55%;top:75%;width:17%;height:18%}.layout-4 .b5{left:76%;top:75%;width:17%;height:18%}.layout-4 .b6{left:5%;top:6%;width:20%;height:7%}.layout-4 .b7{left:35%;top:6%;width:27%;height:7%}.layout-4 .b8{left:66%;top:6%;width:27%;height:7%}.layout-5 .v1{left:52%;top:0;height:74%}.layout-5 .h1{top:32%}.layout-5 .h2{left:0;top:74%;width:100%}.layout-5 .b1{left:5%;top:7%;width:42%;height:18%}.layout-5 .b2{left:57%;top:7%;width:36%;height:18%}.layout-5 .b3{left:5%;top:39%;width:18%;height:27%}.layout-5 .b4{left:27%;top:39%;width:20%;height:27%}.layout-5 .b5{left:57%;top:39%;width:36%;height:27%}.layout-5 .b6{left:5%;top:81%;width:25%;height:13%}.layout-5 .b7{left:34%;top:81%;width:28%;height:13%}.layout-5 .b8{left:66%;top:81%;width:27%;height:13%}.hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px/1.3 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;user-select:none}.hint strong{color:rgba(255,255,255,.5);font-weight:400}.counter{position:fixed;left:18px;bottom:18px;color:rgba(255,255,255,.28);font:10px/1 Arial,sans-serif;letter-spacing:.12em}@keyframes breathe{0%{transform:translate3d(-2%,-1%,0) scale(1.06);filter:brightness(.94)}45%{transform:translate3d(1%,2%,0) scale(1.08);filter:brightness(1.02)}100%{transform:translate3d(3%,-2%,0) scale(1.06);filter:brightness(.97)}}@keyframes gridBreath{0%{opacity:.68}40%{opacity:.94}72%{opacity:.74}100%{opacity:.88}}@media(prefers-reduced-motion:reduce){.surface::before,.grid{animation:none}.stage,.rule,.block{transition:none}}@media(max-width:1100px){:root{--u:36px}.stage{left:36px;right:36px;top:36px}}@media(max-width:760px){:root{--u:24px}.stage{left:24px;right:24px;top:24px}}</style></head><body><div class="surface"><div class="grid"></div><div class="stage" id="stage"><div class="frame"></div><i class="rule v1"></i><i class="rule h1"></i><i class="rule h2"></i><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i></div></div><div class="counter" id="counter">01 / 05</div><div class="hint">click / space — <strong>next composition</strong></div><script>const stage=document.getElementById('stage'),counter=document.getElementById('counter');let i=1;function next(){i=i%5+1;stage.className='stage '+(i===1?'':'layout-'+i);counter.textContent=String(i).padStart(2,'0')+' / 05'}document.addEventListener('click',next);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();next()}});</script></body></html>
