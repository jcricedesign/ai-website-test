<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Study — Direct Surface</title><style>:root{--u:48px;--ease:cubic-bezier(.22,.61,.36,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121211;font-family:Arial,sans-serif;touch-action:none}.surface{position:fixed;inset:0;overflow:hidden;background:#171716;cursor:crosshair}.surface:before{content:"";position:absolute;inset:-28%;pointer-events:none;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.025),transparent 34%),linear-gradient(135deg,#111110,#1b1b19 48%,#141413);animation:breathe 34s ease-in-out infinite alternate}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,255,255,.042) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.042) 1px,transparent 1px);background-size:48px 48px;animation:gridBreath 28s ease-in-out infinite alternate}.objects{position:absolute;inset:0}.block{position:absolute;background:#d8d8d5;z-index:2;overflow:hidden;cursor:grab;transition:left .3s var(--ease),top .3s var(--ease),width .3s var(--ease),height .3s var(--ease),opacity .3s}.block.dragging{transition:none;z-index:10;opacity:.86;cursor:grabbing}.block video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);pointer-events:none}.edge{position:absolute;right:0;top:0;width:20px;height:100%;z-index:5;cursor:e-resize;background:linear-gradient(to left,rgba(255,255,255,.22),rgba(255,255,255,.055) 45%,transparent);border-right:2px solid rgba(255,255,255,.5);transition:background .18s,border-color .18s}.block:hover .edge,.edge:hover{background:linear-gradient(to left,rgba(255,255,255,.42),rgba(255,255,255,.12) 55%,transparent);border-right-color:rgba(255,255,255,.92)}.controls{position:fixed;right:28px;top:24px;z-index:100}.controls button{border:0;background:rgba(255,255,255,.04);color:rgba(255,255,255,.62);font:11px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:10px 12px}.controls button:hover,.controls button.active{color:#fff;background:rgba(255,255,255,.09)}.previewbox{position:fixed;display:none;z-index:50;background:rgba(255,255,255,.3);outline:1px solid rgba(255,255,255,.65);pointer-events:none}.pullpreview{position:fixed;display:none;z-index:4;background:rgba(255,255,255,.16);outline:1px solid rgba(255,255,255,.38);pointer-events:none}.hint{position:fixed;left:24px;bottom:22px;z-index:100;color:rgba(255,255,255,.34);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.sound{position:fixed;right:28px;bottom:22px;z-index:100;border:0;background:none;color:rgba(255,255,255,.28);font:10px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}@keyframes breathe{0%{transform:translate(-2%,-1%) scale(1.06)}100%{transform:translate(3%,-2%) scale(1.06)}}@keyframes gridBreath{0%{opacity:.68}100%{opacity:.88}}</style></head><body><div class="surface" id="surface"><div class="grid"></div><div class="objects" id="objects"></div><div class="previewbox" id="previewbox"></div><div class="pullpreview" id="pullpreview"></div></div><div class="controls"><button id="sourceBtn">Add Source</button></div><div class="hint" id="hint">Draw anywhere · drag an object to relate · pull its lit edge to follow</div><button class="sound" id="sound">Sound on</button><script>
const U=48,DECK=[
{name:'NOAA satellite',src:'https://www.nesdis.noaa.gov/s3/2021-07/104640_Katrina.mp4',at:.12},{name:'Katrina impacts U.S.',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hurricane_Katrina_Impacts_the_U.S..webm',at:.42},{name:'Arrival animation',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Katrina_Arrival_Animation.ogv',at:.2},{name:'GOES-12',src:'https://www.nesdis.noaa.gov/s3/2025-08/Katrina-2005-09-01-am.mp4',at:.62},{name:'NOAA satellite',src:'https://www.nesdis.noaa.gov/s3/2021-07/104640_Katrina.mp4',at:.58},{name:'Katrina impacts U.S.',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hurricane_Katrina_Impacts_the_U.S..webm',at:.78},{name:'Arrival animation',src:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Katrina_Arrival_Animation.ogv',at:.66},{name:'GOES-12',src:'https://www.nesdis.noaa.gov/s3/2025-08/Katrina-2005-09-01-am.mp4',at:.2}];
const $=id=>document.getElementById(id),surface=$('surface'),objects=$('objects'),previewbox=$('previewbox'),pullpreview=$('pullpreview'),sourceBtn=$('sourceBtn'),hint=$('hint'),soundBtn=$('sound');let gesture=null,start=null,pointer=null,dragRec=null,dragDX=0,dragDY=0,pullParent=null,pullEnd=null,lastPreview='',soundOn=true,audio=null,materialLoaded=false,nextId=1;const rects=[],els=new Map(),pent=[220,247,294,330,392];
function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(r){if(!soundOn)return;ensureAudio();const n=(Math.round(r.x/U)+Math.round(r.y/U))%5,now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=pent[n]*.55;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.018,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.62);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.7)}function cell(x,y){return{x:Math.floor(x/U)*U,y:Math.floor(y/U)*U}}function box(a,b){const l=Math.min(a.x,b.x),t=Math.min(a.y,b.y),r=Math.max(a.x,b.x)+U,bt=Math.max(a.y,b.y)+U;return{x:l,y:t,w:r-l,h:bt-t}}function intersects(q,ignore=null){return rects.some(r=>r!==ignore&&!(q.x+q.w<=r.x||r.x+r.w<=q.x||q.y+q.h<=r.y||r.y+r.h<=q.y))}function source(rec){return DECK[rec.sourceIndex%DECK.length]}function attach(rec,b){if(rec.video)return;const s=source(rec),v=document.createElement('video');rec.video=v;v.src=s.src;v.muted=true;v.loop=true;v.playsInline=true;v.autoplay=true;v.preload='metadata';v.onloadedmetadata=()=>{v.currentTime=Math.max(0,v.duration*s.at);v.play().catch(()=>{});status()};v.onerror=()=>{rec.failed=true;status()};b.insertBefore(v,b.firstChild)}function status(){if(!materialLoaded){hint.textContent='Draw anywhere · drag an object to relate · pull its lit edge to follow';return}const ready=rects.filter(r=>r.video&&r.video.readyState>=1).length,failed=rects.filter(r=>r.failed).length;hint.textContent=failed?`Sources · ${ready} loaded · ${failed} unavailable`:`Sources live · ${ready} / ${rects.length} loaded · draw or pull for more`}
function make(rec){const b=document.createElement('div');b.className='block';const edge=document.createElement('div');edge.className='edge';edge.title='Pull for more';b.appendChild(edge);objects.appendChild(b);els.set(rec.id,b);edge.onpointerdown=e=>beginPull(e,rec);b.onpointerdown=e=>{if(e.target!==edge)beginDrag(e,rec)};b.ondblclick=e=>{e.preventDefault();e.stopPropagation();remove(rec)};if(materialLoaded)attach(rec,b);return b}function remove(rec){if(rec.video)rec.video.pause();els.get(rec.id)?.remove();els.delete(rec.id);const i=rects.indexOf(rec);if(i>=0)rects.splice(i,1);status()}function layout(){rects.forEach(rec=>{const b=els.get(rec.id)||make(rec);if(!b.classList.contains('dragging'))Object.assign(b.style,{left:rec.x+'px',top:rec.y+'px',width:rec.w+'px',height:rec.h+'px'});if(materialLoaded&&!rec.video)attach(rec,b)});status()}
function beginPaint(e){if(e.button!==0||e.target.closest('.block'))return;e.preventDefault();gesture='paint';pointer=e.pointerId;start=cell(e.clientX,e.clientY);previewbox.style.display='block';surface.setPointerCapture(pointer);updatePaint(e.clientX,e.clientY)}function updatePaint(x,y){const q=box(start,cell(x,y));Object.assign(previewbox.style,{left:q.x+'px',top:q.y+'px',width:q.w+'px',height:q.h+'px',background:intersects(q)?'rgba(255,255,255,.08)':'rgba(255,255,255,.3)'})}
function beginDrag(e,rec){e.preventDefault();e.stopPropagation();gesture='drag';pointer=e.pointerId;dragRec=rec;const b=els.get(rec.id);dragDX=e.clientX-rec.x;dragDY=e.clientY-rec.y;b.classList.add('dragging');b.setPointerCapture(pointer)}function updateDrag(x,y){const b=els.get(dragRec.id);b.style.left=(x-dragDX)+'px';b.style.top=(y-dragDY)+'px'}
function beginPull(e,rec){e.preventDefault();e.stopPropagation();gesture='pull';pointer=e.pointerId;pullParent=rec;pullEnd=rec.x+rec.w+U;e.currentTarget.setPointerCapture(pointer);updatePull(e.clientX)}function updatePull(x){const startX=pullParent.x+pullParent.w,endX=Math.max(startX+U,Math.round(x/U)*U),w=endX-startX;pullEnd=endX;Object.assign(pullpreview.style,{display:'block',left:startX+'px',top:pullParent.y+'px',width:w+'px',height:pullParent.h+'px'})}
function instantiate(q,parent=null){if(intersects(q))return;const rec={...q,id:nextId++,sourceIndex:parent?(parent.sourceIndex+1):rects.length,video:null,parentId:parent?.id||null};rects.push(rec);tone(rec);make(rec);if(materialLoaded)attach(rec,els.get(rec.id));layout()}
surface.onpointerdown=beginPaint;window.onpointermove=e=>{if(e.pointerId!==pointer)return;if(gesture==='paint')updatePaint(e.clientX,e.clientY);else if(gesture==='drag')updateDrag(e.clientX,e.clientY);else if(gesture==='pull')updatePull(e.clientX)};window.onpointerup=e=>{if(e.pointerId!==pointer)return;if(gesture==='paint'){const q=box(start,cell(e.clientX,e.clientY));if(!intersects(q))instantiate(q)}else if(gesture==='drag'){const nx=Math.round((e.clientX-dragDX)/U)*U,ny=Math.round((e.clientY-dragDY)/U)*U,q={x:nx,y:ny,w:dragRec.w,h:dragRec.h};if(!intersects(q,dragRec)){dragRec.x=nx;dragRec.y=ny}els.get(dragRec.id).classList.remove('dragging')}else if(gesture==='pull'){const q={x:pullParent.x+pullParent.w,y:pullParent.y,w:Math.max(U,pullEnd-(pullParent.x+pullParent.w)),h:pullParent.h};if(!intersects(q))instantiate(q,pullParent)}previewbox.style.display='none';pullpreview.style.display='none';gesture=null;pointer=null;dragRec=null;pullParent=null;layout()};
sourceBtn.onclick=()=>{if(!rects.length){hint.textContent='Draw a rectangle first, then Add Source';return}materialLoaded=true;sourceBtn.classList.add('active');rects.forEach(r=>attach(r,els.get(r.id)||make(r)));status()};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off'};layout();
</script></body></html>
