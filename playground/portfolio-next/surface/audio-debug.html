<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Audio Debug</title><style>html,body{margin:0;height:100%;background:#171716;color:#ddd;font:12px Arial,sans-serif}main{height:100%;display:grid;place-items:center}.wrap{width:min(760px,88vw)}button{border:0;background:#eee;color:#111;padding:12px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}.status{margin:18px 0 28px;color:#888;text-transform:uppercase;letter-spacing:.08em}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tile{height:180px;border:1px solid #444;display:grid;place-items:center;background:#222;text-transform:uppercase;letter-spacing:.08em;transition:.2s}.tile.active{background:#ddd;color:#111;box-shadow:0 0 0 2px #fff}.note{margin-top:22px;color:#666}</style></head><body><main><div class="wrap"><button id="enable">Enable Audio</button><div class="status" id="status">Click Enable Audio. You should hear two clear tones.</div><div class="tiles"><div class="tile" data-f="330">News</div><div class="tile" data-f="440">Radio</div><div class="tile" data-f="550">Weather</div></div><div class="note">After the two-tone confirmation, hover each tile. Each should play a different continuous tone; leaving the tile stops it.</div></div></main><script>let ctx=null,osc=null,gain=null;const status=document.getElementById('status');function stop(){if(!ctx)return;document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));if(gain){const t=ctx.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setTargetAtTime(.0001,t,.03)}setTimeout(()=>{try{osc&&osc.stop()}catch(e){}osc=gain=null},120)}function ping(f,d){const t=ctx.currentTime+d,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.24)}async function enable(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();ping(440,0);ping(660,.28);status.textContent='Audio ready. Hover News, Radio, or Weather.'}async function start(tile){if(!ctx||ctx.state!=='running'){status.textContent='Click Enable Audio first.';return}stop();tile.classList.add('active');osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=+tile.dataset.f;gain.gain.value=.05;osc.connect(gain);gain.connect(ctx.destination);osc.start()}document.getElementById('enable').onclick=enable;document.querySelectorAll('.tile').forEach(t=>{t.onmouseenter=()=>start(t);t.onmouseleave=stop});</script></body></html>
