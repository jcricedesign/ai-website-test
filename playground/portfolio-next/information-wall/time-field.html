<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katrina — Moving Field</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121212}.stage{position:fixed;inset:0;overflow:hidden;background:#121212}.field{position:absolute;inset:0;will-change:transform}.tile,.focus{position:absolute;width:120px;height:120px;background-image:url('generated/atlas.jpg');background-repeat:no-repeat;filter:grayscale(1)}.focus{z-index:5;pointer-events:none;transform-origin:center;will-change:transform,opacity;transition:opacity 1.5s ease}.focus.hidden{opacity:0}</style></head><body><div class="stage"><div class="field" id="field"></div><div class="focus hidden" id="focus"></div></div><script>
const field=document.getElementById('field'),focus=document.getElementById('focus');const q=new URLSearchParams(location.search),BASE=120,SPEED=parseFloat(q.get('speed')||'.18'),DOUBLE=q.get('double')==='1'||q.get('speed')==='2',V=(DOUBLE?.36:SPEED)*BASE;let M,tiles=[],order=[],offset=0,last=0,nextFocus=0,focusUntil=0,focusSource=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function art(el,it,size=BASE){const k=size/M.cell;el.style.backgroundSize=`${M.atlasWidth*k}px ${M.atlasHeight*k}px`;el.style.backgroundPosition=`-${it.x*k}px -${it.y*k}px`}
function build(){const cols=Math.ceil(innerWidth/BASE)+4,rows=Math.ceil(innerHeight/BASE)+1;order=shuffle([...M.items]);for(let r=0;r<rows;r++)for(let c=-2;c<cols;c++){const i=(r*(cols+2)+(c+2))%order.length,it=order[i],el=document.createElement('div');el.className='tile';art(el,it);el.style.left=(c*BASE)+'px';el.style.top=(r*BASE)+'px';field.appendChild(el);tiles.push({el,it,x:c*BASE,y:r*BASE})}nextFocus=performance.now()+4500}
function chooseFocus(now){const candidates=tiles.filter(t=>{const x=t.x+offset;return x>innerWidth*.35&&x<innerWidth*.82&&t.y>BASE&&t.y<innerHeight-BASE*2});if(!candidates.length)return;const t=candidates[Math.random()*candidates.length|0];focusSource=t;art(focus,t.it,BASE);focus.style.left=(t.x+offset)+'px';focus.style.top=t.y+'px';focus.classList.remove('hidden');focus.style.transform='scale(1)';requestAnimationFrame(()=>requestAnimationFrame(()=>{focus.style.transition='transform 2.2s cubic-bezier(.22,.61,.36,1),opacity 1.5s ease';focus.style.transform='scale(3)'}));focusUntil=now+6500;nextFocus=now+9000+Math.random()*5000}
function releaseFocus(){focus.style.transform='scale(1)';focus.classList.add('hidden');focusSource=null}
function frame(now){if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;offset-=V*dt;if(offset<=-BASE){offset+=BASE;for(const t of tiles){t.x-=BASE;if(t.x<-BASE*2){const max=Math.max(...tiles.filter(a=>a.y===t.y).map(a=>a.x));t.x=max+BASE;const idx=Math.random()*order.length|0;t.it=order[idx];art(t.el,t.it)}}}field.style.transform=`translate3d(${offset}px,0,0)`;if(focusSource){focus.style.left=(focusSource.x+offset)+'px';if(now>=focusUntil)releaseFocus()}else if(now>=nextFocus)chooseFocus(now);requestAnimationFrame(frame)}
fetch('generated/manifest.json?moving=1',{cache:'no-store'}).then(r=>r.json()).then(m=>{M=m;build();requestAnimationFrame(frame)}).catch(console.error);
</script></body></html>
