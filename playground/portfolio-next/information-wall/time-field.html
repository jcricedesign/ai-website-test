<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katrina — Time Field v0.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121212;color:#eee;font-family:Arial,sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:#121212}.artifact{position:absolute;width:120px;height:120px;background-image:url('generated/atlas.jpg');background-repeat:no-repeat;filter:grayscale(1);transform-origin:center center;will-change:transform;z-index:1}.artifact.focus{z-index:3}.terminator{position:fixed;top:0;bottom:0;left:18%;width:1px;background:rgba(255,255,255,.42);z-index:8;pointer-events:none}.clock{position:fixed;top:22px;left:calc(18% + 18px);z-index:9;color:rgba(255,255,255,.72);font-size:12px;line-height:1.45;letter-spacing:.09em;text-transform:uppercase;pointer-events:none}.clock .day{font-weight:700}.clock .time{font-weight:400;color:rgba(255,255,255,.52)}</style></head><body><div class="stage" id="stage"></div><div class="terminator"></div><div class="clock"><div class="day" id="day">DAY 1</div><div class="time" id="time">Hour 00 · 00 min</div></div><script>
const stage=document.getElementById('stage'),dayEl=document.getElementById('day'),timeEl=document.getElementById('time');
const q=new URLSearchParams(location.search);const SPEED=Math.max(.03,parseFloat(q.get('speed')||'.11'));const BASE=120,MAX_SCALE=Math.max(1.5,parseFloat(q.get('focus')||'3'));const TERMINATOR=.18;let manifest,items=[],start=performance.now(),last=start;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function smoothstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
function focusScale(x,w){const line=w*TERMINATOR;const approach=520,depart=280;let s=0;if(x>=line&&x<=line+approach)s=1-smoothstep(line,line+approach,x);else if(x<line&&x>=line-depart)s=smoothstep(line-depart,line,x);return 1+(MAX_SCALE-1)*s}
function build(){const cols=Math.ceil(innerWidth/BASE)+7,rows=Math.ceil(innerHeight/BASE)+2,total=cols*rows;const source=shuffle([...manifest.items]);for(let i=0;i<total;i++){const it=source[i%source.length],el=document.createElement('div'),k=BASE/manifest.cell;el.className='artifact';el.style.backgroundSize=`${manifest.atlasWidth*k}px ${manifest.atlasHeight*k}px`;el.style.backgroundPosition=`-${it.x*k}px -${it.y*k}px`;const col=i%cols,row=Math.floor(i/cols);const obj={el,x:(col-2)*BASE,y:row*BASE,slot:i,sourceIndex:i%source.length};items.push(obj);stage.appendChild(el)}}
function recycle(o,w){const maxX=Math.max(...items.map(a=>a.x));o.x=maxX+BASE;o.sourceIndex=(o.sourceIndex+items.length)%manifest.items.length;const it=manifest.items[o.sourceIndex],k=BASE/manifest.cell;o.el.style.backgroundSize=`${manifest.atlasWidth*k}px ${manifest.atlasHeight*k}px`;o.el.style.backgroundPosition=`-${it.x*k}px -${it.y*k}px`}
function updateClock(now){const historicalMinutes=((now-start)/1000)*SPEED*60;const total=Math.floor(historicalMinutes);const day=Math.floor(total/1440)+1,hour=Math.floor((total%1440)/60),min=total%60;dayEl.textContent=`DAY ${day}`;timeEl.textContent=`Hour ${String(hour).padStart(2,'0')} · ${String(min).padStart(2,'0')} min`}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const w=innerWidth;for(const o of items){o.x-=SPEED*BASE*dt;if(o.x<-BASE*MAX_SCALE)recycle(o,w);const sc=focusScale(o.x+BASE/2,w);o.el.classList.toggle('focus',sc>1.25);o.el.style.transform=`translate3d(${o.x}px,${o.y}px,0) scale(${sc})`}updateClock(now);requestAnimationFrame(frame)}
fetch('generated/manifest.json?timefield=1',{cache:'no-store'}).then(r=>r.json()).then(m=>{manifest=m;build();requestAnimationFrame(t=>{last=t;start=t;frame(t)})}).catch(console.error);
</script></body></html>
