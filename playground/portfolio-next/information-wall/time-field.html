<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katrina — Time Field v0.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121212;color:#eee;font-family:Arial,sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:#121212}.lane{position:absolute;left:0;right:0;height:120px;overflow:visible}.artifact{position:absolute;top:0;width:120px;height:120px;background-image:url('generated/atlas.jpg');background-repeat:no-repeat;filter:grayscale(1);transform-origin:left center;will-change:transform,width,height;z-index:1}.artifact.encounter{z-index:4}.terminator{position:fixed;top:0;bottom:0;left:18%;width:1px;background:rgba(255,255,255,.34);z-index:8;pointer-events:none}.clock{position:fixed;top:20px;left:calc(18% + 16px);z-index:9;color:rgba(255,255,255,.72);font-size:12px;line-height:1.45;letter-spacing:.09em;text-transform:uppercase;pointer-events:none}.clock .day{font-weight:700}.clock .time{color:rgba(255,255,255,.50)}</style></head><body><div class="stage" id="stage"></div><div class="terminator"></div><div class="clock"><div class="day" id="day">DAY 1</div><div class="time" id="time">Hour 00 · 00 min</div></div><script>
const stage=document.getElementById('stage'),dayEl=document.getElementById('day'),timeEl=document.getElementById('time');
const q=new URLSearchParams(location.search),BASE=120,LANES=Math.max(4,Math.floor(innerHeight/BASE)),SPEED=Math.max(.03,parseFloat(q.get('speed')||'.11')),MAX=Math.max(2,parseFloat(q.get('focus')||'3')),LINE=()=>innerWidth*.18;let manifest,lanes=[],start,last;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function smooth(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
function makeCell(it){const el=document.createElement('div'),k=BASE/manifest.cell;el.className='artifact';el.style.backgroundSize=`${manifest.atlasWidth*k}px ${manifest.atlasHeight*k}px`;el.style.backgroundPosition=`-${it.x*k}px -${it.y*k}px`;return el}
function encounterScale(center,line){const approach=600,release=360;if(center>=line&&center<=line+approach)return 1+(MAX-1)*(1-smooth(line,line+approach,center));if(center<line&&center>=line-release)return 1+(MAX-1)*smooth(line-release,line,center);return 1}
function build(){const source=shuffle([...manifest.items]),perLane=Math.ceil(source.length/LANES);for(let r=0;r<LANES;r++){const node=document.createElement('div');node.className='lane';node.style.top=(r*BASE)+'px';stage.appendChild(node);const queue=[];for(let i=r;i<source.length;i+=LANES)queue.push(source[i]);const visible=Math.ceil(innerWidth/BASE)+10;while(queue.length<visible)queue.push(source[(r+queue.length*LANES)%source.length]);const lane={node,queue,cells:[],offset:(r*73)%BASE,nextSource:0};for(let i=0;i<visible;i++){const it=queue[i%queue.length],el=makeCell(it);node.appendChild(el);lane.cells.push({el,it,x:(i-3)*BASE+lane.offset,w:BASE})}lanes.push(lane)}}
function nextArtifact(lane){lane.nextSource=(lane.nextSource+1)%lane.queue.length;return lane.queue[lane.nextSource]}
function setArt(obj,it){obj.it=it;const k=BASE/manifest.cell;obj.el.style.backgroundSize=`${manifest.atlasWidth*k}px ${manifest.atlasHeight*k}px`;obj.el.style.backgroundPosition=`-${it.x*k}px -${it.y*k}px`}
function layoutLane(lane,dt){const line=LINE(),velocity=SPEED*BASE;lane.offset-=velocity*dt;let cursor=lane.offset-3*BASE;for(const o of lane.cells){const center=cursor+BASE/2,sc=encounterScale(center,line),width=BASE*sc;o.x=cursor;o.w=width;o.el.classList.toggle('encounter',sc>1.15);o.el.style.transform=`translate3d(${cursor}px,0,0) scale(${sc})`;cursor+=width}while(lane.cells.length&&lane.cells[0].x+lane.cells[0].w<-BASE){const first=lane.cells.shift(),lastCell=lane.cells[lane.cells.length-1],it=nextArtifact(lane);setArt(first,it);first.x=lastCell.x+lastCell.w;lane.cells.push(first);lane.offset+=BASE}}
function clock(now){const mins=((now-start)/1000)*SPEED*60,total=Math.floor(mins),day=Math.floor(total/1440)+1,h=Math.floor((total%1440)/60),m=total%60;dayEl.textContent=`DAY ${day}`;timeEl.textContent=`Hour ${String(h).padStart(2,'0')} · ${String(m).padStart(2,'0')} min`}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(const lane of lanes)layoutLane(lane,dt);clock(now);requestAnimationFrame(frame)}
fetch('generated/manifest.json?timefield=2',{cache:'no-store'}).then(r=>r.json()).then(m=>{manifest=m;build();start=last=performance.now();requestAnimationFrame(frame)}).catch(console.error);
</script></body></html>
