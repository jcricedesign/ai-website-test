<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katrina Depth Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171716}.stage{position:fixed;inset:0;overflow:hidden}.wall{position:absolute;inset:0;display:grid;align-content:start;justify-content:start;transition:opacity 6s cubic-bezier(.22,.61,.36,1),transform 6s cubic-bezier(.22,.61,.36,1);transform-origin:42% 42%;will-change:opacity,transform}.wall:after{content:"";position:fixed;inset:0;pointer-events:none;background:rgba(55,72,82,.22);mix-blend-mode:color}.wide{grid-template-columns:repeat(auto-fill,120px);grid-auto-rows:120px}.close{grid-template-columns:repeat(auto-fill,240px);grid-auto-rows:240px;opacity:0;transform:scale(.82)}.stage.close .wide{opacity:.12;transform:scale(.985)}.stage.close .close{opacity:1;transform:scale(1)}.cell{background-image:url('generated/atlas.jpg');background-repeat:no-repeat;opacity:.70;transition:opacity 3.6s cubic-bezier(.22,.61,.36,1),filter 3.6s cubic-bezier(.22,.61,.36,1)}.wide .cell{width:120px;height:120px;filter:saturate(0)}.close .cell{width:240px;height:240px;opacity:.82;filter:saturate(.40) brightness(1.04)}.wide .cell.glow{opacity:.96;filter:saturate(.84) brightness(1.56)}.close .cell.glow{opacity:1;filter:saturate(.92) brightness(1.34)}.status{position:fixed;left:18px;bottom:14px;color:#ffffff9e;background:#0005;padding:5px 7px;font:10px Arial;letter-spacing:.08em;text-transform:uppercase;z-index:5}</style><div class="stage" id="stage"><div class="wall wide" id="wide"></div><div class="wall close" id="close"></div></div><div class="status" id="status">loading…</div><script>const S=document.getElementById('stage'),W=document.getElementById('wide'),C=document.getElementById('close'),T=document.getElementById('status');let M,O=[],mode='wide';const q=new URLSearchParams(location.search),cycle=q.get('cycle')!=='0';function sh(a){for(let i=a.length-1;i;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}function cell(it,size){let c=document.createElement('div'),k=size/M.cell;c.className='cell';c.dataset.i=it.index;c.style.backgroundSize=`${M.atlasWidth*k}px ${M.atlasHeight*k}px`;c.style.backgroundPosition=`-${it.x*k}px -${it.y*k}px`;return c}function renderWide(){O.forEach(it=>W.appendChild(cell(it,120)))}function renderClose(){C.innerHTML='';let n=Math.ceil(innerWidth/240)*Math.ceil(innerHeight/240)+8,vis=[...W.children].filter(c=>{let r=c.getBoundingClientRect();return r.right>0&&r.bottom>0&&r.left<innerWidth&&r.top<innerHeight}),anchor=vis.length?+vis[Math.random()*vis.length|0].dataset.i:O[0].index,p=O.findIndex(x=>x.index===anchor);p=Math.max(0,Math.min(O.length-n,p-(n*.35|0)));O.slice(p,p+n).forEach(it=>C.appendChild(cell(it,240)))}function pulse(){let w=mode==='close'?C:W,c=[...w.children],size=mode==='close'?240:120,cols=Math.max(1,innerWidth/size|0),count=mode==='close'?5:16,center=Math.random()*Math.min(c.length,cols*Math.ceil(innerHeight/size))|0,set=new Set([center]),steps=[-1,1,-cols,cols,-cols-1,-cols+1,cols-1,cols+1];while(set.size<count&&set.size<c.length){let a=[...set],n=a[Math.random()*a.length|0]+steps[Math.random()*steps.length|0];if(n>=0&&n<c.length)set.add(n)}set.forEach(i=>c[i]?.classList.add('glow'));setTimeout(()=>set.forEach(i=>c[i]?.classList.remove('glow')),mode==='close'?5200:3000);setTimeout(pulse,mode==='close'?2600:900)}function enter(){mode='close';renderClose();requestAnimationFrame(()=>requestAnimationFrame(()=>S.classList.add('close')));T.textContent='attentive field · 240×240 · 40% color';setTimeout(exit,30000)}function exit(){mode='wide';S.classList.remove('close');T.textContent='ambient field · 120×120';setTimeout(enter,26000)}fetch('generated/manifest.json?depth=1',{cache:'no-store'}).then(r=>r.json()).then(m=>{M=m;O=sh([...m.items]);renderWide();T.textContent=`${m.count} artifacts · ambient field · 120×120`;pulse();if(cycle)setTimeout(enter,18000)})</script>
