<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Information Wall — Katrina</title><style>:root{--cell:96px;--rest-opacity:.72;--sat:0;--cast:.22;--idle-strength:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{font-family:Arial,sans-serif}.wall{position:fixed;inset:0;display:grid;grid-template-columns:repeat(auto-fill,var(--cell));grid-auto-rows:var(--cell);align-content:start;justify-content:start;background:#171716;isolation:isolate}.wall::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:rgba(55,72,82,var(--cast));mix-blend-mode:color}.cell{width:var(--cell);height:var(--cell);overflow:hidden;opacity:0;transform:scale(.96);transition:opacity 1.35s ease,transform 1.35s ease,filter 1.35s ease;position:relative;background-image:url('generated/atlas.jpg');background-repeat:no-repeat;filter:saturate(var(--sat)) brightness(1)}.cell.loaded{opacity:var(--rest-opacity);transform:scale(1)}.cell.glimmer{opacity:min(1,calc(var(--rest-opacity) + .30));filter:saturate(calc(.55 * var(--idle-strength))) brightness(calc(1 + (.38 * var(--idle-strength))))}.status{position:fixed;left:18px;bottom:14px;z-index:10;color:rgba(255,255,255,.62);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.32);padding:5px 7px}.start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#171716;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:default;transition:opacity .35s ease}.start.ready{cursor:pointer}.start.hidden{opacity:0;pointer-events:none}.error{color:#fff}</style></head><body><div class="wall" id="wall"></div><div class="status" id="status">Preloading corpus…</div><div class="start" id="start">Preparing Katrina field…</div><script>
const wall=document.getElementById('wall'),status=document.getElementById('status'),start=document.getElementById('start');let audio=null,manifest=null,ready=false,started=false,idleTimer=null;
const params=new URLSearchParams(location.search);const allowed=[48,72,96,120];let CELL=parseInt(params.get('cell')||'96',10);if(!allowed.includes(CELL))CELL=96;let OPACITY=parseFloat(params.get('opacity')||'.72');if(!Number.isFinite(OPACITY))OPACITY=.72;OPACITY=Math.max(.1,Math.min(1,OPACITY));let SAT=parseFloat(params.get('sat')||'0');if(!Number.isFinite(SAT))SAT=0;SAT=Math.max(0,Math.min(1,SAT));let CAST=parseFloat(params.get('cast')||'.22');if(!Number.isFinite(CAST))CAST=.22;CAST=Math.max(0,Math.min(.8,CAST));let IDLE=parseFloat(params.get('idle')||'1');if(!Number.isFinite(IDLE))IDLE=1;IDLE=Math.max(0,Math.min(2,IDLE));document.documentElement.style.setProperty('--cell',CELL+'px');document.documentElement.style.setProperty('--rest-opacity',OPACITY);document.documentElement.style.setProperty('--sat',SAT);document.documentElement.style.setProperty('--cast',CAST);document.documentElement.style.setProperty('--idle-strength',IDLE);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();return audio.resume()}
function creationTone(i){if(!audio)return;const t=audio.currentTime,scale=[196,220,247,294,330,392,440],base=scale[i%scale.length],o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(base,t);o.frequency.exponentialRampToValueAtTime(base*1.018,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.014,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.36)}
function idlePulse(){if(!started||IDLE<=0)return;const cells=[...wall.children];if(!cells.length)return;const cols=Math.max(1,Math.floor(innerWidth/CELL)),center=Math.floor(Math.random()*cells.length),count=8+Math.floor(Math.random()*8),targets=new Set([center]),steps=[-1,1,-cols,cols,-cols-1,-cols+1,cols-1,cols+1,-2,2,-2*cols,2*cols];while(targets.size<count){const anchor=[...targets][Math.floor(Math.random()*targets.size)],d=steps[Math.floor(Math.random()*steps.length)],n=anchor+d;if(n>=0&&n<cells.length)targets.add(n)}targets.forEach(i=>cells[i].classList.add('glimmer'));setTimeout(()=>targets.forEach(i=>cells[i]?.classList.remove('glimmer')),2100+Math.random()*900);idleTimer=setTimeout(idlePulse,2200+Math.random()*3200)}
async function preload(){try{const [m]=await Promise.all([fetch('generated/manifest.json?atlas=01',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('manifest '+r.status);return r.json()}),new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src='generated/atlas.jpg?atlas=01'})]);manifest=m;ready=true;status.textContent=`${m.count} artifacts ready · ${CELL}×${CELL} · ${Math.round(OPACITY*100)}%`;start.textContent='Begin Katrina field';start.classList.add('ready')}catch(e){status.classList.add('error');status.textContent='Could not load atlas';start.textContent='Atlas unavailable';console.error(e)}}
function materialize(){if(!ready||started)return;started=true;start.classList.add('hidden');const items=shuffle([...manifest.items]),scale=CELL/manifest.cell;status.textContent=`${items.length} artifacts materializing · ${CELL}×${CELL}`;items.forEach((it,i)=>{const c=document.createElement('div');c.className='cell';c.style.backgroundSize=`${manifest.atlasWidth*scale}px ${manifest.atlasHeight*scale}px`;c.style.backgroundPosition=`-${it.x*scale}px -${it.y*scale}px`;wall.appendChild(c);setTimeout(()=>{c.classList.add('loaded');creationTone(i)},Math.min(1500,i*(1500/Math.max(1,items.length-1))))});setTimeout(()=>{status.textContent=`${items.length} artifacts · ${CELL}×${CELL} · ${Math.round(OPACITY*100)}%`;if(IDLE>0)idleTimer=setTimeout(idlePulse,1800)},1800)}
start.addEventListener('click',async()=>{if(!ready)return;await ensureAudio();materialize()});
preload();
</script></body></html>
