<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Information Wall — Katrina</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{font-family:Arial,sans-serif}.wall{position:fixed;inset:0;display:grid;grid-template-columns:repeat(auto-fill,48px);grid-auto-rows:48px;align-content:start;justify-content:start;background:#171716}.cell{width:48px;height:48px;overflow:hidden;opacity:0;transform:scale(.96);transition:opacity 1.5s ease,transform 1.5s ease;mix-blend-mode:multiply;background:#d5d5d0}.cell.loaded{opacity:.72;transform:scale(1)}.cell img{display:block;width:100%;height:100%;object-fit:cover}.status{position:fixed;left:18px;bottom:14px;z-index:10;color:rgba(255,255,255,.62);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.32);padding:5px 7px}.error{color:#fff}</style></head><body><div class="wall" id="wall"></div><div class="status" id="status">Loading Katrina field…</div><script>
const wall=document.getElementById('wall'),status=document.getElementById('status');
const api='https://api.github.com/repos/jcricedesign/ai-website-test/contents/playground/portfolio-next/information-wall/assets';
const ok=/\.(jpe?g|png|webp|gif)$/i;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function load(){try{const r=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub '+r.status);let files=(await r.json()).filter(f=>f.type==='file'&&ok.test(f.name));shuffle(files);status.textContent=`${files.length} artifacts loading`;
files.forEach((f,i)=>{const c=document.createElement('div');c.className='cell';const img=document.createElement('img');img.alt='';img.loading='eager';img.decoding='async';img.src=f.download_url;c.appendChild(img);wall.appendChild(c);img.onload=()=>setTimeout(()=>c.classList.add('loaded'),Math.min(1400,i*9));img.onerror=()=>{c.style.display='none'}});
let done=0;const imgs=[...document.images];imgs.forEach(img=>img.addEventListener('load',()=>{done++;if(done===imgs.length)status.textContent=`${files.length} artifacts · 48×48 field`}));setTimeout(()=>status.textContent=`${files.length} artifacts · 48×48 field`,2400)
}catch(e){status.classList.add('error');status.textContent='Could not load asset folder';console.error(e)}}
load();
</script></body></html>
