<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Information Wall — Katrina</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121212}.wall{position:fixed;inset:0;display:grid;grid-template-columns:repeat(auto-fill,120px);grid-auto-rows:120px;align-content:start;justify-content:start;background:#121212}.cell{width:120px;height:120px;background-image:url('generated/atlas.jpg');background-repeat:no-repeat;opacity:.60;mix-blend-mode:multiply;filter:grayscale(1);}</style></head><body><div class="wall" id="wall"></div><script>const wall=document.getElementById('wall');function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}fetch('generated/manifest.json?baseline=1',{cache:'no-store'}).then(r=>r.json()).then(m=>{const items=shuffle([...m.items]),scale=120/m.cell;items.forEach(it=>{const c=document.createElement('div');c.className='cell';c.style.backgroundSize=`${m.atlasWidth*scale}px ${m.atlasHeight*scale}px`;c.style.backgroundPosition=`-${it.x*scale}px -${it.y*scale}px`;wall.appendChild(c)})}).catch(console.error);</script></body></html>
