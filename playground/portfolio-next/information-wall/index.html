<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Information Wall — Katrina</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{font-family:Arial,sans-serif}.wall{position:fixed;inset:0;display:grid;grid-template-columns:repeat(auto-fill,48px);grid-auto-rows:48px;align-content:start;justify-content:start;background:#171716}.cell{width:48px;height:48px;overflow:hidden;opacity:0;transform:scale(.96);transition:opacity 1.5s ease,transform 1.5s ease;mix-blend-mode:multiply;background:#d5d5d0}.cell.loaded{opacity:.72;transform:scale(1)}.cell img{display:block;width:100%;height:100%;object-fit:cover}.status{position:fixed;left:18px;bottom:14px;z-index:10;color:rgba(255,255,255,.62);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.32);padding:5px 7px}.start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#171716;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:opacity .35s ease}.start.hidden{opacity:0;pointer-events:none}.error{color:#fff}</style></head><body><div class="wall" id="wall"></div><div class="status" id="status">Ready</div><div class="start" id="start">Begin Katrina field</div><script>
const wall=document.getElementById('wall'),status=document.getElementById('status'),start=document.getElementById('start');
const base='https://api.github.com/repos/jcricedesign/ai-website-test/contents/playground/portfolio-next/information-wall';
const sources=[base,base+'/assets'];
const ok=/\.(jpe?g|png|webp|gif)$/i;let audio=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();return audio.resume()}
function creationTone(i){if(!audio)return;const t=audio.currentTime,scale=[196,220,247,294,330,392,440],base=scale[i%scale.length],o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(base,t);o.frequency.exponentialRampToValueAtTime(base*1.018,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.014,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.36)}
async function list(url){const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'ref=main&_='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json','Cache-Control':'no-cache'}});if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
async function load(){try{const groups=await Promise.all(sources.map(list));let files=groups.flat().filter(f=>f.type==='file'&&ok.test(f.name));const unique=new Map();for(const f of files)if(!unique.has(f.sha))unique.set(f.sha,f);files=[...unique.values()];shuffle(files);status.textContent=`${files.length} artifacts loading`;files.forEach((f,i)=>{const c=document.createElement('div');c.className='cell';const img=document.createElement('img');img.alt='';img.loading='eager';img.decoding='async';img.src=f.download_url;c.appendChild(img);wall.appendChild(c);img.onload=()=>setTimeout(()=>{c.classList.add('loaded');creationTone(i)},Math.min(1450,i*9));img.onerror=()=>{c.style.display='none'}});setTimeout(()=>status.textContent=`${files.length} artifacts · 48×48 field`,2600)}catch(e){status.classList.add('error');status.textContent='Could not load corpus';console.error(e)}}
start.addEventListener('click',async()=>{await ensureAudio();start.classList.add('hidden');status.textContent='Loading Katrina field…';load()},{once:true});
</script></body></html>
