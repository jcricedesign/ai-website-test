<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Consequences — John Rice</title>
<meta name="description" content="What we pay attention to determines our reality — an ongoing visual inquiry by John Rice.">
<link rel="canonical" href="https://www.johnrice.com/playground/digital-consequences/">
<script>(()=>{const s=localStorage.getItem('theme'),d=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=s||(d?'dark':'light')})();</script>
<link rel="stylesheet" href="/assets/common/site-shell.css">
<style>
:root{--bg:#f2f1ed;--fg:#111;--muted:#696963;--line:#c9c7c0;--max:1320px}
:root[data-theme=dark]{--bg:#111;--fg:#f5f5f2;--muted:#aaa9a4;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Nimbus Sans L","Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:var(--max);margin:auto;padding:30px 32px 0}
.localhead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;font-size:14px;color:var(--muted)}
.hero{min-height:92vh;display:flex;align-items:center;padding:11vh 0 15vh}
h1{max-width:12.5ch;margin:0;font-size:clamp(58px,9.2vw,132px);font-weight:500;line-height:.88;letter-spacing:-.065em;text-wrap:balance}
.image-stage{margin:0 calc(50% - 50vw);background:#0b0b0a}
.image-stage img{display:block;width:100%;height:auto;min-height:62vh;object-fit:cover}
.after{min-height:68vh}
.pagefoot{border-top:1px solid var(--line);padding:22px 0 30px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
@media(max-width:720px){.wrap{padding:20px 20px 0}.localhead span:last-child{display:none}.hero{min-height:82vh;padding:12vh 0}.image-stage img{min-height:54vh}.after{min-height:48vh}}
</style>
</head>
<body>
<main class="wrap">
<div class="localhead"><span>John Rice — Playground / Visual inquiry</span><span>Digital Consequences · September 2026</span></div>
<section class="hero">
<h1>What we pay attention to determines our reality.</h1>
</section>
<figure class="image-stage">
<img src="https://jcricedesign.github.io/johnrice-site/assets/img/digital-consequences/storefront-hunger-v3.jpg" alt="A luminous new product is displayed inside a pristine showroom while, just outside the window, a person lies beneath a dark blanket on the sidewalk." width="1774" height="887">
</figure>
<section class="after" aria-label="Space for reflection"></section>
<footer class="pagefoot"><span>Digital Consequences</span><span>An ongoing inquiry</span></footer>
</main>
<script src="/assets/common/site-shell.js"></script>
</body>
</html>
