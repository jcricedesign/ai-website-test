const artwork=new Map(),pending=new Set();
const norm=s=>String(s).toLocaleLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const aliases={
 'David Bowie|The Singles 1969 to 1993':['The Singles Collection','The Singles 1969-1993','The Singles 1969–1993','The Singles'],
 'Dead Can Dance|Dead Can Dance':['Dead Can Dance (Remastered)'],
 'Dead Can Dance|Spleen and Ideal':['Spleen and Ideal (Remastered)'],
 'Sharon Jones and the Dap‐Kings|Naturally':['Naturally'],
 'R.E.M.|Monster':['Monster (25th Anniversary Edition)']
};
function albumMatch(found,want){
 const f=norm(found),w=norm(want);
 if(f===w)return 10;
 if(f.startsWith(w)&&(/deluxe|remaster|expanded|edition|anniversary/.test(found.toLowerCase())))return 8;
 if(w.startsWith(f)&&f.length>8)return 6;
 return 0;
}
function artistMatch(found,want){return norm(found)===norm(want)||norm(found).replace(/^the/,'')===norm(want).replace(/^the/,'')}
async function itunesCover(a){
 const names=[a.album,...(aliases[a.artist+'|'+a.album]||[])];
 for(const name of names){
   const url='https://itunes.apple.com/search?'+new URLSearchParams({term:a.artist+' '+name,entity:'album',limit:'100'});
   const res=await fetch(url);if(!res.ok)continue;
   const data=await res.json();
   const matches=(data.results||[]).filter(x=>artistMatch(x.artistName||'',a.artist)).map(x=>({...x,score:Math.max(...names.map(n=>albumMatch(x.collectionName||'',n)))})).filter(x=>x.score>=6).sort((x,y)=>y.score-x.score);
   if(matches[0]?.artworkUrl100)return matches[0].artworkUrl100.replace(/100x100bb/,'600x600bb');
 }
 return null;
}
async function musicbrainzCover(a){
 // Release-group IDs identify the actual album rather than a similarly named recording.
 const url='https://musicbrainz.org/ws/2/release-group/?'+new URLSearchParams({query:'artist:"'+a.artist.replace(/"/g,'')+'" AND releasegroup:"'+a.album.replace(/"/g,'')+'"',fmt:'json',limit:'12'});
 const res=await fetch(url);if(!res.ok)return null;
 const data=await res.json();
 const matches=(data['release-groups']||[]).filter(x=>albumMatch(x.title||'',a.album)>=6 && (x['primary-type']==='Album'||x['primary-type']==='EP'||!x['primary-type']));
 for(const m of matches){
   const src='https://coverartarchive.org/release-group/'+m.id+'/front-500';
   // Image onerror handles releases without accessible front art.
   return src;
 }
 return null;
}
// Verified releases whose original artwork is not reliably found via title search.
const knownArt={
 'Joy Division|Substance':'https://coverartarchive.org/release/e82593ba-55f7-4e03-a003-fff0643ff972/front-500',
 'R.E.M.|Monster':'https://coverartarchive.org/release/3d98cb85-9c53-404c-80d6-f0805661e253/front-500'
};
const knownAppleIds={
 'Stan Getz Quartet|Quintessence, Volume 1':1443136348
};
async function appleIdCover(id){
 const r=await fetch('https://itunes.apple.com/lookup?id='+id+'&entity=album');
 if(!r.ok)return null;
 const a=(await r.json()).results?.find(x=>x.wrapperType==='collection');
 return a?.artworkUrl100?.replace(/100x100bb/,'600x600bb')||null;
}
async function loadCover(i){
 const a=library[i],key=a.artist+'|'+a.album;
 if(artwork.has(key)||pending.has(key))return;
 pending.add(key);
 try{artwork.set(key,knownArt[key]||(knownAppleIds[key]?await appleIdCover(knownAppleIds[key]):null)||(await itunesCover(a))||(await musicbrainzCover(a))||null)}
 catch(e){artwork.set(key,null)}
 finally{pending.delete(key);refreshCovers()}
}
function refreshCovers(){
 document.querySelectorAll('.album[data-index]').forEach(el=>{
 const i=+el.dataset.index,a=library[i],src=artwork.get(a.artist+'|'+a.album),cover=el.querySelector('.cover');
 if(src&&!cover.querySelector('img')){cover.textContent='';const img=document.createElement('img');img.alt='';img.loading='lazy';img.src=src;img.onerror=()=>{img.remove();cover.textContent='Artwork unavailable'};cover.appendChild(img)}
 });
}
let selected=0,focusArea='albums',focusTrack=0,playing=false,playingTrack=-1;
const $=id=>document.getElementById(id);
function moveAlbum(delta){selected=Math.max(0,Math.min(library.length-1,selected+delta));playing=false;playingTrack=-1;focusArea='albums';focusTrack=0}

function render(){const a=library[selected];$('title').textContent=a.name;$('count').textContent=`${selected+1} of ${library.length}`;$('duration').textContent=a.duration;$('play').textContent=playing?'Ⅱ':'▶';$('play').classList.toggle('paused',playing);$('play').classList.toggle('focused',focusArea==='play');$('play').setAttribute('aria-label',playing?'Pause visual playback':'Start visual playback');

}
// Every album has a real flexbox slot. Move the entire row by the selected
// cover's measured offset; do not assign individual positions.
const cards=strip.querySelectorAll('.album');
cards.forEach(el=>{
 const n=+el.dataset.index;

 el.classList.toggle('focused',n===selected&&focusArea==='albums');
 el.querySelector('.album-name').textContent=library[n].name;
 el.tabIndex=(Math.abs(n-selected)<=4)?0:-1;
});

for(let i=Math.max(0,selected-1);i<Math.min(selected+5,library.length);i++)loadCover(i);
refreshCovers();
$('tracks').innerHTML=a.tracks.slice(Math.floor(focusTrack/12)*12,Math.floor(focusTrack/12)*12+12).map((t,j)=>{const i=j+Math.floor(focusTrack/12)*12;return `<button class="track ${focusArea==='tracks'&&focusTrack===i?'focused':''} ${playing&&playingTrack===i?'playing':''}" data-track="${i}">${t.title}</button>`}).join('');$('tracks').querySelectorAll('.track').forEach(el=>el.addEventListener('click',()=>{focusArea='tracks';focusTrack=+el.dataset.track;playing=true;playingTrack=focusTrack;render()}))}
$('play').addEventListener('click',()=>{focusArea='play';togglePlay();render()});document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowRight'){if(focusArea==='albums')moveAlbum(1);else if(focusArea==='tracks')focusTrack=Math.min(library[selected].tracks.length-1,focusTrack+6)}if(e.key==='ArrowLeft'){if(focusArea==='albums')moveAlbum(-1);else if(focusArea==='tracks')focusTrack=Math.max(0,focusTrack-6)}if(e.key==='ArrowDown'){if(focusArea==='albums')focusArea='play';else if(focusArea==='play'){focusArea='tracks';focusTrack=0}else focusTrack=Math.min(library[selected].tracks.length-1,focusTrack+1)}if(e.key==='ArrowUp'){if(focusArea==='tracks'){if(focusTrack===0||focusTrack===6)focusArea='play';else focusTrack--}else if(focusArea==='play')focusArea='albums'}if(e.key==='Enter'||e.key===' '){if(focusArea==='tracks'){if(e.key==='Enter'){playingTrack=focusTrack;playing=true}else togglePlay()}else if(focusArea==='play')togglePlay();else if(e.key===' ')togglePlay()}render()});window.addEventListener('resize',render);render();
