<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Player — Sandbox v0.4</title><meta name="description" content="A visual-only album browser interaction prototype. No audio or library connection."><style>
:root{color-scheme:dark;--fg:#f5f5f5;--line:#f2f2f2}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(1100px 700px at 28% 18%,rgba(255,255,255,.05),transparent 42%),radial-gradient(900px 700px at 88% 84%,rgba(255,255,255,.03),transparent 40%),linear-gradient(180deg,#272727 0%,#232323 52%,#1f1f1f 100%);color:var(--fg)}.frame{width:calc(100% - 7.5vw);height:90vh;margin:5vh auto;border:1px solid #dadada;overflow:hidden;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.01),rgba(0,0,0,.045))}.content{width:min(1030px,82%);padding-top:clamp(40px,6vh,85px);min-width:0}.eyebrow{font-size:18px;margin:0 0 31px}.header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:44px}h1{margin:0;font-size:clamp(30px,4vw,56px);letter-spacing:-.025em;line-height:1.05}.count{font-size:20px;font-weight:bold}.albums{--gap:clamp(18px,2.9vw,44px);--cover-size:calc((100% - 3 * var(--gap))/4);position:relative;height:calc(var(--cover-size) + 46px)}.album{position:absolute;top:0;left:calc(var(--position)*(var(--cover-size) + var(--gap)));width:var(--cover-size);border:0;background:transparent;color:inherit;text-align:left;font:inherit;padding:0;cursor:pointer;transition:left .23s ease}.cover{width:100%;aspect-ratio:1;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 34%),#777;display:grid;place-items:center;color:#101010;font-size:clamp(12px,1.3vw,19px);outline:3px solid transparent;outline-offset:15px;transition:background .12s;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;left:-22%;top:-2%;width:150%;height:34%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.03) 36%,rgba(255,255,255,.18) 48%,rgba(255,255,255,.03) 60%,rgba(255,255,255,0) 100%);transform:translateX(-115%) skewX(-18deg);animation:art-sheen 12s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}.album:nth-child(2) .cover:before{animation-delay:1.8s}.album:nth-child(3) .cover:before{animation-delay:3.4s}.album:nth-child(4) .cover:before{animation-delay:5.2s}.album.active .cover{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 34%),#d7d7d7}.album.focused .cover{outline-color:var(--line)}.album-name{padding-top:20px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album.active .album-name{visibility:hidden}.controls{display:flex;align-items:center;gap:28px;margin-top:48px}.play{border:0;border-radius:50%;height:54px;width:54px;background:#d8d8d8;color:#111;display:grid;place-items:center;cursor:pointer;font-size:25px;padding-left:5px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.16)}.play.paused{padding:0}.play.focused:after{content:"";position:absolute;inset:-10px;border:3px solid white;border-radius:50%}.duration{font-size:20px;color:#ddd}.track-list{margin-top:30px;display:grid;grid-template-columns:repeat(2,minmax(0,240px));grid-auto-flow:column;grid-template-rows:repeat(6,42px);gap:0 8px}.track{min-width:0;height:42px;border:2px solid transparent;background:transparent;color:#eee;text-align:left;font:inherit;font-size:20px;padding:5px 8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track.focused{border-color:#f5f5f5}.track.playing:before{content:'▶';font-size:11px;margin-right:8px}.album:focus-visible,.track:focus-visible,.play:focus-visible{outline:none}@keyframes art-sheen{0%,76%,100%{transform:translateX(-115%) skewX(-18deg);opacity:0}80%{opacity:.95}90%{transform:translateX(28%) skewX(-18deg);opacity:.6}95%{opacity:0}}@media(prefers-reduced-motion:reduce){.cover:before{animation:none}.album{transition:none}}@media(max-height:790px){.content{padding-top:34px}.eyebrow{margin-bottom:20px}.header{margin-bottom:34px}.controls{margin-top:28px}.track-list{margin-top:20px;grid-template-rows:repeat(6,35px)}.track{height:35px;font-size:17px}}@media(max-width:760px){.frame{width:96%;margin:2vh auto;height:96vh}.content{width:87%;padding-top:30px}.eyebrow{font-size:14px}.header{margin-bottom:30px}h1{font-size:32px}.count{font-size:15px}.albums{--gap:14px}.cover{outline-offset:5px}.album-name{font-size:11px;padding-top:14px}.controls{margin-top:30px}.track-list{grid-template-columns:repeat(2,minmax(0,1fr))}.track{font-size:16px}}
</style></head><body><main class="frame"><section class="content"><p class="eyebrow">Music player v1.0</p><header class="header"><h1 id="title">Album name</h1><div class="count" id="count">1 of 67</div></header><div class="albums" id="albums"></div><div class="controls"><button class="play" id="play" aria-label="Play selected album">▶</button><span class="duration" id="duration">45m</span></div><div class="track-list" id="tracks"></div></section></main><script>
// Visual prototype only; no audio, APIs, persistence, or connections.
const library=Array.from({length:67},(_,i)=>({name:i===0?'Album name':`Album ${i+1}`,duration:`${45+(i%9)}m`,tracks:Array.from({length:12},(_,j)=>`Title ${j+1}`)}));
let selected=0,focusArea='albums',focusTrack=0,playing=false,playingTrack=-1;
const $=id=>document.getElementById(id);
function moveAlbum(delta){selected=Math.max(0,Math.min(library.length-1,selected+delta));playing=false;playingTrack=-1;focusArea='albums'}
function togglePlay(){playing=!playing;if(playing&&playingTrack<0)playingTrack=0}
function render(){const a=library[selected];$('title').textContent=a.name;$('count').textContent=`${selected+1} of ${library.length}`;$('duration').textContent=a.duration;$('play').textContent=playing?'Ⅱ':'▶';$('play').classList.toggle('paused',playing);$('play').classList.toggle('focused',focusArea==='play');$('play').setAttribute('aria-label',playing?'Pause visual playback':'Start visual playback');
let html='';for(let n=Math.max(0,selected-1);n<Math.min(selected+4,library.length);n++){const pos=n-selected;html+=`<button class="album ${pos===0?'active':''} ${focusArea==='albums'&&pos===0?'focused':''}" style="--position:${pos}" data-index="${n}" aria-label="Select ${library[n].name}"><div class="cover">Album preview</div><div class="album-name">${library[n].name}</div></button>`} $('albums').innerHTML=html;$('albums').querySelectorAll('.album').forEach(el=>el.addEventListener('click',()=>{selected=+el.dataset.index;focusArea='albums';playing=false;playingTrack=-1;render()}));
$('tracks').innerHTML=a.tracks.map((t,i)=>`<button class="track ${focusArea==='tracks'&&focusTrack===i?'focused':''} ${playing&&playingTrack===i?'playing':''}" data-track="${i}">${t}</button>`).join('');$('tracks').querySelectorAll('.track').forEach(el=>el.addEventListener('click',()=>{focusArea='tracks';focusTrack=+el.dataset.track;playing=true;playingTrack=focusTrack;render()}))}
$('play').addEventListener('click',()=>{focusArea='play';togglePlay();render()});document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowRight'){if(focusArea==='albums')moveAlbum(1);else if(focusArea==='tracks')focusTrack=(focusTrack+6)%12}if(e.key==='ArrowLeft'){if(focusArea==='albums')moveAlbum(-1);else if(focusArea==='tracks')focusTrack=(focusTrack+6)%12}if(e.key==='ArrowDown'){if(focusArea==='albums')focusArea='play';else if(focusArea==='play'){focusArea='tracks';focusTrack=0}else focusTrack=(focusTrack+1)%12}if(e.key==='ArrowUp'){if(focusArea==='tracks'){if(focusTrack===0||focusTrack===6)focusArea='play';else focusTrack--}else if(focusArea==='play')focusArea='albums'}if(e.key==='Enter'||e.key===' '){if(focusArea==='tracks'){if(e.key==='Enter'){playingTrack=focusTrack;playing=true}else togglePlay()}else if(focusArea==='play')togglePlay();else if(e.key===' ')togglePlay()}render()});render();
</script></body></html>
