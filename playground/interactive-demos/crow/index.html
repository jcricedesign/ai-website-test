<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crow</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0ead8;
      overflow: hidden;
    }

    .paper {
      position: relative;
      width: min(520px, 90vw);
      aspect-ratio: 800 / 946;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Soft washi texture via layered radial gradients */
    .paper::before {
      content: '';
      position: absolute;
      inset: -60px;
      background:
        radial-gradient(ellipse 80% 60% at 30% 20%, rgba(210,195,160,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 75% 70%, rgba(185,170,135,0.25) 0%, transparent 65%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(240,234,216,0.9) 0%, rgba(225,215,190,0.6) 100%);
      border-radius: 4px;
      z-index: 0;
    }

    /* Subtle vignette */
    .paper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 50%, rgba(160,140,100,0.18) 100%);
      z-index: 2;
      pointer-events: none;
    }

    svg.crow {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* The crow path itself */
    #crow-path {
      fill: none;
      stroke: #1a1008;
      stroke-width: 0;
      fill-opacity: 0;
    }

    /* Ink wash layer — soft blue-black fill */
    #crow-wash {
      fill: #1a1008;
      fill-opacity: 0;
    }

    /* Subtle indigo glaze */
    #crow-glaze {
      fill: #1e1a2e;
      fill-opacity: 0;
    }

    /* Seal mark */
    .seal {
      opacity: 0;
    }

    .seal rect {
      fill: #8b1a1a;
    }

    .seal text {
      fill: #f0ead8;
      font-family: serif;
      font-size: 11px;
      font-weight: bold;
    }

    /* Haiku lines */
    .haiku-line {
      opacity: 0;
      font-family: 'Georgia', serif;
      font-size: 11px;
      fill: #3a2e1a;
      letter-spacing: 0.12em;
    }

    .corvid-text {
      opacity: 0;
      font-family: 'Noto Serif SC', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-weight: 300;
      fill: #b8bcc4;
      letter-spacing: 0.18em;
    }
  </style>
</head>

  <script>
    function easeInOutSine(t) {
      return -(Math.cos(Math.PI * t) - 1) / 2;
    }
    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }
    function easeInQuart(t) {
      return t * t * t * t;
    }

    const wash = document.getElementById('crow-wash');
    const glaze = document.getElementById('crow-glaze');
    const seal = document.querySelector('.seal');
    const haikuLines = document.querySelectorAll('.haiku-line');
    const corvidLines = document.querySelectorAll('.corvid-text');

    const totalDuration = 7500;
    const startTime = performance.now();

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / totalDuration, 1);

      // Phase 1: ink wash blooms in (0 → 0.55 of total)
      // Starts as a ghost, deepens to full ink
      const washPhase = Math.min(elapsed / (totalDuration * 0.55), 1);
      const washOpacity = easeInOutSine(washPhase);
      wash.style.fillOpacity = washOpacity;

      // Phase 2: iridescent glaze settles in (0.2 → 0.75)
      const glazeStart = totalDuration * 0.2;
      const glazeDuration = totalDuration * 0.55;
      const glazePhase = Math.max(0, Math.min((elapsed - glazeStart) / glazeDuration, 1));
      glaze.style.fillOpacity = easeOutQuart(glazePhase) * 0.45;

      // Phase 3: seal appears (0.7 → 0.9)
      const sealStart = totalDuration * 0.7;
      const sealDuration = totalDuration * 0.2;
      const sealPhase = Math.max(0, Math.min((elapsed - sealStart) / sealDuration, 1));
      seal.style.opacity = easeInOutSine(sealPhase);

      // Phase 4: haiku lines appear staggered (0.75 → 1.0)
      haikuLines.forEach((line, i) => {
        const lineStart = totalDuration * (0.75 + i * 0.07);
        const lineDuration = totalDuration * 0.15;
        const linePhase = Math.max(0, Math.min((elapsed - lineStart) / lineDuration, 1));
        line.style.opacity = easeInOutSine(linePhase) * 0.7;
      });

      // Phase 5: Corvid Corvus drifts in over the crow (0.45 → 0.75), settles at low opacity
      corvidLines.forEach((line, i) => {
        const lineStart = totalDuration * (0.45 + i * 0.1);
        const lineDuration = totalDuration * 0.3;
        const linePhase = Math.max(0, Math.min((elapsed - lineStart) / lineDuration, 1));
        line.style.opacity = easeInOutSine(linePhase) * 0.55;
      });

      if (t < 1) {
        requestAnimationFrame(animate);
      }
    }

    requestAnimationFrame(animate);
  </script>
