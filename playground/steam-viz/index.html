<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steam Live Population</title>
  <style>
    :root{
      --bg:#ef6354;
      --ink:#fff8f0;
      --muted:rgba(255,248,240,.72);
      --cs2:#f4f1e8;
      --dota:#243447;
      --pubg:#ffd166;
      --hd2:#8ecae6;
      --gta:#caffbf;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;overflow:hidden}
    .wrap{
      min-height:100vh;
      padding:3.2vw 4vw 2.8vw;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:4vh;
    }
    .header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:3vw;
    }
    .eyebrow{
      font-size:clamp(16px,1.25vw,24px);
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:.4rem;
    }
    .total{
      font-size:clamp(58px,7.3vw,132px);
      line-height:.92;
      font-weight:800;
      letter-spacing:-.04em;
      white-space:nowrap;
    }
    .scale{
      text-align:right;
      font-size:clamp(16px,1.35vw,26px);
      line-height:1.2;
      font-weight:700;
      padding-bottom:.45rem;
      white-space:nowrap;
    }
    .viz{
      display:grid;
      grid-template-columns:1.35fr 1.18fr .78fr .55fr .48fr;
      gap:1.4vw;
      align-items:end;
      min-height:0;
    }
    .game{
      display:grid;
      grid-template-rows:1fr auto;
      min-width:0;
      min-height:0;
    }
    .circles{
      display:flex;
      flex-wrap:wrap-reverse;
      align-content:flex-start;
      gap:8px;
      min-height:100%;
      padding:0 0 .65rem;
      align-items:flex-start;
    }
    .dot{
      width:clamp(25px,2.15vw,40px);
      height:clamp(25px,2.15vw,40px);
      border-radius:50%;
      flex:0 0 auto;
      opacity:.98;
      animation:breathe var(--dur,7s) ease-in-out infinite;
      animation-delay:var(--delay,0s);
      transform-origin:center;
    }
    @keyframes breathe{
      0%,100%{transform:scale(1);opacity:.93}
      50%{transform:scale(1.045);opacity:1}
    }
    .label{
      border-top:2px solid rgba(255,255,255,.28);
      padding-top:.55rem;
      display:grid;
      gap:.12rem;
    }
    .name{
      font-size:clamp(22px,2vw,38px);
      font-weight:800;
      line-height:1;
    }
    .count{
      font-size:clamp(20px,1.55vw,30px);
      line-height:1.1;
      font-weight:700;
    }
    .delta{
      font-size:clamp(15px,1.15vw,22px);
      line-height:1.15;
      color:var(--muted);
      font-weight:700;
    }
    @media (max-width:1100px){
      body{overflow:auto}
      .wrap{grid-template-rows:auto auto}
      .header{align-items:flex-start;flex-direction:column}
      .scale{text-align:left}
      .total{white-space:normal}
      .viz{grid-template-columns:1fr 1fr}
      .game{min-height:260px}
    }
    @media (prefers-reduced-motion:reduce){
      .dot{animation:none}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <div class="eyebrow">Steam live population</div>
        <div class="total" id="totalPlayers">1,072,671 playing now</div>
      </div>
      <div class="scale">1 circle = 10,000 players</div>
    </header>

    <section class="viz" id="viz" aria-label="Steam player population by game"></section>
  </main>

  <script>
    const UNIT = 10000;

    const games = [
      { name:"CS2", players:491698, delta5m:2100, color:"var(--cs2)" },
      { name:"DOTA 2", players:393337, delta5m:-800, color:"var(--dota)" },
      { name:"PUBG", players:112950, delta5m:400, color:"var(--pubg)" },
      { name:"HD2", players:45942, delta5m:350, color:"var(--hd2)" },
      { name:"GTA V", players:28744, delta5m:-547, color:"var(--gta)" }
    ];

    const nf = new Intl.NumberFormat("en-US");

    function shortDelta(n){
      const sign = n > 0 ? "+" : "";
      const abs = Math.abs(n);
      if(abs >= 1000) return sign + (n/1000).toFixed(abs >= 10000 ? 0 : 1) + "K / 5m";
      return sign + nf.format(n) + " / 5m";
    }

    function build(){
      const viz = document.getElementById("viz");
      const total = games.reduce((sum,g)=>sum+g.players,0);
      document.getElementById("totalPlayers").textContent = nf.format(total) + " playing now";
      viz.innerHTML = "";

      games.forEach((game, gameIndex)=>{
        const section = document.createElement("article");
        section.className = "game";

        const circles = document.createElement("div");
        circles.className = "circles";

        const count = Math.round(game.players / UNIT);
        for(let i=0;i<count;i++){
          const dot = document.createElement("span");
          dot.className = "dot";
          dot.style.background = game.color;
          const movement = Math.min(Math.abs(game.delta5m)/2500, 1);
          dot.style.setProperty("--dur", (7.5 - movement*2.2) + "s");
          dot.style.setProperty("--delay", (((i+gameIndex)%8)*0.22) + "s");
          circles.appendChild(dot);
        }

        const label = document.createElement("div");
        label.className = "label";
        label.innerHTML = `
          <div class="name">${game.name}</div>
          <div class="count">${nf.format(game.players)}</div>
          <div class="delta">${shortDelta(game.delta5m)}</div>
        `;

        section.appendChild(circles);
        section.appendChild(label);
        viz.appendChild(section);
      });
    }

    build();
  </script>
</body>
</html>
