<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/assets/common/JCR_sigil.png" type="image/png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dailies — John Rice</title>
<meta name="description" content="One design, every day. Daily design studies by John Rice.">
<script>(()=>{const s=localStorage.getItem('theme'),d=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=s||(d?'dark':'light')})();</script>
<link rel="stylesheet" href="/assets/common/site-shell.css">
<style>
:root{--bg:#f7f7f5;--text:#111;--muted:#686865;--faint:#999994;--rule:rgba(0,0,0,.14)}
:root[data-theme=dark]{--bg:#111;--text:#f5f5f2;--muted:#aaa9a4;--faint:#777772;--rule:rgba(255,255,255,.15)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Nimbus Sans","Nimbus Sans L","Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{width:min(1000px,calc(100% - 96px));margin:auto}.hero{padding:80px 0 72px;max-width:760px}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:0 0 18px}
h1{font-size:clamp(3rem,6vw,5.6rem);line-height:.94;letter-spacing:-.055em;margin:0}.hero p{max-width:620px;margin:24px 0 0;font-size:1.08rem;line-height:1.55;color:var(--muted)}
.list{padding-bottom:100px}.year{border-top:1px solid var(--rule);padding:28px 0 0}.year h2{margin:0 0 28px;font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.empty{display:grid;grid-template-columns:150px 1fr;gap:28px;border-top:1px solid var(--rule);padding:26px 0;color:var(--muted)}.date{font-size:.78rem;color:var(--faint)}.empty p{margin:0;line-height:1.5}
@media(max-width:700px){.wrap{width:calc(100% - 36px)}.hero{padding:56px 0}.empty{grid-template-columns:1fr;gap:8px}}
</style></head>
<body><div class="wrap"><main>
<section class="hero"><p class="eyebrow">Daily practice</p><h1 data-jcr-atari>Dailies</h1><p>One design, every day. No fixed medium, format, or outcome—just the discipline of making something and putting it here.</p></section>
<section class="list"><div class="year"><h2>2026</h2><div class="empty"><div class="date">October 7</div><p>First daily coming here.</p></div></div></section>
</main></div><script src="/assets/common/site-shell.js"></script></body></html>
