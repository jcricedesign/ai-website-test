<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Cover — Playground</title><meta name="description" content="Living Cover: short animated editorial covers. A collection of visual openings by John Rice.">
<link rel="icon" href="/assets/common/JCR_sigil.png" type="image/png">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111214;color:#efefec;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
button,a{font:inherit}a{color:inherit;text-decoration:none}.shell{width:min(1240px,calc(100% - 64px));margin:0 auto}.site{display:flex;justify-content:space-between;align-items:center;padding:30px 0;border-bottom:1px solid #343538;font-size:12px}.site a:hover,.back:hover{text-decoration:underline}
header{padding:65px 0 44px}.eyebrow,.kicker{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#888b8d}h1{font-weight:650;line-height:1;letter-spacing:-.055em;font-size:clamp(48px,7vw,84px);margin:13px 0 20px}header p{max-width:520px;font-size:16px;line-height:1.5;color:#b8b9b9}
.gallery{border-top:1px solid #343538;padding:25px 0 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,210px));gap:24px}
.cover-card{display:block;width:100%;max-width:210px;text-align:left;border:0;background:transparent;padding:0;cursor:pointer}
.thumb{position:relative;aspect-ratio:2/3;height:auto;background:#252628;border:1px solid #45464a;overflow:hidden}
.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb:after{content:"▶";position:absolute;bottom:13px;right:13px;background:#0d0d0dce;color:#fff;padding:7px 10px;font-size:12px}
.name{display:block;font-size:17px;font-weight:600;letter-spacing:-.025em;margin-top:13px}.details{display:block;font-size:11px;letter-spacing:.04em;color:#85878a;margin-top:4px}
.cover-card:hover .thumb{border-color:#a5a6a8}.endnote{font-size:12px;color:#777a7d;padding-bottom:40px}
@media(max-width:700px){.shell{width:calc(100% - 36px)}header{padding:50px 0 32px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="shell"><nav class="site"><a href="/playground/">← Playground</a><span>JCRICE / EXPERIMENTS</span></nav>
<header><div class="eyebrow">Motion studies / Collection 001</div><h1>Living Cover</h1><p>A collection of short animated editorial covers. Hover over a cover to watch it open, or click to replay the animation in place.</p></header>
<div class="kicker">Covers / 002</div>
<main class="gallery"><button class="cover-card" type="button" data-cover="ali" aria-label="Play Muhammad Ali living cover">
<div class="thumb"><video id="thumbAli" muted playsinline preload="metadata" aria-hidden="true"><source src="https://pub-8150ade24f1a45dfa4e16936ba894a95.r2.dev/living-cover/living-cover-muhammed-ali.mp4" type="video/mp4"></video></div>
<span class="name">Muhammad Ali</span><span class="details">001 · Animated cover · 4 sec</span></button>
<button class="cover-card" type="button" data-cover="bruce" aria-label="Play Bruce Lee living cover"><div class="thumb"><video id="thumbBruce" muted playsinline preload="metadata" aria-hidden="true"><source src="https://pub-8150ade24f1a45dfa4e16936ba894a95.r2.dev/living-cover/living-cover-opening-2.mp4" type="video/mp4"></video></div><span class="name">Bruce Lee</span><span class="details">002 · Animated cover · 4 sec</span></button></main>
<div class="endnote">Hover to preview · Click to replay · More covers coming soon.</div></div>
<script>
const covers=[...document.querySelectorAll('.cover-card')];
const prefersReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function showFinal(video){
 if(video.readyState<1||!Number.isFinite(video.duration)||video.duration<=0)return;
 video.pause();
 try{video.currentTime=Math.max(0,video.duration-0.06)}catch(e){}
}
function replay(video){
 // Only one animated thumbnail at a time; others return to their final frame.
 for(const card of covers){const v=card.querySelector('video');if(v!==video)showFinal(v)}
 video.pause();
 try{video.currentTime=0}catch(e){}
 video.play().catch(()=>{});
}
for(const card of covers){
 const video=card.querySelector('video');
 video.addEventListener('loadedmetadata',()=>showFinal(video));
 video.addEventListener('ended',()=>showFinal(video));
 card.addEventListener('click',()=>replay(video));
 if(!prefersReducedMotion){
  card.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')replay(video)});
  card.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')showFinal(video)});
 }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const card of covers)showFinal(card.querySelector('video'))});
</script>
</body></html>
