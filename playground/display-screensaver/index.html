<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambient Display — John Rice</title>
<meta name="description" content="A quiet ambient resting state for the portfolio display.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#070809;--fg:#f2f2ef;--muted:rgba(242,242,239,.42);--soft:rgba(242,242,239,.12);--accent:#7b61ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);cursor:none}.ambient{position:fixed;inset:0;background:radial-gradient(circle at 72% 22%,rgba(123,97,255,.08),transparent 34%),var(--bg)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.content{position:absolute;inset:0;padding:7vh 6vw;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top{display:flex;align-items:flex-start;gap:2.4vw}.time{font-size:clamp(72px,12vw,190px);font-weight:300;letter-spacing:-.055em;line-height:.82}.meta{padding-top:.6vh;font-size:clamp(22px,2.3vw,38px);font-weight:450;line-height:1.25;color:var(--muted)}.temperature{color:var(--fg)}.bottom{display:flex;justify-content:space-between;align-items:flex-end}.identity{font-size:clamp(16px,1.35vw,24px);letter-spacing:.16em;text-transform:uppercase;color:rgba(242,242,239,.28)}.state{font-size:clamp(13px,1vw,18px);letter-spacing:.16em;text-transform:uppercase;color:rgba(242,242,239,.18)}
</style>
</head>
<body>
<div class="ambient">
  <canvas id="life" aria-hidden="true"></canvas>
  <div class="content">
    <div class="top">
      <div class="time" id="time">--:--</div>
      <div class="meta"><div id="period"></div><div class="temperature" id="temperature">Seattle</div></div>
    </div>
    <div class="bottom"><div class="identity">John Rice · Designer · Seattle</div><div class="state">Display resting</div></div>
  </div>
</div>
<script>
const timeEl=document.getElementById('time'),periodEl=document.getElementById('period');
function updateClock(){const d=new Date(),parts=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);timeEl.textContent=(parts.find(p=>p.type==='hour')?.value||'')+':'+(parts.find(p=>p.type==='minute')?.value||'');periodEl.textContent=parts.find(p=>p.type==='dayPeriod')?.value||''}
updateClock();setInterval(updateClock,1000);

// Temperature intentionally reuses a value supplied by the portfolio when available.
// Until that bridge is connected, the resting state remains useful without making a network request.
const savedTemp=localStorage.getItem('jcr-display-temperature');
if(savedTemp)document.getElementById('temperature').textContent=savedTemp;

const canvas=document.getElementById('life'),ctx=canvas.getContext('2d');let w,h,dpr,particles=[];
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.max(24,Math.min(54,Math.round(w/32)));particles=Array.from({length:count},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:.7+Math.random()*1.6,vx:(Math.random()-.5)*.055,vy:-.025-Math.random()*.07,p:Math.random()*Math.PI*2,a:.08+Math.random()*.16}))}
addEventListener('resize',resize,{passive:true});resize();
let last=0;
function frame(t){requestAnimationFrame(frame);if(t-last<33)return;const dt=Math.min(2,(t-last)/16.67||1);last=t;ctx.clearRect(0,0,w,h);
  // Two very low-contrast waves give the surface a slow breathing motion.
  for(let band=0;band<2;band++){ctx.beginPath();for(let x=-20;x<=w+20;x+=18){const y=h*(.48+band*.17)+Math.sin(x*.006+t*.00018+band*1.8)*h*.025+Math.sin(x*.0023-t*.00011)*h*.018;x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle=band?'rgba(123,97,255,.075)':'rgba(242,242,239,.045)';ctx.lineWidth=1.4;ctx.stroke()}
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.p+=.003*dt;if(p.y<-8){p.y=h+8;p.x=Math.random()*w}if(p.x<-8)p.x=w+8;if(p.x>w+8)p.x=-8;const pulse=.72+Math.sin(p.p)*.28;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(242,242,239,${p.a*pulse})`;ctx.fill()}
}
requestAnimationFrame(frame);
</script>
</body>
</html>
