<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display Screensaver — Playground — John Rice</title>
<meta name="description" content="A geometric idle-state experiment for the portfolio display.">
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--fg:#f2f0e8;--dim:rgba(242,240,232,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{cursor:none}.field{position:fixed;inset:0;overflow:hidden;background:var(--bg)}.shape{position:absolute;will-change:transform;border:1px solid var(--dim);opacity:.9}.circle{border-radius:50%}.solid{border:0;background:var(--fg);opacity:.88}.line{height:1px;border:0;background:var(--fg);opacity:.22;transform-origin:left center}.ring{border:2px solid var(--fg);opacity:.38}.sigil{position:absolute;left:50%;top:50%;width:min(15vw,220px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.08}.sigil:before,.sigil:after{content:"";position:absolute;border:2px solid var(--fg);border-radius:50%}.sigil:before{width:100%;height:100%;inset:0}.sigil:after{width:34%;height:34%;left:33%;top:33%}.sigil i{position:absolute;left:50%;top:-18%;width:2px;height:136%;background:var(--fg);transform:rotate(45deg);transform-origin:center}.note{position:fixed;left:28px;bottom:24px;color:rgba(242,240,232,.28);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .4s}.show-note .note{opacity:1}@media(prefers-reduced-motion:reduce){.shape{display:none}.sigil{opacity:.16}}
</style>
</head>
<body>
<div class="field" id="field" aria-label="Slow geometric screensaver experiment">
  <div class="sigil"><i></i></div>
  <div class="note">Move or press any key to exit preview</div>
</div>
<script>
const field=document.getElementById('field');
const palette=['#f2f0e8','#ef4b3f','#f0c541','#4c72ff','#4fa36c'];
const specs=[
 {kind:'ring',size:26,x:7,y:10,vx:.42,vy:.18},
 {kind:'solid circle',size:5,x:78,y:17,vx:-.24,vy:.31,color:2},
 {kind:'shape',size:18,x:67,y:62,vx:-.18,vy:-.23,color:3},
 {kind:'line',size:34,x:12,y:76,vx:.21,vy:-.13,rot:-18},
 {kind:'ring circle',size:11,x:43,y:31,vx:.13,vy:.19,color:1},
 {kind:'solid',size:3,x:28,y:48,vx:.31,vy:-.17,color:4}
];
const items=specs.map((s,i)=>{const e=document.createElement('div');e.className=`shape ${s.kind}`;if(s.kind.includes('line')){e.style.width=s.size+'vw';e.style.transform=`rotate(${s.rot||0}deg)`}else{e.style.width=s.size+'vw';e.style.height=s.size+'vw'}if(s.color!=null){if(s.kind.includes('solid')||s.kind.includes('line'))e.style.background=palette[s.color];else e.style.borderColor=palette[s.color]}field.appendChild(e);return{...s,e,phase:i*.9}});
let last=performance.now();
function frame(now){const dt=Math.min(32,now-last)/1000;last=now;items.forEach((s,i)=>{s.x+=s.vx*dt;s.y+=s.vy*dt;const margin=s.size*.45;if(s.x>100+margin)s.x=-margin;if(s.x<-margin)s.x=100+margin;if(s.y>100+margin)s.y=-margin;if(s.y<-margin)s.y=100+margin;s.phase+=dt*.055;const drift=Math.sin(s.phase)*1.4;const rot=(s.rot||0)+Math.sin(s.phase*.63)*7;s.e.style.transform=`translate3d(${s.x}vw,${s.y+drift}vh,0) rotate(${rot}deg)`});requestAnimationFrame(frame)}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(frame);
let noteTimer;function activity(){document.body.classList.add('show-note');clearTimeout(noteTimer);noteTimer=setTimeout(()=>document.body.classList.remove('show-note'),1200)}['pointermove','keydown','touchstart'].forEach(evt=>addEventListener(evt,activity,{passive:true}));
</script>
</body>
</html>
