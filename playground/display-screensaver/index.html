<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display Screensaver — Playground — John Rice</title>
<meta name="description" content="A generative waveform idle-state experiment for the portfolio display.">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}body{cursor:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#080808}.note{position:fixed;left:28px;bottom:24px;color:rgba(255,255,255,.22);font:10px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:0;transition:opacity .35s}.show-note .note{opacity:1}
</style>
</head>
<body>
<canvas id="c" aria-label="Slow generative waveform screensaver"></canvas>
<div class="note">Display screensaver · waveform study</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const BG='#080808',FG='#f1f1ef';
let W=0,H=0;
function resize(){
  const aspect=innerWidth/innerHeight;
  W=Math.min(innerWidth,1600);
  H=Math.round(W/aspect);
  if(H>900){H=900;W=Math.round(H*aspect)}
  cv.width=W;cv.height=H;
}
addEventListener('resize',resize,{passive:true});resize();

const STATES=[
 {count:22,amp:.45,chaos:.25,thick:.30,surge:.10,hold:15},
 {count:27,amp:.82,chaos:.48,thick:.48,surge:.30,hold:17},
 {count:30,amp:1.08,chaos:.67,thick:.58,surge:.50,hold:15},
 {count:21,amp:.32,chaos:.18,thick:.22,surge:.05,hold:17},
 {count:31,amp:1.28,chaos:.88,thick:.68,surge:.68,hold:9}
];
const TRANSITION=7,MAX_WAVES=32,SAMPLES=180;
const seeds=Array.from({length:MAX_WAVES},()=>({
 seed:Math.random()*200,phase:Math.random()*Math.PI*2,dir:Math.random()<.5?1:-1,
 freq:.7+Math.random()*1.05,lw:Math.random(),drift:(.012+Math.random()*.045)*(Math.random()<.5?1:-1),
 echo:2+Math.random()*4,echo2:6+Math.random()*6,double:Math.random()<.22,
 surgeX:.14+Math.random()*.72,surgeW:.08+Math.random()*.15,surgeAmp:1.6+Math.random()*2.5,
 focus:(Math.random()-.5)*.18
}));
function ease(t){return t<.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1}
function stateAt(clock){let total=0;for(const s of STATES)total+=s.hold+TRANSITION;let p=clock%total;for(let i=0;i<STATES.length;i++){const A=STATES[i],B=STATES[(i+1)%STATES.length],seg=A.hold+TRANSITION;if(p<=seg){const q=p<A.hold?0:ease((p-A.hold)/TRANSITION),mix=(a,b)=>a+(b-a)*q;return{count:Math.round(mix(A.count,B.count)),amp:mix(A.amp,B.amp),chaos:mix(A.chaos,B.chaos),thick:mix(A.thick,B.thick),surge:mix(A.surge,B.surge)}}p-=seg}return STATES[0]}
function noise(x,seed,freq,t,oct){let v=0,a=1,n=0;for(let o=0;o<oct;o++){const f=freq*(o+1);v+=Math.sin(x*f+seed*4.3+o*1.7+t*.6)*a;v+=Math.sin(x*f*1.618+seed*2.9+o*2.3+t*.4)*a*.5;n+=a*1.5;a*=.52}return v/n}
function waveY(ws,xf,yBase,baseAmp,state,rawT,index,count){
  const t=index/(count-1),oct=2+((t*3)|0),anim=rawT*.52*ws.dir*(.5+state.chaos*.75)+ws.phase;
  let d=noise(xf+rawT*ws.drift*.012,ws.seed,1.15*ws.freq*(.65+state.chaos*1.15),anim,oct);
  const center=.5+ws.focus+Math.sin(rawT*.04+ws.phase)*.10,width=.20+state.chaos*.08,fd=(xf-center)/width;
  d*=.18+Math.exp(-fd*fd)*1.5;
  if(ws.surgeX<state.surge*1.3){const di=Math.abs(xf-ws.surgeX)/ws.surgeW;if(di<1)d*=1+(1-di*di)*ws.surgeAmp}
  return yBase+d*baseAmp;
}
function traceWave(ws,index,count,state,rawT,offset=0){
 const t=index/(count-1),mid=Math.max(0,1-Math.pow((t-.46)*2,2)),margin=Math.max(24,H*.05),yBase=margin+t*(H-margin*2),baseAmp=(10+mid*Math.min(H*.23,150))*state.amp;
 ctx.beginPath();
 for(let i=0;i<=SAMPLES;i++){const xf=i/SAMPLES,x=xf*W,y=waveY(ws,xf,yBase,baseAmp,state,rawT,index,count)+offset;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 return mid;
}
function drawWave(index,count,state,rawT){
 const ws=seeds[index%seeds.length],t=index/(count-1),mid=Math.max(0,1-Math.pow((t-.46)*2,2));
 let lw;if(ws.lw<.32-state.thick*.14)lw=.65+mid*.35;else if(ws.lw<.64)lw=1.0+mid*.7;else if(ws.lw<.86)lw=1.55+mid*.9+state.thick*.55;else lw=2.25+mid*1.15+state.thick*.8;
 traceWave(ws,index,count,state,rawT,0);ctx.lineTo(W,H+6);ctx.lineTo(0,H+6);ctx.closePath();ctx.fillStyle=BG;ctx.fill();
 ctx.strokeStyle=FG;ctx.lineCap='round';ctx.lineJoin='round';
 traceWave(ws,index,count,state,rawT,ws.echo);ctx.globalAlpha=.22;ctx.lineWidth=Math.max(.45,lw*.35);ctx.stroke();
 if(ws.double){traceWave(ws,index,count,state,rawT,ws.echo2);ctx.globalAlpha=.10;ctx.lineWidth=Math.max(.4,lw*.22);ctx.stroke()}
 traceWave(ws,index,count,state,rawT,0);ctx.globalAlpha=.90;ctx.lineWidth=lw;ctx.stroke();ctx.globalAlpha=1;
}
let rawT=0,morphClock=10,last=0,lastDraw=0;
function frame(ts){
 requestAnimationFrame(frame);
 if(ts-lastDraw<33)return;lastDraw=ts;
 if(!last)last=ts;const dt=Math.min((ts-last)/1000,.06);last=ts;rawT+=dt;morphClock+=dt*.72;
 const state=stateAt(morphClock);ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 for(let i=0;i<state.count;i++)drawWave(i,state.count,state,rawT);
 const edge=Math.max(36,H*.06),top=ctx.createLinearGradient(0,0,0,edge);top.addColorStop(0,BG);top.addColorStop(1,'rgba(8,8,8,0)');ctx.fillStyle=top;ctx.fillRect(0,0,W,edge);
 const bottom=ctx.createLinearGradient(0,H-edge,0,H);bottom.addColorStop(0,'rgba(8,8,8,0)');bottom.addColorStop(1,BG);ctx.fillStyle=bottom;ctx.fillRect(0,H-edge,W,edge);
}
requestAnimationFrame(frame);
let timer;function activity(){document.body.classList.add('show-note');clearTimeout(timer);timer=setTimeout(()=>document.body.classList.remove('show-note'),900)}['pointermove','keydown','touchstart'].forEach(e=>addEventListener(e,activity,{passive:true}));
</script>
</body>
</html>
