<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambient Display — John Rice</title>
<meta name="description" content="A quiet ambient resting state for the portfolio display.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#070809;--fg:#f2f2ef;--muted:rgba(242,242,239,.42)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);cursor:none}.ambient{position:fixed;inset:0;background:radial-gradient(circle at 72% 22%,rgba(123,97,255,.07),transparent 34%),var(--bg)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;mix-blend-mode:screen}.content{position:absolute;inset:0;padding:7vh 6vw;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top{display:flex;align-items:flex-start;gap:2.4vw}.time{font-size:clamp(72px,12vw,190px);font-weight:300;letter-spacing:-.055em;line-height:.82}.meta{padding-top:.6vh;font-size:clamp(22px,2.3vw,38px);font-weight:450;line-height:1.25;color:var(--muted)}.temperature{color:var(--fg)}.bottom{display:flex;justify-content:space-between;align-items:flex-end}.identity{font-size:clamp(16px,1.35vw,24px);letter-spacing:.16em;text-transform:uppercase;color:rgba(242,242,239,.28)}.state{font-size:clamp(13px,1vw,18px);letter-spacing:.16em;text-transform:uppercase;color:rgba(242,242,239,.18)}
</style>
</head>
<body>
<div class="ambient">
  <canvas id="life" aria-hidden="true"></canvas>
  <div class="content">
    <div class="top">
      <div class="time" id="time">--:--</div>
      <div class="meta"><div id="period"></div><div class="temperature" id="temperature">Seattle</div></div>
    </div>
    <div class="bottom"><div class="identity">John Rice · Designer · Seattle</div><div class="state">Display resting</div></div>
  </div>
</div>
<script>
const timeEl=document.getElementById('time'),periodEl=document.getElementById('period');
function updateClock(){const d=new Date(),parts=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);timeEl.textContent=(parts.find(p=>p.type==='hour')?.value||'')+':'+(parts.find(p=>p.type==='minute')?.value||'');periodEl.textContent=parts.find(p=>p.type==='dayPeriod')?.value||''}
updateClock();setInterval(updateClock,1000);

const savedTemp=localStorage.getItem('jcr-display-temperature');
if(savedTemp)document.getElementById('temperature').textContent=savedTemp;

const canvas=document.getElementById('life'),ctx=canvas.getContext('2d',{alpha:true});
const WAVE_COUNT=16;
const FRAME_MS=42; // ~24 fps: smoother on the Pi without changing the feel.
const STEP=22;
const PALETTE=[[255,61,126],[255,117,58],[255,199,64],[119,201,92],[56,184,206],[72,126,255],[139,91,255]];
let w,h,particles=[],xPoints=[];
function resize(){
  w=innerWidth;h=innerHeight;
  // Render at CSS pixel resolution. The TV does not benefit visually from a 1.5x canvas,
  // but the extra pixels cost a lot on the Pi GPU/CPU.
  canvas.width=Math.round(w);canvas.height=Math.round(h);ctx.setTransform(1,0,0,1,0,0);
  xPoints=[];for(let x=-STEP;x<=w+STEP;x+=STEP)xPoints.push(x);
  const count=Math.max(14,Math.min(26,Math.round(w/70)));
  particles=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:.7+Math.random()*1.3,vx:(Math.random()-.5)*.065,vy:-.035-Math.random()*.08,p:Math.random()*Math.PI*2,a:.14+Math.random()*.14,c:PALETTE[(Math.random()*PALETTE.length)|0]}));
}
addEventListener('resize',resize,{passive:true});resize();
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(t-last<FRAME_MS)return;
  const dt=Math.min(2.5,(t-last)/16.67||1);last=t;ctx.clearRect(0,0,w,h);

  const top=h*.26,bottom=h*.82,span=bottom-top;
  for(let band=0;band<WAVE_COUNT;band++){
    const n=band/(WAVE_COUNT-1),baseY=top+n*span;
    const color=PALETTE[band%PALETTE.length];
    const phase=t*.00042+band*.36;
    const flex=.68+.50*Math.sin(t*.00022+band*.47);
    const amp=h*(.014+Math.sin(n*Math.PI)*.022)*flex;
    ctx.beginPath();
    for(let i=0;i<xPoints.length;i++){
      const x=xPoints[i];
      const localFlex=1+.48*Math.sin(x*.0032-t*.00031+band*.35);
      const y=baseY+Math.sin(x*.0062+phase)*amp*localFlex+Math.sin(x*.0025-phase*.72+band*.48)*amp*.76;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    const alpha=.66+(band%4)*.05;
    ctx.strokeStyle=`rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    ctx.lineWidth=1.8;ctx.stroke();
  }

  const clearX=w*.34,clearY=h*.22;
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.p+=.0035*dt;
    if(p.y<-8){p.y=h+8;p.x=Math.random()*w}if(p.x<-8)p.x=w+8;if(p.x>w+8)p.x=-8;
    if(p.x<clearX&&p.y<clearY)continue;
    const pulse=.72+Math.sin(p.p)*.28;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.a*pulse})`;ctx.fill();
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
