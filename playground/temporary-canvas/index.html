<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Temporary Canvas</title><meta name="robots" content="noindex">
<style>
:root{--bg:#070809;--fg:#f2f2ef;--muted:rgba(242,242,239,.42)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);cursor:none}.canvas{position:fixed;inset:0;background:radial-gradient(circle at 72% 22%,rgba(123,97,255,.07),transparent 34%),var(--bg);padding:7vh 6vw;display:flex;flex-direction:column;justify-content:space-between}.eyebrow,.state{font-size:clamp(14px,1.1vw,20px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.weather{display:flex;align-items:flex-end;gap:3vw}.temp{font-size:clamp(120px,22vw,330px);font-weight:250;letter-spacing:-.075em;line-height:.72}.details{padding-bottom:1vh}.city{font-size:clamp(42px,5vw,78px);font-weight:650;letter-spacing:-.035em}.condition{margin-top:1vh;font-size:clamp(24px,2.4vw,40px);color:var(--muted)}.bottom{display:flex;justify-content:space-between;align-items:flex-end}.hint{font-size:clamp(16px,1.35vw,24px);color:rgba(242,242,239,.28)}#demo{position:fixed;inset:0;background:#000;display:none}#demo.active{display:block}#demo video{width:100%;height:100%;object-fit:contain;background:#000}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#000;font-size:clamp(20px,2vw,34px)}#loading.hidden{display:none}#atlas-feedback{position:fixed;left:50%;bottom:6vh;z-index:20;transform:translate(-50%,36px);opacity:0;width:min(76vw,1200px);min-height:16vh;padding:3.2vh 5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.20);border-radius:3vh;background:rgba(0,0,0,.90);color:#fff;text-align:center;transition:opacity .18s ease,transform .22s ease;box-shadow:0 16px 50px rgba(0,0,0,.38)}#atlas-feedback.visible{opacity:1;transform:translate(-50%,0)}#atlas-feedback .label{font-size:clamp(54px,7vh,92px);line-height:1;font-weight:800;letter-spacing:.08em;text-transform:uppercase}#atlas-feedback .detail{margin-top:1.4vh;font-size:clamp(30px,3.6vh,52px);line-height:1.1;color:rgba(255,255,255,.72)}
</style></head>
<body>
<main class="canvas" id="weather"><div class="eyebrow">Atlas · Temporary Canvas</div><section class="weather" aria-label="Weather"><div class="temp" id="temp">—°</div><div class="details"><div class="city" id="city">Seattle</div><div class="condition" id="condition">Loading weather…</div></div></section><div class="bottom"><div class="hint">Say “Atlas, done” or “Atlas, cancel”</div><div class="state" id="state">Returning in 30 seconds</div></div></main>
<section id="demo"><video id="video" playsinline></video><div id="loading">Loading demo…</div></section>
<div id="atlas-feedback" role="status" aria-live="polite"><div class="label"></div><div class="detail"></div></div>
<script>
const API='http://127.0.0.1:8765',params=new URLSearchParams(location.search),kind=params.get('kind')||'weather',RETURN_MS=30000;
let feedbackSeq=null,mediaSeq=null,feedbackTimer=null,remaining=RETURN_MS/1000;
const weather=document.getElementById('weather'),demo=document.getElementById('demo'),video=document.getElementById('video'),loading=document.getElementById('loading');
function dismiss(){if(history.length>1)history.back();else location.replace('/?display=1')}
function showFeedback(label,detail='',duration=2100){const el=document.getElementById('atlas-feedback');el.querySelector('.label').textContent=label;const d=el.querySelector('.detail');d.textContent=detail;d.style.display=detail?'':'none';clearTimeout(feedbackTimer);el.classList.add('visible');feedbackTimer=setTimeout(()=>el.classList.remove('visible'),duration)}
async function pollFeedback(){try{const r=await fetch(`${API}/api/feedback?t=${Date.now()}`,{cache:'no-store'}),d=await r.json();if(d.ok){if(feedbackSeq===null)feedbackSeq=d.seq;else if(d.seq>feedbackSeq){feedbackSeq=d.seq;showFeedback(d.label,d.detail||'',d.duration||2100)}}}catch(_){}finally{setTimeout(pollFeedback,180)}}
async function pollMedia(){try{const r=await fetch(`${API}/api/media?t=${Date.now()}`,{cache:'no-store'}),d=await r.json();if(d.ok){if(mediaSeq===null)mediaSeq=d.seq;else if(d.seq>mediaSeq){mediaSeq=d.seq;if(d.action==='duck')video.volume=.18;else if(d.action==='restore')video.volume=.65;else if(d.action==='stop')dismiss()}}}catch(_){}finally{setTimeout(pollMedia,120)}}
async function startWeather(){demo.remove();try{const r=await fetch(`${API}/api/weather-data?t=${Date.now()}`,{cache:'no-store'}),d=await r.json();if(!d.ok)throw new Error(d.message||'Weather unavailable');document.getElementById('temp').textContent=`${d.temperature}°`;document.getElementById('city').textContent=d.city||'Seattle';const extras=[];if(d.high!=null&&d.low!=null)extras.push(`High ${d.high}° · Low ${d.low}°`);if(d.apparent_temperature!=null)extras.push(`Feels like ${d.apparent_temperature}°`);document.getElementById('condition').textContent=[d.condition,...extras].join(' · ')}catch(e){document.getElementById('condition').textContent='Weather unavailable'}const timer=setInterval(()=>{remaining--;document.getElementById('state').textContent=`Returning in ${remaining} second${remaining===1?'':'s'}`;if(remaining<=0){clearInterval(timer);dismiss()}},1000)}
async function startDemo(){weather.remove();demo.classList.add('active');video.volume=.65;video.src='https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov';video.addEventListener('playing',()=>loading.classList.add('hidden'));video.addEventListener('waiting',()=>loading.classList.remove('hidden'));video.addEventListener('ended',dismiss);video.addEventListener('error',()=>{loading.textContent='Unable to play demo'});try{await video.play()}catch(e){loading.textContent='Unable to start demo'}pollMedia()}
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();dismiss()}});pollFeedback();if(kind==='demo')startDemo();else startWeather();
</script></body></html>
