<!doctype html><html lang="en"><head><link rel="icon" href="/assets/common/JCR_sigil.png" type="image/png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock-up Maker — John Rice</title><link rel="stylesheet" href="/assets/common/site-shell.css"><style>
:root{--surface:#151515;--text:#f4f4f2;--muted:#aaa;--rule:rgba(255,255,255,.2);--panel:rgba(28,28,28,.92)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif}body{background:var(--surface);color:var(--text);transition:background .2s,color .2s}.workspace{min-height:100vh;position:relative;padding:32px 32px 42px 250px}.stage{width:100%;min-height:calc(100vh - 74px);display:grid;place-items:center}.stage canvas{display:block;width:min(100%,1600px);height:auto;max-height:calc(100vh - 190px);object-fit:contain}.tool-title{position:absolute;top:28px;left:48px;margin:0;font-size:clamp(1.8rem,2.6vw,3rem);line-height:1;letter-spacing:-.045em;font-weight:600;color:#f1f1ee}.controls{position:absolute;z-index:5;top:92px;left:48px;transform:none;width:175px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:18px;padding:0;border:0;background:transparent;box-shadow:none;color:#aaa}.group{min-width:0}.label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px}.choices{display:flex;flex-direction:column;align-items:stretch;gap:4px}button,.upload{appearance:none;border:1px solid rgba(255,255,255,.12);background:transparent;color:#aaa;border-radius:3px;padding:8px 10px;text-align:left;font:inherit;font-size:11px;line-height:1;cursor:pointer;white-space:nowrap}button.active,.primary{background:rgba(255,255,255,.1);color:#ddd;border-color:rgba(255,255,255,.18)}.upload input{display:none}.upload{display:inline-block}.scale-group{min-width:120px}.scale-group input{width:100%;accent-color:currentColor}.scale-group.hidden{display:none}.actions{display:flex;align-items:center}.dark{--surface:#151515;--text:#f4f4f2;--muted:#aaa;--rule:rgba(255,255,255,.2);--panel:rgba(28,28,28,.92)}.gray{--surface:#d9d9d6;--panel:rgba(235,235,232,.92)}.dark button.active,.dark .primary{background:rgba(255,255,255,.1);color:#ddd;border-color:rgba(255,255,255,.18)}
@media(max-width:900px){.tool-title{top:20px;left:18px}.workspace{padding:250px 18px 28px}.controls{top:16px;left:18px;right:18px;transform:none;width:auto;display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;flex-wrap:wrap;gap:12px}.group{flex:1 1 120px}.actions{flex:0 0 auto}.stage{min-height:calc(100vh - 248px)}.stage canvas{max-height:calc(100vh - 260px)}}
</style></head><body class="dark"><main class="workspace" id="workspace"><h1 class="tool-title">Mock-Up Maker</h1><aside class="controls">
<div class="group"><div class="label">Hardware</div><div class="choices" id="devices"></div></div>
<div class="group"><div class="label">Screen</div><label class="upload">Upload image<input id="file" type="file" accept="image/*"></label></div>
<div class="group"><div class="label">Image fit</div><div class="choices"><button data-fit="cover" class="active">Fill</button><button data-fit="contain">Fit</button></div></div>
<div class="group scale-group"><div class="label">Scale <span id="scaleValue">100%</span></div><input id="scale" type="range" min="50" max="250" value="100" step="1"></div>
<div class="group"><div class="label">Background</div><div class="choices"><button data-bg="white">White</button><button data-bg="gray">Gray</button><button data-bg="dark" class="active">Dark</button></div></div>
<div class="group"><div class="label">Presentation</div><div class="choices"><button id="shadow" class="active">Shadow</button></div></div>
<div class="actions"><button id="export" class="primary">Export PNG</button></div>
</aside><div class="stage" id="stage"><canvas id="c" width="1600" height="1200"></canvas></div></main><script src="/assets/common/site-shell.js"></script><script>document.documentElement.dataset.theme="dark";
const base='https://pub-8150ade24f1a45dfa4e16936ba894a95.r2.dev/mock-up-maker/';
const devices={
Phone:{w:643,h:1200,screen:[82,87,479,1031],radius:44},
Tablet:{w:890,h:1200,screen:[87,87,716,1026],radius:9},
Laptop:{w:1200,h:743,screen:[148,89,904,565],radius:2},
Desktop:{w:1024,h:1200,screen:[43,336,938,528],radius:0},
Monitor:{w:1167,h:1200,screen:[75,300,1017,575],radius:0},
Showcase:{w:1200,h:850,screen:[0,0,1200,850],radius:0}
};
let device='Phone',fit='cover',bg='dark',shadow=true,img=null;
const viewState={};Object.keys(devices).forEach(k=>viewState[k]={scale:1,ox:0,oy:0});
const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),workspace=document.getElementById('workspace');
const frames={};['Phone','Tablet','Laptop','Desktop','Monitor'].forEach(name=>{const image=new Image();image.onload=()=>{frames[name]=image;render()};image.onerror=()=>{console.warn('Could not load hardware frame:',name,image.src);render()};image.src=base+name.toLowerCase()+'.png'});
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
function drawImageCover(im,x,y,w,h,mode){
const ir=im.width/im.height,ratio=w/h,v=viewState[device];let bw,bh;
if(mode==='contain'){if(ir>ratio){bw=w;bh=w/ir}else{bh=h;bw=h*ir}}
else{if(ir>ratio){bh=h;bw=h*ir}else{bw=w;bh=w/ir}}
const dw=bw*v.scale,dh=bh*v.scale;ctx.fillStyle='#111';ctx.fillRect(x,y,w,h);
ctx.drawImage(im,0,0,im.width,im.height,x+(w-dw)/2+v.ox,y+(h-dh)/2+v.oy,dw,dh)
}
function geometry(){
const d=devices[device],scale=Math.min(1120/d.w,970/d.h),w=d.w*scale,h=d.h*scale,x=(c.width-w)/2,y=(c.height-h)/2;
const s=d.screen;return {d,scale,x,y,w,h,sx:x+s[0]*scale,sy:y+s[1]*scale,sw:s[2]*scale,sh:s[3]*scale,sr:d.radius*scale}
}
function drawDevice(name,x,y,w){
const d=devices[name],ratio=w/d.w,h=d.h*ratio,s=d.screen,sx=x+s[0]*ratio,sy=y+s[1]*ratio,sw=s[2]*ratio,sh=s[3]*ratio,sr=d.radius*ratio;
ctx.save();rr(sx,sy,sw,sh,sr);ctx.clip();ctx.fillStyle='#0b0b0b';ctx.fillRect(sx,sy,sw,sh);
if(img){const old=device;device=name;drawImageCover(img,sx,sy,sw,sh,fit);device=old}ctx.restore();
const frame=frames[name];if(frame){ctx.save();if(shadow){ctx.shadowColor='rgba(0,0,0,.38)';ctx.shadowBlur=34;ctx.shadowOffsetY=16}ctx.drawImage(frame,x,y,w,h);ctx.restore()}
}
function renderShowcase(){
const k=.78,ox=170,oy=115;
drawDevice('Desktop',ox+330*k,oy,540*k);
drawDevice('Monitor',ox+735*k,oy+185*k,560*k);
drawDevice('Laptop',ox,oy+445*k,650*k);
drawDevice('Tablet',ox+670*k,oy+390*k,330*k);
drawDevice('Phone',ox+555*k,oy+575*k,170*k);
}
function render(){
ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle=bg==='white'?'#fff':bg==='gray'?'#d9d9d6':'#151515';ctx.fillRect(0,0,c.width,c.height);
if(device==='Showcase'){renderShowcase();return}
const g=geometry();const {sx,sy,sw,sh,sr}=g;
ctx.save();rr(sx,sy,sw,sh,sr);ctx.clip();ctx.fillStyle='#0b0b0b';ctx.fillRect(sx,sy,sw,sh);
if(img)drawImageCover(img,sx,sy,sw,sh,fit);ctx.restore();
const frame=frames[device];
if(frame){ctx.save();if(shadow){ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=42;ctx.shadowOffsetY=18}ctx.drawImage(frame,g.x,g.y,g.w,g.h);ctx.restore()}
}
Object.keys(devices).forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i?'':'active';b.onclick=()=>{device=n;document.querySelectorAll('#devices button').forEach(x=>x.classList.toggle('active',x===b));syncScale();document.querySelector('.scale-group').classList.toggle('hidden',device==='Showcase');render()};document.getElementById('devices').appendChild(b)});
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image;im.onload=()=>{img=im;render();URL.revokeObjectURL(u)};im.src=u};
document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{fit=b.dataset.fit;document.querySelectorAll('[data-fit]').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;document.body.className=bg==='white'?'':bg;document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x===b));render()});
const scaleEl=document.getElementById('scale'),scaleValue=document.getElementById('scaleValue');function syncScale(){scaleEl.value=Math.round(viewState[device].scale*100);scaleValue.textContent=scaleEl.value+'%';document.querySelector('.scale-group').classList.toggle('hidden',device==='Showcase')}scaleEl.oninput=()=>{viewState[device].scale=+scaleEl.value/100;scaleValue.textContent=scaleEl.value+'%';render()};
let dragging=false,lastX=0,lastY=0;c.addEventListener('pointerdown',e=>{if(!img||device==='Showcase')return;const rect=c.getBoundingClientRect(),px=(e.clientX-rect.left)*c.width/rect.width,py=(e.clientY-rect.top)*c.height/rect.height,g=geometry();if(px<g.sx||px>g.sx+g.sw||py<g.sy||py>g.sy+g.sh)return;dragging=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!dragging)return;const rect=c.getBoundingClientRect(),kx=c.width/rect.width,ky=c.height/rect.height;viewState[device].ox+=(e.clientX-lastX)*kx;viewState[device].oy+=(e.clientY-lastY)*ky;lastX=e.clientX;lastY=e.clientY;render()});c.addEventListener('pointerup',()=>dragging=false);c.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('shadow').onclick=e=>{shadow=!shadow;e.currentTarget.classList.toggle('active',shadow);render()};
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.download='hardware-mockup.png';try{a.href=c.toDataURL('image/png');a.click()}catch(err){alert('The mockup displays correctly, but PNG export needs R2 CORS permission for johnrice.com.')}};syncScale();render();
</script></body></html>
