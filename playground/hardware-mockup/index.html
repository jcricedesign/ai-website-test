<!doctype html><html lang="en"><head><link rel="icon" href="/assets/common/JCR_sigil.png" type="image/png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock-up Maker — John Rice</title><link rel="stylesheet" href="/assets/common/site-shell.css"><style>
:root{--surface:#151515;--text:#f4f4f2;--muted:#aaa;--rule:rgba(255,255,255,.2);--panel:rgba(28,28,28,.92)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif}body{background:var(--surface);color:var(--text);transition:background .2s,color .2s}.workspace{min-height:100vh;position:relative;display:grid;place-items:center;padding:150px 32px 42px}.stage{width:min(96vw,1600px);display:grid;place-items:center}.stage canvas{display:block;width:min(100%,1600px);height:auto;max-height:calc(100vh - 190px);object-fit:contain}.controls{position:absolute;z-index:5;top:24px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 32px));display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:18px;padding:13px 16px;border:0;border-radius:0;background:transparent;box-shadow:none}.group{min-width:0}.label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px}.choices{display:flex;flex-wrap:wrap;gap:5px}button,.upload{appearance:none;border:1px solid var(--rule);background:transparent;color:inherit;border-radius:999px;padding:7px 10px;font:inherit;font-size:11px;line-height:1;cursor:pointer;white-space:nowrap}button.active,.primary{background:#111;color:#fff;border-color:#111}.upload input{display:none}.upload{display:inline-block}.actions{display:flex;align-items:center}.dark{--surface:#151515;--text:#f4f4f2;--muted:#aaa;--rule:rgba(255,255,255,.2);--panel:rgba(28,28,28,.92)}.gray{--surface:#d9d9d6;--panel:rgba(235,235,232,.92)}.dark button.active,.dark .primary{background:#f3f3f0;color:#111;border-color:#f3f3f0}
@media(max-width:900px){.workspace{padding-top:245px}.controls{top:16px;align-items:flex-start;justify-content:flex-start;flex-wrap:wrap}.group{flex:1 1 130px}.actions{flex:0 0 auto}.stage canvas{max-height:calc(100vh - 280px)}}
</style></head><body class="dark"><main class="workspace" id="workspace"><aside class="controls">
<div class="group"><div class="label">Hardware</div><div class="choices" id="devices"></div></div>
<div class="group"><div class="label">Screen</div><label class="upload">Upload image<input id="file" type="file" accept="image/*"></label></div>
<div class="group"><div class="label">Image fit</div><div class="choices"><button data-fit="cover" class="active">Fill</button><button data-fit="contain">Fit</button></div></div>
<div class="group"><div class="label">Background</div><div class="choices"><button data-bg="white">White</button><button data-bg="gray">Gray</button><button data-bg="dark" class="active">Dark</button></div></div>
<div class="group"><div class="label">Presentation</div><div class="choices"><button id="shadow" class="active">Shadow</button></div></div>
<div class="actions"><button id="export" class="primary">Export PNG</button></div>
</aside><div class="stage" id="stage"><canvas id="c" width="1600" height="1200"></canvas></div></main><script src="/assets/common/site-shell.js"></script><script>document.documentElement.dataset.theme="dark";
const devices={Phone:{w:420,h:860,r:58,screen:[20,20,380,820,44],kind:'phone'},Tablet:{w:650,h:860,r:42,screen:[18,18,614,824,28],kind:'tablet'},Laptop:{w:900,h:570,r:20,screen:[55,35,790,495,8],kind:'laptop'},Desktop:{w:760,h:700,r:20,screen:[35,28,690,430,4],kind:'desktop'},Monitor:{w:850,h:650,r:14,screen:[30,26,790,445,2],kind:'monitor'},Watch:{w:360,h:430,r:92,screen:[28,32,304,366,72],kind:'watch'}};
let device='Phone',fit='cover',bg='dark',shadow=true,img=null;const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),workspace=document.getElementById('workspace');
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
function drawImageCover(im,x,y,w,h,mode){const ir=im.width/im.height,rr=w/h;let sw,sh,sx,sy;if((mode==='cover'&&ir>rr)||(mode==='contain'&&ir<rr)){sh=im.height;sw=sh*rr;sx=(im.width-sw)/2;sy=0}else{sw=im.width;sh=sw/rr;sx=0;sy=(im.height-sh)/2}if(mode==='contain'){ctx.fillStyle='#111';ctx.fillRect(x,y,w,h);let dw,dh;if(ir>rr){dw=w;dh=w/ir}else{dh=h;dw=h*ir}ctx.drawImage(im,0,0,im.width,im.height,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}else ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
function render(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle=bg==='white'?'#fff':bg==='gray'?'#d9d9d6':'#151515';ctx.fillRect(0,0,c.width,c.height);const d=devices[device],scale=Math.min(1050/d.w,850/d.h),w=d.w*scale,h=d.h*scale,x=(c.width-w)/2,y=(c.height-h)/2;ctx.save();if(shadow){ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=45;ctx.shadowOffsetY=22}rr(x,y,w,h,d.r*scale);ctx.fillStyle=device==='Watch'?'#303034':'#b8b8b8';ctx.fill();ctx.restore();ctx.save();rr(x,y,w,h,d.r*scale);ctx.clip();const s=d.screen.map(v=>v*scale),sx=x+s[0],sy=y+s[1],sw=s[2],sh=s[3],sr=s[4];ctx.save();rr(sx,sy,sw,sh,sr);ctx.clip();ctx.fillStyle='#0a0a0a';ctx.fillRect(sx,sy,sw,sh);if(img)drawImageCover(img,sx,sy,sw,sh,fit);else{ctx.fillStyle='#2b2b2b';ctx.font='24px Helvetica Neue, Arial';ctx.textAlign='center';ctx.fillText('Upload a screen',sx+sw/2,sy+sh/2)}ctx.restore();ctx.restore();
ctx.save();ctx.strokeStyle=device==='Watch'?'#555':'#777';ctx.lineWidth=2*scale;rr(x,y,w,h,d.r*scale);ctx.stroke();if(device==='Phone'){ctx.fillStyle='#050505';ctx.beginPath();ctx.roundRect(x+w*.34,y+10*scale,w*.32,28*scale,14*scale);ctx.fill()}if(device==='Laptop'){ctx.fillStyle='#a9a9a9';ctx.beginPath();ctx.moveTo(x-60*scale,y+h);ctx.lineTo(x+w+60*scale,y+h);ctx.lineTo(x+w+105*scale,y+h+35*scale);ctx.lineTo(x-105*scale,y+h+35*scale);ctx.closePath();ctx.fill()}if(device==='Desktop'||device==='Monitor'){ctx.fillStyle='#aaa';ctx.fillRect(x+w*.47,y+h,w*.06,100*scale);ctx.beginPath();ctx.roundRect(x+w*.32,y+h+90*scale,w*.36,22*scale,10*scale);ctx.fill()}ctx.restore()}
Object.keys(devices).forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i?'':'active';b.onclick=()=>{device=n;document.querySelectorAll('#devices button').forEach(x=>x.classList.toggle('active',x===b));render()};document.getElementById('devices').appendChild(b)});
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image;im.onload=()=>{img=im;render();URL.revokeObjectURL(u)};im.src=u};
document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{fit=b.dataset.fit;document.querySelectorAll('[data-fit]').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;document.body.className=bg==='white'?'':bg;document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('shadow').onclick=e=>{shadow=!shadow;e.currentTarget.classList.toggle('active',shadow);render()};
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.download='hardware-mockup.png';a.href=c.toDataURL('image/png');a.click()};render();
</script></body></html>
