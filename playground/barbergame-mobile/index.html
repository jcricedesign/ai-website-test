<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbergame Mobile Prototype</title></head><body style="margin:0;background:#050505"><iframe id="app" src="./app.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,w=f.contentWindow;const s=d.createElement('style');s.textContent=`.scorepill{display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:10px;padding:6px 10px;border:1px solid #3b3b3b;border-radius:999px;background:#191919;font-size:14px;transition:.28s}.scorepill.pop{transform:scale(1.22);border-color:#9c35ff;box-shadow:0 0 22px #922be866}.scorepill .star{color:#a742ff}.rewards-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.reward-card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;min-height:112px;padding:14px;margin-bottom:10px;background:linear-gradient(145deg,#1b1b1b,#151515);border:1px solid #303030;border-radius:15px;transition:.25s}.reward-card.claimed{opacity:.45;transform:scale(.985)}.reward-avatar{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#555,#222);display:grid;place-items:center;font-weight:800}.reward-name{font-weight:750;font-size:15px}.reward-meta{font-size:12px;color:#aaa;line-height:1.5}.reward-side{text-align:right}.reward-pts{color:#ae55ff;font-size:16px;font-weight:800;margin-bottom:8px}.claimbtn{border:0;background:#8e2fff;color:#fff;border-radius:9px;padding:10px 14px;font-weight:750}.claimbtn:active{transform:scale(.96)}`;d.head.appendChild(s);const top=d.querySelector('.top');const av=top.querySelector('.avatar');const score=d.createElement('div');score.className='scorepill';score.innerHTML='<span class="star">★</span><b id="scoreNum">320</b>';top.insertBefore(score,av);const home=d.getElementById('home');const old=[...home.querySelectorAll('.card')];if(old[2])old[2].remove();const title=d.createElement('div');title.className='rewards-title';title.innerHTML='<h2>Completed haircuts</h2><span class="muted" id="pending">5 to claim</span>';const clients=[['Marcus','9:00–9:45am','Haircut · $32','Regular'],['Jalen','10:00–10:30am','Haircut · $28','New'],['David','10:45–11:15am','Haircut · $32','Regular'],['Chris','11:30–12:00pm','Haircut · $32','Regular'],['Anthony','12:15–12:45pm','Haircut · $30','Returning']];const wrap=d.createElement('div');clients.forEach((c,i)=>{const el=d.createElement('div');el.className='reward-card';el.innerHTML=`<div class="reward-avatar">${c[0][0]}</div><div><div class="reward-name">${c[0]}</div><div class="reward-meta">${c[1]}<br>${c[2]} · ${c[3]}</div></div><div class="reward-side"><div class="reward-pts">+10</div><button class="claimbtn">Claim</button></div>`;el.querySelector('button').onclick=()=>{if(el.classList.contains('claimed'))return;el.classList.add('claimed');el.querySelector('.reward-side').innerHTML='<div class="reward-pts">✓ +10</div><div class="reward-meta">Claimed</div>';let n=+score.querySelector('b').textContent+10;score.querySelector('b').textContent=n;score.classList.remove('pop');void score.offsetWidth;score.classList.add('pop');setTimeout(()=>score.classList.remove('pop'),360);let left=d.querySelectorAll('.reward-card:not(.claimed)').length;d.getElementById('pending').textContent=left?left+' to claim':'All claimed';};wrap.appendChild(el)});const review=[...home.querySelectorAll('.card')].find(x=>x.textContent.includes('great review'));home.insertBefore(title,review||null);home.insertBefore(wrap,review||null);};</script></body></html>
