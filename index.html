<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <script>
    (() => {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --text: #111111;
      --muted: #5d5d5a;
      --button-bg: rgba(0, 0, 0, 0.045);
      --button-border: rgba(0, 0, 0, 0.09);
      --button-hover: rgba(0, 0, 0, 0.08);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111111;
      --text: #f5f5f2;
      --muted: #a8a8a3;
      --button-bg: rgba(255, 255, 255, 0.06);
      --button-border: rgba(255, 255, 255, 0.12);
      --button-hover: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background-color 180ms ease, color 180ms ease;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      margin: 0 0 1rem;
      letter-spacing: -0.045em;
    }

    p {
      font-size: 1.1rem;
      margin: 0;
      color: var(--muted);
    }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--text);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .theme-toggle:hover {
      background: var(--button-hover);
    }

    .theme-toggle:active {
      transform: scale(0.96);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sun,
    :root[data-theme="light"] .moon {
      display: none;
    }

    :root[data-theme="light"] .sun,
    :root[data-theme="dark"] .moon {
      display: block;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3.5"></circle>
      <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"></path>
    </svg>
  </button>

  <main>
    <h1>Hello, world.</h1>
    <p>This page was published through an AI-assisted GitHub workflow.</p>
  </main>

  <script>
    const toggle = document.getElementById('themeToggle');

    toggle.addEventListener('click', () => {
      const current = document.documentElement.dataset.theme;
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
