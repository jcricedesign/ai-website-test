:root{--bg:#f7f7f5;--text:#111;--muted:#666663;--faint:#989894;--rule:rgba(0,0,0,.14);--soft:rgba(0,0,0,.045);--media:#fff;color-scheme:light}:root[data-theme=dark]{--bg:#111;--text:#f5f5f2;--muted:#aaa9a4;--faint:#777772;--rule:rgba(255,255,255,.15);--soft:rgba(255,255,255,.06);--media:#171717;color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .18s,color .18s}.page{width:min(1240px,calc(100% - 96px));margin:auto}.hero{max-width:1180px;padding:110px 0}.hero h1{margin:0;max-width:1120px;font-size:clamp(3.2rem,6.3vw,6.7rem);line-height:.98;letter-spacing:-.035em;font-weight:650;text-wrap:balance}.intro{max-width:760px;margin:34px 0 0;font-size:clamp(1.2rem,1.8vw,1.5rem);line-height:1.5;color:var(--muted)}.project-module{position:relative;border-top:1px solid var(--rule);padding:28px 0 140px}.project-controls{position:absolute;top:20px;right:0;z-index:5;display:flex;gap:4px}.project-control{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--faint);cursor:pointer;font-size:18px}.project-control:hover{color:var(--text);background:var(--soft)}.project-control:focus-visible{outline:2px solid currentColor;outline-offset:3px;color:var(--text);background:var(--soft)}.project-editorial{display:grid;grid-template-columns:minmax(230px,.68fr) minmax(0,1.55fr);gap:64px;align-items:start;padding-top:38px}.project-story{position:sticky;top:28px;min-height:340px;padding-right:8px}.project-count{margin:0 0 16px;font-size:.72rem;color:var(--faint);letter-spacing:.08em}.project-story h2{margin:0 0 18px;max-width:390px;font-size:clamp(1.65rem,2.35vw,2.35rem);line-height:1.08;letter-spacing:-.03em;font-weight:650}.project-story p{margin:0;max-width:390px;font-size:.95rem;line-height:1.62;color:var(--muted)}.project-meta{margin-top:20px;font-size:.72rem;color:var(--faint)}.project-stream{display:grid;gap:34px;justify-items:start}.project-media{width:80%;margin:0;opacity:0;transform:translateY(34px);transition:opacity .65s ease,transform 1.05s cubic-bezier(.18,.88,.22,1.08)}.project-media.visible{opacity:1;transform:none}.project-frame{display:grid;place-items:center;width:100%;min-height:208px;overflow:hidden;background:var(--media)}.project-frame.transparent-media{background:transparent}.project-frame img{display:block;width:100%;height:auto}.project-caption{display:flex;justify-content:space-between;gap:16px;padding-top:9px;font-size:.72rem;color:var(--faint)}.project-module:fullscreen{overflow:auto;background:var(--bg);padding:42px 64px 80px}.project-module:fullscreen .project-editorial{max-width:1500px;margin:auto;grid-template-columns:minmax(280px,.72fr) minmax(0,1.75fr);gap:76px}.project-module:fullscreen .project-controls{top:22px;right:24px}.project-module:fullscreen .project-frame img{max-height:78vh;object-fit:contain}@media(max-width:850px){.page{width:min(100% - 36px,1240px)}.hero{padding:72px 0 54px}.hero h1{font-size:clamp(2.75rem,12.6vw,4.5rem)}.project-module{padding-top:22px;padding-bottom:90px}.project-controls{top:14px}.project-editorial{grid-template-columns:1fr;gap:30px;padding-top:30px}.project-story{position:relative;top:auto;min-height:0;padding-right:44px}.project-media{width:100%}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project-media{opacity:1!important;transform:none!important;transition:none!important}}
