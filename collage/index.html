<!doctype html><html lang="en"><head>
<link rel="icon" href="/assets/common/JCR_sigil.png" type="image/png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Gallery — John Rice</title><script>(()=>{const s=localStorage.getItem('theme'),d=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=s||(d?'dark':'light')})();</script><link rel="stylesheet" href="/ai-website-test/assets/common/site-shell.css"><style>:root{--bg:#f7f7f5;--text:#111;--muted:#6a6a66;--faint:#979792;--rule:rgba(0,0,0,.14);--grid:#111;--cream:#f1eee5;--red:#d6251f;--blue:#155ba5;--yellow:#f0d23b;--black:#111}:root[data-theme=dark]{--bg:#111;--text:#f5f5f2;--muted:#aaa9a4;--faint:#777772;--rule:rgba(255,255,255,.15);--grid:#050505}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.page{width:min(1240px,calc(100% - 96px));margin:auto}.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:70px;padding:92px 0 60px}.intro h1{margin:0;font-size:clamp(3.5rem,7vw,7.4rem);line-height:.92;letter-spacing:-.05em;font-weight:650}.intro p{align-self:end;margin:0;max-width:460px;font-size:1.05rem;line-height:1.6;color:var(--muted)}.mondrian-wrap{padding-bottom:130px}.mondrian{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,62px);gap:10px;background:var(--grid);padding:10px;min-height:760px;overflow:hidden}.tile{position:relative;background:var(--cream);cursor:pointer;transition:filter .18s ease,transform .18s ease}.tile:hover,.tile:focus-visible{filter:brightness(1.08);transform:scale(.985);outline:none}.tile::after{content:attr(data-index);position:absolute;right:8px;bottom:6px;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.58);mix-blend-mode:difference}.red{background:var(--red)}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.black{background:var(--black)}.cream{background:var(--cream)}.t1{grid-column:1/4;grid-row:1/4}.t2{grid-column:4/8;grid-row:1/3}.t3{grid-column:8/10;grid-row:1/5}.t4{grid-column:10/13;grid-row:1/4}.t5{grid-column:1/3;grid-row:4/8}.t6{grid-column:3/6;grid-row:3/7}.t7{grid-column:6/8;grid-row:3/5}.t8{grid-column:6/10;grid-row:5/8}.t9{grid-column:10/13;grid-row:4/7}.t10{grid-column:1/5;grid-row:8/11}.t11{grid-column:5/7;grid-row:7/10}.t12{grid-column:7/11;grid-row:8/12}.t13{grid-column:11/13;grid-row:7/10}.t14{grid-column:1/3;grid-row:11/13}.t15{grid-column:3/7;grid-row:10/13}.t16{grid-column:7/9;grid-row:12/13}.t17{grid-column:9/11;grid-row:12/13}.t18{grid-column:11/13;grid-row:10/13}.viewer{position:fixed;inset:0;z-index:1000;display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;pointer-events:none;background:color-mix(in srgb,var(--bg) 92%,rgba(0,0,0,.08));backdrop-filter:blur(8px);transition:.28s}.viewer.open{opacity:1;visibility:visible;pointer-events:auto}.viewer-head,.viewer-foot{width:min(1180px,calc(100% - 64px));margin:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}.viewer-head{padding:24px 0 16px}.viewer-foot{padding:12px 0 20px;font-size:.74rem}.viewer-close{border:0;background:transparent;color:var(--text);cursor:pointer}.viewer-stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.viewer-track{position:relative;display:flex;align-items:center;gap:28px;will-change:transform;transition:transform .62s cubic-bezier(.18,.82,.2,1)}.viewer-item{z-index:1;flex:0 0 auto;display:grid;place-items:center;height:min(90vh,900px);max-height:calc(100vh - 132px);width:min(68vw,900px);opacity:.34;transform:scale(.82);transition:opacity .35s ease,transform .55s ease}.viewer-item.active{z-index:4;opacity:1;transform:scale(1)}.viewer-item.prev,.viewer-item.next{opacity:.52}.viewer-panel{position:relative;width:min(100%,860px);height:100%;max-height:calc(100vh - 150px);background:var(--cream)}.viewer-panel::after{content:attr(data-index);position:absolute;right:16px;bottom:12px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.62);mix-blend-mode:difference}.viewer-item[data-color=red] .viewer-panel{background:var(--red)}.viewer-item[data-color=blue] .viewer-panel{background:var(--blue)}.viewer-item[data-color=yellow] .viewer-panel{background:var(--yellow)}.viewer-item[data-color=black] .viewer-panel{background:var(--black)}.viewer-item[data-color=cream] .viewer-panel{background:var(--cream)}body.viewer-open{overflow:hidden}@media(max-width:850px){.page{width:calc(100% - 36px)}.intro{grid-template-columns:1fr;gap:24px;padding:68px 0 44px}.mondrian{grid-template-rows:repeat(12,42px);gap:7px;padding:7px;min-height:0}.viewer{display:none}}</style></head><body><main class="page"><section class="intro"><h1 data-jcr-atari>Objects in a grid.</h1><p>Click any rectangle to open it as a focused preview. The selected item takes over the center while its neighbors remain visible at the edges.</p></section><section class="mondrian-wrap"><div class="mondrian" id="mondrian"><div class="tile red t1" tabindex="0" data-index="01" data-color="red"></div><div class="tile cream t2" tabindex="0" data-index="02" data-color="cream"></div><div class="tile yellow t3" tabindex="0" data-index="03" data-color="yellow"></div><div class="tile blue t4" tabindex="0" data-index="04" data-color="blue"></div><div class="tile cream t5" tabindex="0" data-index="05" data-color="cream"></div><div class="tile red t6" tabindex="0" data-index="06" data-color="red"></div><div class="tile black t7" tabindex="0" data-index="07" data-color="black"></div><div class="tile cream t8" tabindex="0" data-index="08" data-color="cream"></div><div class="tile yellow t9" tabindex="0" data-index="09" data-color="yellow"></div><div class="tile blue t10" tabindex="0" data-index="10" data-color="blue"></div><div class="tile cream t11" tabindex="0" data-index="11" data-color="cream"></div><div class="tile red t12" tabindex="0" data-index="12" data-color="red"></div><div class="tile cream t13" tabindex="0" data-index="13" data-color="cream"></div><div class="tile black t14" tabindex="0" data-index="14" data-color="black"></div><div class="tile yellow t15" tabindex="0" data-index="15" data-color="yellow"></div><div class="tile blue t16" tabindex="0" data-index="16" data-color="blue"></div><div class="tile cream t17" tabindex="0" data-index="17" data-color="cream"></div><div class="tile red t18" tabindex="0" data-index="18" data-color="red"></div></div></section></main><div class="viewer" id="viewer" aria-hidden="true"><div class="viewer-head"><div id="viewerHeadline">Item 01</div><button class="viewer-close" id="viewerClose">Esc / Close</button></div><div class="viewer-stage" id="viewerStage"><div class="viewer-track" id="viewerTrack"></div></div><div class="viewer-foot"><div id="viewerTitle">Untitled content</div><div>← → navigate</div></div></div><script>const tiles=[...document.querySelectorAll('.tile')],viewer=document.getElementById('viewer'),track=document.getElementById('viewerTrack'),stage=document.getElementById('viewerStage'),headline=document.getElementById('viewerHeadline'),title=document.getElementById('viewerTitle');let current=0;const items=tiles.map((t,i)=>({label:`Item ${String(i+1).padStart(2,'0')}`,title:`Content ${String(i+1).padStart(2,'0')}`,color:t.dataset.color}));items.forEach((item,i)=>{const n=document.createElement('div');n.className='viewer-item';n.dataset.color=item.color;n.innerHTML=`<div class="viewer-panel" data-index="${String(i+1).padStart(2,'0')}"></div>`;track.appendChild(n)});const els=[...track.children];function layout(){els.forEach((e,i)=>{e.classList.toggle('active',i===current);e.classList.toggle('prev',i===current-1);e.classList.toggle('next',i===current+1)});const a=els[current],center=a.offsetLeft+a.offsetWidth/2;track.style.transform=`translate3d(${stage.clientWidth/2-center}px,0,0)`;headline.textContent=items[current].label;title.textContent=items[current].title}function open(i){current=i;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.classList.add('viewer-open');requestAnimationFrame(()=>requestAnimationFrame(layout))}function close(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.classList.remove('viewer-open')}function move(d){const n=current+d;if(n<0||n>=items.length)return;current=n;layout()}tiles.forEach((t,i)=>{t.onclick=()=>open(i);t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i)}}});document.getElementById('viewerClose').onclick=close;viewer.onclick=e=>{if(e.target===viewer||e.target===stage)close()};document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});window.addEventListener('resize',()=>viewer.classList.contains('open')&&layout())</script><script src="/ai-website-test/assets/common/site-shell.js"></script></body></html>
