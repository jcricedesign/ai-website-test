isplay:flex;gap:6px;margin:15px 0}.seg button{background:#252528;border:1px solid var(--line);padding:10px 13px;min-height:44px;border-radius:22px;font-size:12px}.seg button.selected{background:#35553e;color:#e4ffeb}.note{background:#1c3023;border-radius:9px;padding:13px;font-size:12px;color:#b9ddc1;margin:16px 0}.notice{background:#342819;color:#f3c783}.workflow{display:grid;gap:0;margin:20px 0}.step{display:flex;gap:10px;padding:10px 0;color:var(--muted);font-size:13px}.step em{display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:24px;height:24px;flex-shrink:0;font-style:normal;font-size:11px}.step.complete em{background:#203f2a;color:var(--green);border-color:#42664b}.step.current{font-weight:bold;color:var(--ink)}.step.current em{background:#83d6a3;color:#102419;border-color:#2d523a}.empty{padding:18px 0;color:var(--green)}footer{border-top:1px solid var(--line);padding:18px 22px 30px;text-align:center;font-size:11px;color:var(--muted)}footer a{color:inherit}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;background:#c0f0cf;color:#102419;border-radius:10px;padding:12px 18px;font-size:12px;max-width:90%;width:max-content;box-shadow:0 3px 20px #0002}#toast:empty{display:none}@media(min-width:650px){.app{margin:26px auto;border-radius:28px;overflow:clip;box-shadow:0 15px 60px #0001}h1{font-size:42px}}

html[data-embed] body{background:#000}html[data-embed] .app{margin:0;border:0;border-radius:0;box-shadow:none;min-height:100dvh}html[data-embed] footer,html[data-embed] .project-link{display:none}[hidden]{display:none!important}header small{white-space:nowrap}</style><script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.dataset.embed="1";</script></head><body><div class="app"><header><small>Owner View</small><img src="/barber-game/chop-it-up/redesign/ChopItUp-Logo.png" alt="Chop It Up Barbershops"><button data-go="account" aria-label="Owner account">MR</button></header><div id="trail" class="trail"></div><main id="main"></main><footer><a href="../">Compare Owner mode concepts</a> · Sample data only.<br><button id="reset" class="link" type="button">Reset demo</button> · Changes stay in this browser.</footer></div><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s),KEY='ciu-owner-hub-v1';
const initial={scope:'all',rent:{paid:false,active:false,method:'Cash',rate:275,rateDraft:null},message:{subject:'Saturday opening hours',body:'We’re opening at 9 AM this Saturday. Please check your availability before the end of the day.',to:'All shops',stage:'draft'},sent:[],peopleQuery:'',peopleFilter:'all',period:'Today'};
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||state.version!==1)state={...structuredClone(initial),version:1};
const shops=[{name:'Kirkland',earnings:1115,expected:1050,goal:1400,bookings:12},{name:'Bothell',earnings:1280,expected:1270,goal:1600,bookings:14},{name:'Bellevue',earnings:1640,expected:1510,goal:1900,bookings:17},{name:'Everett',earnings:980,expected:1010,goal:1300,bookings:10}];
const people=[{id:'alex',name:'Alex Morgan',shop:'Kirkland'},{id:'sam',name:'Sam Taylor',shop:'Kirkland'},{id:'riley',name:'Riley James',shop:'Bothell'},{id:'jordan',name:'Jordan Lee',shop:'Bellevue'},{id:'casey',name:'Casey Reed',shop:'Everett'}];
let route={view:'hub',arg:null,scroll:0},stack=[];if(history.state?.ownerHub){route=history.state.route;stack=history.state.stack}history.scrollRestoration='manual';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Math.round(n).toLocaleString('en-US');const active=p=>p.id!=='alex'||state.rent.active;const initials=n=>n.split(' ').map(x=>x[0]).join('');
const selected=()=>shops.filter(s=>state.scope==='all'||s.name===state.scope);const scopedPeople=()=>people.filter(p=>state.scope==='all'||p.shop===state.scope);const scopedRent=()=>state.scope==='all'||state.scope==='Kirkland';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('Changes kept for this visit only')}}
function snapshot(){route.scroll=window.scrollY;$('#trail').hidden=route.view==='hub';history.replaceState({ownerHub:true,route,stack},'');if(window.parent!==window)window.parent.postMessage({type:'owner-viewer:state',view:route.view},location.origin)}
function go(view,arg=null){snapshot();stack.push({...route});route={view,arg,scroll:0};history.pushState({ownerHub:true,route,stack},'');render();window.scrollTo(0,0);$('#main h1')?.focus({preventScroll:true})}
function back(){if(document.documentElement.dataset.embed&&stack.length){route=stack.pop();render();requestAnimationFrame(()=>window.scrollTo(0,route.scroll||0));return}if(stack.length)history.back();else{route={view:'hub',arg:null,scroll:0};render();window.scrollTo(0,0)}}
window.addEventListener('popstate',e=>{if(e.state?.ownerHub){route=e.state.route;stack=e.state.stack;render();requestAnimationFrame(()=>window.scrollTo(0,route.scroll||0))}});window.addEventListener('pagehide',snapshot);
function notify(t){$('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',2500)}
function title(k,h,p=''){return `<p class="eyebrow">${k}</p><h1 tabindex="-1">${h}</h1>${p?`<p class="intro">${p}</p>`:''}`}
function scope(){return `<label class="small muted" for="scope">Viewing</label><select class="scope" id="scope"><option value="all">All shops · Chop It Up</option>${shops.map(s=>`<option ${state.scope===s.name?'selected':''}>${s.name}</option>`).join('')}</select>`}
function row(label,sub,view,arg='',right=''){return `<button class="row" data-go="${view}" data-arg="${esc(arg)}"><span class="grow"><strong>${label}</strong>${sub?`<small>${sub}</small>`:''}</span>${right?`<strong>${right}</strong>`:''}<span class="arrow">›</span></button>`}
function personRow(p){return `<button class="row" data-go="person" data-arg="${p.id}"><span class="avatar">${initials(p.name)}</span><span class="grow"><strong>${p.name}</strong><small>${p.shop}</small></span><span class="badge ${active(p)?'':'red'}">${active(p)?'Active':'Inactive'}</span><span class="arrow">›</span></button>`}
function steps(done,total,label){return `<div class="steps">${Array.from({length:total},(_,i)=>`<i class="${i<done?'done':''}"></i>`).join('')}<strong>${label}</strong></div>`}
function rentTask(){const r=state.rent;return `<button class="task ${r.paid?'progress':'urgent'}" data-go="rent"><div class="split"><span class="badge ${r.paid?'amber':'red'}">${r.paid?'In progress':'Needs attention'}</span><span class="small muted">Kirkland</span></div><h3>${r.paid?'Payment recorded. Finish the Re-Up.':'Alex needs a Re-Up'}</h3><p>${r.paid?'Access is still inactive. Resume where you left off.':money(r.rate)+' outstanding · Account inactive'}</p>${steps(r.paid?1:0,2,r.paid?'Step 2 of 2 · Resume →':'Step 1 of 2 · Review →')}</button>`}
function hub(){const ss=selected(),sum=ss.reduce((a,s)=>a+s.earnings,0),book=ss.reduce((a,s)=>a+s.bookings,0);let rent=ss.length*300+(scopedRent()&&state.rent.paid?state.rent.rate:0);const pending=scopedRent()&&!state.rent.active;return title('Today · Friday, October 2',"Shop’s Dashboard",state.scope==='all'?'Your shops, your people, and what needs you.':state.scope+' at a glance.')+scope()+`<div class="section-head attention-heading"><h2>Needs your attention</h2><span>${pending?'1 action':'All clear'}</span></div>${pending?rentTask():'<div class="card empty">✓ No outstanding actions in this view.</div>'}${state.rent.active&&scopedRent()?`<button class="row" data-go="rent"><span class="grow"><strong>✓ Alex’s Re-Up completed</strong><small>Payment recorded · Account active</small></span><span class="arrow">›</span></button>`:''}<div class="section-head"><h2>Today at a glance</h2><span>Tap to explore</span></div><div class="metrics"><button class="metric" data-go="earnings"><div class="tile-icon" aria-hidden="true"><svg viewBox="0 0 22 22"><path d="M4 16V9m6 7V5m6 11V2M2 20h18"/></svg></div><small>Service earnings</small><strong>${money(sum)}</strong><span>Today · Barbers</span></button><button class="metric" data-go="schedule"><div class="tile-icon" aria-hidden="true"><svg viewBox="0 0 22 22"><rect x="3" y="5" width="16" height="15" rx="2"/><path d="M7 2v6m8-6v6M3 11h16"/></svg></div><small>Bookings</small><strong>${book}</strong><span>Today</span></button><button class="metric" data-go="boothrent"><div class="tile-icon" aria-hidden="true"><svg viewBox="0 0 22 22"><path d="M3 8 11 2l8 6v12H3zM8 20v-7h6v7"/></svg></div><small>Boothrent</small><strong>${money(rent)}</strong><span>Sep 21–27 · Paid</span></button><button class="metric" data-go="messages"><div class="tile-icon" aria-hidden="true"><svg viewBox="0 0 22 22"><path d="M3 3h16v12H9l-6 5zM7 7h8M7 11h5"/></svg></div><small>Messages</small><strong>${state.message.stage!=='sent'?'1':state.sent.length}</strong><span>${state.message.stage!=='sent'?'Draft to finish':'Sent in this demo'}</span></button></div>${state.message.stage!=='sent'||state.rent.rateDraft!==null?'<div class="section-head"><h2>Continue when ready</h2><span>Progress saved</span></div>':''}${state.message.stage!=='sent'?`<button class="task draft" data-go="compose"><div class="split"><h3>Shop announcement</h3><span class="badge">${state.message.stage==='review'?'Ready to review':'Draft saved'}</span></div><p>${esc(state.message.subject||'Untitled announcement')} · ${esc(state.message.to)}</p>${steps(state.message.stage==='review'?1:0,2,'Continue →')}</button>`:''}${state.rent.rateDraft!==null?`<button class="task progress" data-go="rate"><h3>Rental rate change</h3><p>Alex Morgan · ${money(state.rent.rateDraft)} per week · Not applied</p><span class="badge amber">Draft saved · Continue →</span></button>`:''}<div class="section-head"><h2>${ss.length===1?state.scope+' today':'Across your shops'}</h2><span>Service earnings</span></div><div class="card">${ss.map(s=>`<button class="row" data-go="shop" data-arg="${s.name}"><span class="dot"></span><span class="grow"><strong>${s.name}</strong><small>${people.filter(p=>p.shop===s.name&&active(p)).length} working · ${s.earnings>=s.expected?'On pace':'Slightly behind'}</small></span><span><strong>${money(s.earnings)}</strong><small style="color:${s.earnings>=s.expected?'var(--green)':'var(--warm)'};text-align:right">${Math.round((s.earnings/s.expected-1)*100)>0?'+':''}${Math.round((s.earnings/s.expected-1)*100)}%</small></span><span class="arrow">›</span></button>`).join('')}</div><div class="card people-card"><h2>${scopedPeople().filter(active).length} working barbers</h2><p class="small muted">Active today</p><div style="display:flex;gap:7px">${scopedPeople().filter(active).map(p=>`<button class="avatar" style="border:0" data-go="person" data-arg="${p.id}" aria-label="${p.name}">${initials(p.name)}</button>`).join('')}</div><button class="link" data-go="people">View people & accounts →</button></div><div class="card"><h2>Manage</h2>${row('People & accounts','Find active and inactive barbers','people')}${row('Boothrent','Payments, rates, and Re-Ups','boothrent')}${row('Messages',state.message.stage==='sent'?'1 sample announcement sent':'1 announcement in progress','messages')}${row('Earnings reports','Shop and barber breakdowns','earnings')}</div>`}
function workflow(){let n=state.rent.active?2:state.rent.paid?1:0;return `<div class="workflow">${['Record payment','Reactivate account'].map((s,i)=>`<div class="step ${i<n?'complete':i===n?'current':''}"><em>${i<n?'✓':i+1}</em><div>${s}<div class="small muted">${i===0?(state.rent.paid?'Recorded via '+state.rent.method:'Cash or Zelle received'):(state.rent.active?'Account active':state.rent.paid?'Payment received · Ready to reactivate':'Payment must be recorded first')}</div></div></div>`).join('')}</div>`}
function rentView(){let r=state.rent;return title('Kirkland · Boothrent','Alex’s Re-Up','You can leave at any step and pick up here later.')+`<span class="badge ${r.active?'':r.paid?'amber':'red'}">${r.active?'Completed':r.paid?'In progress · Step 2 of 2':'Needs attention · Step 1 of 2'}</span>`+workflow()+`<div class="card"><h2>Sep 21–27</h2><div class="detail"><span>Applied rental rate</span><strong>${money(r.rate)}</strong></div><div class="detail"><span>Shop standard</span><strong>$300</strong></div><div class="detail"><span>Payment</span><strong>${r.paid?'Paid · '+r.method:'Outstanding'}</strong></div><div class="detail"><span>Account</span><strong>${r.active?'Active':'Inactive'}</strong></div>${r.nextRate?`<div class="detail"><span>Next week’s rate</span><strong>${money(r.nextRate)}</strong></div>`:''}</div>${!r.paid?`<label class="field">Payment received via<select id="method"><option ${r.method==='Cash'?'selected':''}>Cash</option><option ${r.method==='Zelle'?'selected':''}>Zelle</option></select></label><button class="btn" data-pay>Mark ${money(r.rate)} paid</button><p class="small muted" style="margin-top:12px">Records a payment already received. No money is transferred.</p>`:!r.active?`<div class="note notice">Payment is recorded. Alex’s account is still inactive until you finish the Re-Up.</div><button class="btn" data-reup>Re-Up · Reactivate Alex</button>`:`<div class="note">✓ Alex is paid up and active again. This task is complete.</div><button class="btn" data-back>Done · Return to ${stack.at(-1)?.view==='hub'?'dashboard':'previous view'}</button>`}<button class="link" data-go="rate">${r.rateDraft!==null?'Continue rental rate change':'Edit weekly rental rate'} →</button>`}
function shopView(){const s=shops.find(s=>s.name===route.arg)||shops[0];return title('Shop detail',s.name,'Today · Friday, October 2')+`<div class="card"><div class="split"><h2>${s.name} today</h2><span class="badge">${Math.round((s.earnings/s.expected-1)*100)}% vs expected</span></div><p class="small muted">Barber service earnings · Pace vs expected</p><div class="mini-grid"><div class="mini"><span>Earned so far</span><strong>${money(s.earnings)}</strong></div><div class="mini"><span>Expected by now</span><strong>${money(s.expected)}</strong></div></div><div class="bar"><b style="width:${Math.min(100,s.earnings/s.goal*100)}%"></b></div><div class="split small muted"><span>${money(s.earnings)} so far</span><span>${money(s.goal)} daily goal</span></div><button class="link" data-go="earnings" data-arg="${s.name}">Explore earnings →</button></div>${s.name==='Kirkland'&&!state.rent.active?rentTask():''}<div class="card"><h2>People at ${s.name}</h2>${people.filter(p=>p.shop===s.name).map(personRow).join('')}</div>${row('Today’s appointments',s.bookings+' bookings · Preview schedule','schedule',s.name)}`}
function peopleList(){const ps=scopedPeople().filter(p=>(state.peopleFilter!=='inactive'||!active(p))&&(p.name+' '+p.shop).toLowerCase().includes(state.peopleQuery.toLowerCase()));return ps.length?ps.map(personRow).join(''):'<p class="muted">No matching barbers.</p>'}
function peopleView(){return title('People & accounts','Find your people','Inactive accounts stay easy to find.')+`<label class="field">Search by name or shop<input id="search" type="search" value="${esc(state.peopleQuery)}" placeholder="Find a barber"></label><div class="seg"><button data-filter="all" class="${state.peopleFilter==='all'?'selected':''}">Everyone</button><button data-filter="inactive" class="${state.peopleFilter==='inactive'?'selected':''}">Inactive</button></div><div class="card" id="people-list">${peopleList()}</div>`}
function personView(){const p=people.find(p=>p.id===route.arg)||people[0];return title(p.shop,p.name)+`<span class="badge ${active(p)?'':'red'}">${active(p)?'Active':'Inactive'}</span><div class="card" style="margin-top:20px"><h2>Appointments & information</h2><p class="small muted">${active(p)?'Working today':(state.rent.paid?'Payment recorded · Re-Up needed':'Access paused · Boothrent outstanding')}</p>${row('Appointments','Today’s sample schedule','schedule',p.shop)}${p.id==='alex'?row('Boothrent & Re-Up',state.rent.active?'Completed':state.rent.paid?'Payment recorded · Reactivation needed':money(state.rent.rate)+' outstanding','rent'):row('Boothrent','Paid for Sep 21–27','paid',p.id)}</div><div class="card"><h2>Barber setup</h2>${row('Services','Classic haircut · Beard service','setup',p.id+'|services')}${row('Hours','9 AM–6 PM · Tuesday–Saturday','setup',p.id+'|hours')}${row('Days off','Manage availability','setup',p.id+'|days')}</div>`}
function boothrent(){return title('Payments & access','Boothrent','Rental week · Sep 21–27')+(scopedRent()?`<div class="card">${row('Alex Morgan',state.rent.active?'Paid · Account active':state.rent.paid?'Paid · Re-Up in progress':'Unpaid · Account inactive','rent','',money(state.rent.rate))}</div>`:'')+`<div class="card"><h2>Recorded shop collections</h2>${selected().map(s=>`<div class="detail"><span>${s.name}</span><strong>${money(300+(s.name==='Kirkland'&&state.rent.paid?state.rent.rate:0))}</strong></div>`).join('')}</div><p class="small muted">Collection totals include other sample payments at each shop.</p>`}
function earnings(){const ss=route.arg?shops.filter(s=>s.name===route.arg):selected();const factor=state.period==='Today'?1:5;return title('Barber service earnings',route.arg||'Earnings reports','Explore a shop, then a barber. Your period stays selected.')+`<label class="field">Reporting period<select id="period"><option ${state.period==='Today'?'selected':''}>Today</option><option ${state.period==='This week'?'selected':''}>This week</option></select></label><div class="card"><p class="eyebrow">${state.period} · Service earnings</p><strong class="number">${money(ss.reduce((a,s)=>a+s.earnings*factor,0))}</strong>${ss.map(s=>row(s.name,'View barber breakdown','report',s.name,money(s.earnings*factor))).join('')}</div>`}
function report(){const s=shops.find(s=>s.name===route.arg)||shops[0],ps=people.filter(p=>p.shop===s.name),total=s.earnings*(state.period==='Today'?1:5);return title(state.period+' · Service earnings',s.name,'Barber breakdown')+`<div class="card">${ps.map((p,i)=>row(p.name,'Service earnings','barber-report',p.id,money(i===0?Math.ceil(total/ps.length):Math.floor(total/ps.length)))).join('')}</div>`}
function barberReport(){const p=people.find(p=>p.id===route.arg),s=shops.find(s=>s.name===p.shop),total=s.earnings*(state.period==='Today'?1:5),members=people.filter(x=>x.shop===p.shop);const amount=members.indexOf(p)===0?Math.ceil(total/members.length):Math.floor(total/members.length);return title(state.period+' · '+p.shop,p.name,'Barber service earnings')+`<strong class="number">${money(amount)}</strong><div class="card" style="margin-top:20px"><div class="detail"><span>Haircuts</span><strong>${money(Math.round(amount*.8))}</strong></div><div class="detail"><span>Beard services</span><strong>${money(amount-Math.round(amount*.8))}</strong></div></div>`}
function schedule(){const ss=route.arg?shops.filter(s=>s.name===route.arg):selected();return title('Today · October 2','Appointments','A preview of upcoming bookings in this concept.')+`<div class="card">${ss.map(s=>row('2:30 PM · Classic haircut',s.name+' · Confirmed','appointment',s.name,'$40')).join('')}</div><p class="small muted">Showing one sample appointment per shop. Dashboard totals represent the full day.</p>`}
function compose(){const m=state.message;if(m.stage==='review')return title('Announcement · Step 2 of 2','Review message','Your draft is saved. You can return later.')+`<div class="card"><p class="eyebrow">To: ${esc(m.to)}</p><h2>${esc(m.subject)}</h2><p style="white-space:pre-wrap;margin-top:16px">${esc(m.body)}</p></div><p class="small muted">Demo only. No one will receive this message.</p><button class="btn" data-send>Send demo announcement</button><button class="link" data-edit-message>← Edit draft</button>`;return title('Announcement · Step 1 of 2','Write a message','Draft saves as you write, even when you leave.')+`<form id="message-form"><label class="field">To<select id="recipient">${['All shops',...shops.map(s=>s.name)].map(n=>`<option ${m.to===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Subject<input id="subject" value="${esc(m.subject)}" required maxlength="120"></label><label class="field">Message<textarea id="message" required maxlength="2000">${esc(m.body)}</textarea></label><span class="badge" id="saved">Draft saved</span><button class="btn">Review announcement →</button></form>`}
function messages(){return title('Shop & group messaging','Messages','Conversations and announcements, together.')+`${state.message.stage!=='sent'?row('Continue announcement',state.message.stage==='review'?'Ready to review':'Draft saved','compose'):''}<button class="btn secondary" data-new-message>New announcement</button><div class="section-head"><h2>Sent in this demo</h2></div>${state.sent.length?state.sent.map((m,i)=>row(esc(m.subject),esc(m.to)+' · Sent','sent',String(i))).join(''):'<p class="muted">No announcements sent yet.</p>'}`}
function rate(){const r=state.rent;return title('Alex Morgan · Kirkland','Weekly rental rate','A saved draft won’t change the applied rate until you confirm.')+`<p class="small muted">Current applied rate: ${money(r.rate)} · Shop standard: $300</p><form id="rate-form"><label class="field">New weekly amount ($)<input id="rate" type="number" min="1" max="9999" step="1" required value="${r.rateDraft??r.nextRate??r.rate}"></label><span class="badge" id="rate-saved">${r.rateDraft!==null?'Draft saved':'No changes yet'}</span><div class="note">${r.paid?'Starts next rental week. The recorded payment stays unchanged.':'Applies to the current unpaid week and future weeks.'}</div><button class="btn">Review rate change →</button></form>`}
function rateReview(){return title('Rate change · Review','Confirm weekly rate')+`<div class="card"><div class="detail"><span>Alex Morgan</span><strong>Kirkland</strong></div><div class="detail"><span>New weekly rate</span><strong>${money(state.rent.rateDraft)}</strong></div><p class="small muted" style="margin-top:16px">${state.rent.paid?'Effective next week.':'Effective for the current unpaid week.'}</p></div><button class="btn" data-apply-rate>Apply rental rate</button>`}
function render(){const views={hub,shop:shopView,people:peopleView,person:personView,rent:rentView,boothrent,earnings,report,'barber-report':barberReport,schedule,compose,messages,rate,'rate-review':rateReview,'rate-saved':()=>title('Rental rate','Rate updated')+`<div class="note">${state.rent.paid?'Next week’s rate: '+money(state.rent.nextRate):'Applied weekly rate: '+money(state.rent.rate)}</div><button class="btn" data-back>Back to rate details</button>`,account:()=>title('Owner account','Mervis')+'<div class="note">Owner access · All Chop It Up shops<br>Concept B uses fictional people and sample financial data.</div>',paid:()=>title('Rental week · Sep 21–27','Paid & active')+'<div class="note">This sample barber is up to date.</div>',appointment:()=>title(route.arg+' · Today','Classic haircut')+'<div class="card"><h2>2:30 PM · 30 minutes</h2><p>Confirmed · Sample client</p><div class="detail"><span>Service price</span><strong>$40</strong></div></div>',setup:()=>{const [id,kind]=route.arg.split('|'),p=people.find(p=>p.id===id);return title(p.name,kind==='services'?'Services':kind==='hours'?'Working hours':'Days off')+`<div class="card">${kind==='services'?'<div class="detail"><span>Classic haircut</span><strong>$40 · 30 min</strong></div><div class="detail"><span>Beard service</span><strong>$20 · 15 min</strong></div>':kind==='hours'?'<h2>Tuesday–Saturday</h2><p>9 AM–6 PM</p>':'<h2>No planned days off</h2>'}</div><p class="small muted">Preview only. This concept focuses on dashboard navigation, Re-Ups, and continuing tasks.</p>`},sent:()=>{const m=state.sent[+route.arg];if(!m)return title('Messages','No saved announcement')+'<p class="muted">This demo was reset.</p>';return title('Sent in demo · '+esc(m.to),esc(m.subject))+`<div class="card"><p style="white-space:pre-wrap">${esc(m.body)}</p><span class="badge">Sent · Demo only</span></div>`}};$('#main').innerHTML=(views[route.view]||hub)();$('#trail').innerHTML=route.view==='hub'?'':`<button data-back>← ${stack.at(-1)?.view==='hub'?'Dashboard':'Back'}</button><span>${state.scope==='all'?'All shops':state.scope}</span>`;history.replaceState({ownerHub:true,route,stack},'');if(window.parent!==window)window.parent.postMessage({type:'owner-viewer:state',view:route.view},location.origin)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go,b.dataset.arg||null);return}if(b.hasAttribute('data-back')){back();return}if(b.dataset.filter){state.peopleFilter=b.dataset.filter;save();render();return}if(b.hasAttribute('data-pay')){state.rent.paid=true;state.rent.method=$('#method').value;save();render();notify('Payment recorded · Re-Up ready');return}if(b.hasAttribute('data-reup')){if(!state.rent.paid)return;state.rent.active=true;save();render();notify('Alex is active again');return}if(b.hasAttribute('data-edit-message')){state.message.stage='draft';save();render();return}if(b.hasAttribute('data-send')){state.sent.unshift({...state.message});state.message.stage='sent';save();route.view='sent';route.arg='0';render();notify('Demo announcement sent');return}if(b.hasAttribute('data-new-message')){if(state.message.stage==='sent')state.message={subject:'',body:'',to:'All shops',stage:'draft'};save();go('compose');return}if(b.hasAttribute('data-apply-rate')){if(!Number.isFinite(state.rent.rateDraft)||state.rent.rateDraft<1)return;if(state.rent.paid)state.rent.nextRate=state.rent.rateDraft;else state.rent.rate=state.rent.rateDraft;state.rent.rateDraft=null;save();route.view='rate-saved';render();notify('Rate applied');return}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='search'){state.peopleQuery=e.target.value;save();$('#people-list').innerHTML=peopleList()}if(['subject','message'].includes(id)){state.message[id==='subject'?'subject':'body']=e.target.value;save();$('#saved').textContent='Draft saved'}if(id==='rate'){const n=Number(e.target.value);if(e.target.value&&Number.isInteger(n)&&n>=1&&n<=9999){state.rent.rateDraft=n;save();$('#rate-saved').textContent='Draft saved'}else $('#rate-saved').textContent='Enter a valid whole-dollar rate'}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){state.scope=e.target.value;save();render()}if(e.target.id==='period'){state.period=e.target.value;save();render()}if(e.target.id==='recipient'){state.message.to=e.target.value;save()}if(e.target.id==='method'){state.rent.method=e.target.value;save()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='message-form'){state.message.stage='review';save();render();window.scrollTo(0,0)}if(e.target.id==='rate-form'){state.rent.rateDraft=Number($('#rate').value);save();go('rate-review')}});
$('#reset').onclick=()=>{if(!confirm('Reset this concept’s sample payments, drafts, and progress?'))return;state={...structuredClone(initial),version:1};save();stack=[];route={view:'hub',arg:null,scroll:0};render();window.scrollTo(0,0);notify('Demo reset')};render();requestAnimationFrame(()=>window.scrollTo(0,route.scroll||0));

window.addEventListener('message',e=>{if(window.parent===window||e.source!==window.parent||e.origin!==location.origin||e.data?.type!=='owner-viewer:navigate')return;const allowed=['hub','rent','people','shop','earnings','messages','compose','rate'];if(!allowed.includes(e.data.view))return;const arg=e.data.view==='shop'?'Kirkland':null;if(route.view===e.data.view&&route.arg===arg)return;snapshot();stack=e.data.view==='hub'?[]:[{view:'hub',arg:null,scroll:0}];route={view:e.data.view,arg,scroll:0};render();window.scrollTo(0,0)});
</script></body></html>
