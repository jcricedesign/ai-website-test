<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner mode · Chop It Up</title>
<style>
:root{--ink:#171b18;--muted:#68716a;--green:#32674e;--line:#e0e4de;--paper:#f5f6f2;--red:#9b382d}*{box-sizing:border-box}body{margin:0;background:#e6e8e2;color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #54816a;outline-offset:3px}button{color:inherit}a{color:var(--green)}.app{max-width:520px;min-height:100dvh;margin:auto;background:var(--paper)}header{background:#111;color:white;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header img{width:126px;height:48px;object-fit:contain}header span{font-size:12px;letter-spacing:.06em}header button{background:none;color:white;border:1px solid #555;border-radius:22px;padding:10px;font-size:12px;min-height:44px}.demo{display:flex;justify-content:space-between;align-items:center;background:#e9ece5;color:#586254;padding:7px 22px;font-size:11px;letter-spacing:.03em}.demo button{border:0;background:transparent;text-decoration:underline;min-height:30px;font-size:11px;padding:4px 0}.scope{padding:20px 22px 0}.scope label{font-size:10px;font-weight:bold;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:4px}.scope select{width:100%;border:0;border-bottom:1px solid #cdd3c9;padding:10px 24px 12px 0;border-radius:0;background:transparent;font-size:16px;font-weight:600;min-height:44px}main{padding:28px 22px 120px}h1{font-size:35px;line-height:1.1;letter-spacing:-1.3px;margin:5px 0 10px}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 8px}h3{font-size:17px;margin:0 0 5px}p{margin:0 0 14px}.muted{color:var(--muted)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:bold;color:var(--muted)}.intro{margin-bottom:28px;font-size:14px;color:var(--muted)}.section-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.urgent{border-top:4px solid var(--red)}.attention{border-top:3px solid #b98b40}.badge{display:inline-block;font-size:11px;font-weight:bold;border-radius:5px;padding:4px 7px;background:#edf2eb;color:var(--green)}.badge.red{background:#f9e9e4;color:var(--red)}.badge.amber{background:#f8efdb;color:#806120}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.small{font-size:12px}.person{display:flex;align-items:center;gap:12px;margin:14px 0}.avatar{width:42px;height:42px;border-radius:50%;background:#e8ede5;display:grid;place-items:center;font-weight:bold;font-size:13px;color:#45634d;flex-shrink:0}.person p{margin:0;font-size:12px;color:var(--muted)}.amount{font-size:28px;font-weight:bold;letter-spacing:-1px}.split{display:flex;justify-content:space-between;align-items:center;gap:16px}.btn{border:0;border-radius:10px;min-height:48px;padding:12px 16px;background:var(--green);color:white;font-weight:bold;font-size:14px;width:100%;margin-top:14px}.btn.secondary{background:#edf1e9;color:var(--green)}.text-btn{border:0;background:transparent;color:var(--green);padding:12px 0;min-height:44px;font-size:13px;font-weight:bold}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;min-height:60px}.row:last-child{border-bottom:0}.row .grow{flex:1}.row strong{display:block;font-size:15px}.row small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.arrow{color:var(--muted);font-size:20px}.empty{text-align:center;padding:48px 12px}.check{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 22px;background:#e4eddf;color:var(--green);border-radius:50%;font-size:27px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:#111;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#a9ada7;padding:8px 1px;min-height:56px;font-size:11px}.nav button.active{color:#b5d7b6}.nav svg{display:block;margin:0 auto 5px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}.nav button.active:before{content:'';display:block;height:2px;background:#b5d7b6;position:absolute;top:0;width:32px;margin-left:calc((min(100vw,520px) - 16px)/8 - 17px)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.metric{background:#e6eedd;padding:17px 14px;border-radius:12px}.metric:nth-child(2){background:#f2e8d7}.metric span{font-size:11px;display:block}.metric strong{font-size:27px;letter-spacing:-1px;display:block;margin:8px 0 3px}.metric small{font-size:10px;color:#55604f}.bar{height:6px;background:#e9ece5;border-radius:4px;margin:12px 0;overflow:hidden}.bar span{display:block;height:100%;background:#62946d}.field{display:grid;gap:7px;margin:18px 0;font-size:13px;font-weight:bold}.field input,.field select,.field textarea{width:100%;background:white;border:1px solid #cbd2c8;border-radius:8px;padding:12px;font-weight:normal;min-height:46px}.field textarea{min-height:100px;resize:vertical}.period{border:1px solid #cbd2c8;background:white;padding:10px;border-radius:8px;min-height:44px;width:100%;margin:4px 0}.seg{display:flex;gap:8px;margin:20px 0}.seg button{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:24px;min-height:44px;font-size:13px}.seg button.selected{background:#263e2e;color:white}.note{background:#eef1e9;padding:14px;border-radius:10px;color:#52604e;font-size:12px;margin:16px 0}dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(100%,520px);max-width:520px;max-height:94dvh;margin:auto auto 0;border-radius:22px 22px 0 0;box-shadow:0 -10px 70px #0002}dialog::backdrop{background:#101b1680}.sheet-head{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);z-index:2}.sheet-head button{background:white;border:1px solid var(--line);border-radius:50%;height:44px;width:44px;font-size:22px}.sheet-body{padding:24px 22px calc(26px + env(safe-area-inset-bottom))}.sheet-body h2{font-size:28px;letter-spacing:-1px}.detail{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}.detail span{color:var(--muted)}#toast{position:fixed;z-index:20;bottom:100px;left:50%;transform:translateX(-50%);background:#263e2e;color:white;border-radius:12px;padding:13px 20px;max-width:90%;width:max-content;font-size:13px;box-shadow:0 5px 20px #0002}#toast:empty{display:none}.project-link{display:block;text-align:center;margin-top:30px;font-size:12px;color:var(--muted)}@media(min-width:700px){.app{margin:28px auto;min-height:calc(100dvh - 56px);box-shadow:0 15px 80px #27352618;border-radius:24px;overflow:hidden}.nav{border-radius:18px 18px 0 0}dialog{margin:auto;border-radius:22px;max-height:85dvh}}
</style></head><body>
<div class="app"><header><span>OWNER MODE</span><img src="/barber-game/chop-it-up/redesign/ChopItUp-Logo.png" alt="Chop It Up Barbershops"><button id="messages">Messages</button></header><div class="demo"><span>INTERACTIVE CONCEPT · SAMPLE DATA</span><button id="reset">Reset demo</button></div><div class="scope"><label for="shop">VIEWING</label><select id="shop"><option value="all">All shops · Chop It Up</option>Kirkland</option><option>Bothell</option><option>Bellevue</option></select></div><main id="main"></main><nav class="nav" aria-label="Main navigation"></nav></div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><strong id="sheet-title">Details</strong><button id="close" aria-label="Close details">×</button></div><div class="sheet-body" id="sheet-body"></div></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);const shops=['Kirkland','Bothell','Bellevue'];
const initial=[{id:1,name:'Alex Morgan',shop:'Kirkland',rate:275,standard:300,paid:false,active:false},{id:2,name:'Sam Taylor',shop:'Bothell',rate:300,standard:300,paid:false,active:true},{id:3,name:'Jordan Lee',shop:'Bellevue',rate:300,standard:300,paid:true,active:true}];
let people=structuredClone(initial),tab='Home',scope='all',filter='all',query='',period='week',read=false,day='shop',sent=[];const scrolls={};let returnFocus=null,toastTimer;
const money=n=>'$'+n.toLocaleString('en-US');const visible=()=>people.filter(p=>scope==='all'||p.shop===scope);const initials=n=>n.split(' ').map(x=>x[0]).join('');const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={Home:'<path d="m3 10 9-7 9 7v11H3z"/><path d="M9 21v-8h6v8"/>','My Day':'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',Business:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 13h18m-9-2v4"/>',Overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'};
function nav(){ $('.nav').innerHTML=Object.keys(icons).map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}" ${t===tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[t]}</svg>${t}</button>`).join('') }
function heading(k,t,d){return `<div class="eyebrow">${k}</div><h1 tabindex="-1">${t}</h1><p class="intro">${d}</p>`}
function person(p){return `<div class="person"><div class="avatar">${initials(p.name)}</div><div><h3>${p.name}</h3><p>${p.shop} · ${p.active?'Active':'Account inactive'}</p></div></div>`}
function row(p){return `<button class="row" data-person="${p.id}"><span class="avatar">${initials(p.name)}</span><span class="grow"><strong>${p.name}</strong><small>${p.shop} · ${p.paid?'Paid this week':money(p.rate)+' outstanding'}</small></span><span class="badge ${p.active?'':'red'}">${p.active?'Active':'Inactive'}</span><span class="arrow">›</span></button>`}
function home(){let items=visible().filter(p=>!p.paid||!p.active).sort((a,b)=>Number(a.active)-Number(b.active));return heading('Your action center','What needs you',items.length?`${items.length} items need attention${scope==='all'?' across your shops':''}.`:'Everything is handled for now.')+(items.length?items.map(p=>`<article class="card ${!p.active?'urgent':'attention'}"><div class="card-top"><span class="badge ${!p.active?'red':'amber'}">${!p.active?'Needs attention':'Payment outstanding'}</span><span class="small muted">Boothrent</span></div><h2>${!p.active?(p.paid?'Ready for a Re-Up':'Help a barber get back to work'):'Record a rent payment'}</h2>${person(p)}<div class="split"><span class="small muted">${p.paid?'Payment recorded':'Week of Sep 21–27'}</span><strong class="amount">${p.paid?'Paid':money(p.rate)}</strong></div><button class="btn ${p.active?'secondary':''}" data-person="${p.id}">${p.paid?'Review Re-Up':'Review boothrent'} →</button></article>`).join(''):`<div class="empty"><div class="check">✓</div><h2>All clear.</h2><p class="muted">No outstanding actions${scope==='all'?' across your shops':' at '+scope}.<br>We’ll show you when something needs you.</p><button class="text-btn" data-tab="Overview">See how your shops are doing →</button></div>`)+`<a class="project-link" href="../">About this project</a>`}
function myday(){const list=visible().filter(p=>p.active);return heading('Thursday · October 1','My Day','A little context for the day ahead.')+`<div class="seg"><button data-day="shop" class="${day==='shop'?'selected':''}">Shop activity</button><button data-day="mine" class="${day==='mine'?'selected':''}">My appointments</button></div>`+(day==='mine'?`<div class="card empty"><h2>Your day is open.</h2><p class="muted">No personal appointments in this demo.</p><button class="text-btn" data-day="shop">View shop activity →</button></div>`:`<div class="split"><h2>Working today</h2><span class="badge">${list.length} barbers</span></div><div class="card">${list.length?list.map(row).join(''):'<p class="muted">No working barbers in this sample.</p>'}</div><div class="section-label">Upcoming appointments <span>Sample schedule</span></div>${list.map((p,i)=>`<button class="row" data-appointment="${p.id}"><span class="avatar">${i?'3:00':'2:30'}</span><span class="grow"><strong>${i?'Riley':'Casey'} · Classic haircut</strong><small>${p.name} · ${p.shop}</small></span><strong>$40</strong><span class="arrow">›</span></button>`).join('')}`)}
function business(){return heading('People & places','Business','Everyday management, together.')+`<div class="card"><button class="row" data-manage="Boothrent"><span class="grow"><strong>Boothrent</strong><small>Payments, individual rates, and Re-Ups</small></span><span class="arrow">›</span></button><button class="row" data-manage="Shops"><span class="grow"><strong>Shop locations</strong><small>${scope==='all'?'3 shops in this concept':scope}</small></span><span class="arrow">›</span></button><button class="row" data-manage="Access & roles"><span class="grow"><strong>Access & roles</strong><small>Who can do what, at each shop</small></span><span class="arrow">›</span></button></div><div class="section-label">Find a barber <span>Includes inactive accounts</span></div><label class="field" for="search">Name or shop<input id="search" type="search" placeholder="Search people" value="${escape(query)}"></label><div class="seg"><button data-filter="all" class="${filter==='all'?'selected':''}">Everyone</button><button data-filter="inactive" class="${filter==='inactive'?'selected':''}">Inactive</button></div><div id="people-list" class="card">${peopleList()}</div>`}
function peopleList(){const list=visible().filter(p=>(filter==='all'||!p.active)&&(p.name+' '+p.shop).toLowerCase().includes(query.toLowerCase()));return list.length?list.map(row).join(''):'<p class="muted">No barbers match. Try another name or shop.</p>'}
function totals(shop){const factor=period==='week'?1:4;const p=people.find(p=>p.shop===shop);return {service:({Kirkland:4250,Bothell:5100,Bellevue:4680}[shop])*factor,rent:p.paid?p.rate:0}}
function overview(){const names=scope==='all'?shops:[scope];const service=names.reduce((s,n)=>s+totals(n).service,0),rent=names.reduce((s,n)=>s+totals(n).rent,0);return heading('The bigger picture','Overview','How are your shops doing?')+`<label class="field" for="period">Service earnings period<select id="period"><option value="week" ${period==='week'?'selected':''}>This week · Sep 28–Oct 4</option><option value="month" ${period==='month'?'selected':''}>September 2026</option></select></label><div class="metrics"><div class="metric"><span>Barber service earnings</span><strong>${money(service)}</strong><small>${period==='week'?'This week · to date':'September total'}</small></div><div class="metric"><span>Boothrent collected</span><strong>${money(rent)}</strong><small>Rental week · Sep 21–27</small></div></div><div class="section-label">${scope==='all'?'Across your shops':scope} <span>${names.length} ${names.length===1?'location':'locations'}</span></div><div class="card">${names.map(n=>`<button class="row" data-report="${n}"><span class="grow"><strong>${n}</strong><small>Barber service earnings</small></span><strong>${money(totals(n).service)}</strong><span class="arrow">›</span></button>`).join('')}</div><p class="small muted">Open a shop for its barber breakdown and boothrent detail. Earnings and rent are kept separate.</p>`}
function render(){nav();$('#main').innerHTML=({Home:home,'My Day':myday,Business:business,Overview:overview}[tab])()}
function go(t){scrolls[tab]=window.scrollY;tab=t;render();window.scrollTo(0,scrolls[t]||0)}
function open(title,body){if(!$('#sheet').open)returnFocus=document.activeElement;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;if(!$('#sheet').open)$('#sheet').showModal();$('#sheet').scrollTop=0}
function close(){ $('#sheet').close();if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});else $('#main h1')?.focus({preventScroll:true}) }
function notify(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function detail(id){const p=people.find(p=>p.id===id);open('Barber & boothrent',`${person(p)}<span class="badge ${p.active?'':'red'}">${p.active?'Account active':'Account inactive'}</span><div class="card"><h3>Boothrent</h3><div class="detail"><span>Rental week</span><strong>Sep 21–27</strong></div><div class="detail"><span>Applied weekly rate</span><strong>${money(p.rate)}</strong></div><div class="detail"><span>Shop standard rate</span><strong>${money(p.standard)}</strong></div><div class="detail"><span>Status</span><strong>${p.paid?'Paid · '+(p.method||'Online'):'Unpaid'}</strong></div>${p.nextRate?'<div class="detail"><span>Next week’s rate</span><strong>'+money(p.nextRate)+'</strong></div>':''}${p.rate!==p.standard?'<p class="small muted" style="margin-top:12px">This barber’s individual rate applies to the amount owed.</p>':''}</div>${!p.paid?`<p class="small muted">${p.active?'This sample account is active. Record the payment received for the rental week shown.':'The account was deactivated after the Tuesday deadline.'}</p><label class="field">Payment received via<select id="method"><option>Cash</option><option>Zelle</option></select></label><button class="btn" data-pay="${id}">Mark ${money(p.rate)} paid</button>`:!p.active?`<div class="note">Payment is recorded. The next step restores access.</div><button class="btn" data-reup="${id}">Re-Up · Reactivate barber</button>`:`<div class="note">Paid up for this rental week. The account is active.</div><button class="btn" data-done>Done</button>`}<button class="text-btn" data-rate="${id}">Edit weekly rental rate</button>`)}
function messages(){open('Messages',`<h2>Your inbox</h2><p class="muted small">Shop and group conversations, in one place.</p><button class="btn" data-compose>Write a message</button><button class="row" data-read><span class="grow"><strong>Saturday opening hours</strong><small>Kirkland team · ${read?'Read':'Unread'} · 9:15 AM</small></span><span class="arrow">›</span></button>${sent.map(m=>`<div class="row"><span class="grow"><strong>${escape(m.subject)}</strong><small>${escape(m.to)} · Saved in this demo</small><p class="small">${escape(m.body)}</p></span></div>`).join('')}`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){go(b.dataset.tab);return}if(b.dataset.person){detail(+b.dataset.person);return}if(b.dataset.day){day=b.dataset.day;render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.hasAttribute('data-done')){close();return}if(b.dataset.pay){const p=people.find(p=>p.id===+b.dataset.pay);p.paid=true;p.method=$('#method').value;render();detail(p.id);notify('Payment recorded in demo');return}if(b.dataset.reup){const p=people.find(p=>p.id===+b.dataset.reup);if(!p.paid)return;p.active=true;render();detail(p.id);notify(p.name+' is active again');return}if(b.dataset.rate){const p=people.find(p=>p.id===+b.dataset.rate);open('Edit rental rate',`<h2>${p.name}</h2><p class="muted">${p.shop} · Individual weekly rate</p><form id="rate-form" data-id="${p.id}"><label class="field">Weekly amount ($)<input id="rate" type="number" min="1" max="9999" step="1" required value="${p.rate}"></label><p class="small muted">${p.paid?'Applies to future weeks. The recorded payment stays unchanged.':'Applies to this unpaid week and future weeks in the demo.'}</p><button class="btn" type="submit">Save rate</button></form>`);return}if(b.dataset.report){const n=b.dataset.report,p=people.find(p=>p.shop===n);open(n+' · Earnings',`<div class="eyebrow">${period==='week'?'This week · to date':'September 2026'}</div><h2>${n}</h2><div class="card"><p class="small muted">Barber service earnings</p><strong class="amount">${money(totals(n).service)}</strong><button class="row" data-earnings="${p.id}"><span class="grow"><strong>${p.name}</strong><small>View earnings detail</small></span><strong>${money(totals(n).service)}</strong><span>›</span></button></div><div class="card"><h3>Boothrent · Sep 21–27</h3><div class="detail"><span>Collected</span><strong>${money(totals(n).rent)}</strong></div><div class="detail"><span>Outstanding</span><strong>${money(p.paid?0:p.rate)}</strong></div><button class="text-btn" data-person="${p.id}">Open barber & payment →</button></div>`);return}if(b.dataset.earnings){const p=people.find(p=>p.id===+b.dataset.earnings);const total=totals(p.shop).service;open('Barber earnings',`${person(p)}<p class="eyebrow">${period==='week'?'This week · to date':'September 2026'}</p><h2>${money(total)}</h2><p class="muted">Service earnings</p>${['Haircuts','Beard services','Other services'].map((n,i)=>`<div class="detail"><span>${n}</span><strong>${money(i===0?total*.8:total*.1)}</strong></div>`).join('')}<button class="text-btn" data-report="${p.shop}">← Back to shop earnings</button>`);return}if(b.dataset.appointment){const p=people.find(p=>p.id===+b.dataset.appointment);open('Appointment',`<h2>Classic haircut</h2><p class="muted">Today · ${p.id===2?'2:30':'3:00'} PM · 30 minutes</p>${person(p)}<div class="detail"><span>Service price</span><strong>$40</strong></div><div class="note">Confirmed appointment · sample data</div>`);return}if(b.dataset.manage){const k=b.dataset.manage;if(k==='Boothrent')open(k,`<h2>Weekly boothrent</h2><p class="muted">Sep 21–27 · Select a barber to manage payment.</p>${visible().map(row).join('')}`);else if(k==='Shops')open(k,`<h2>Shop locations</h2>${shops.map(n=>`<button class="row" data-scope="${n}"><span class="grow"><strong>${n}</strong><small>View this shop</small></span><span>›</span></button>`).join('')}`);else open(k,`<h2>Access & roles</h2><p class="muted">A place for shop-specific permissions.</p><div class="note">This first concept focuses on payments and Re-Ups. Role editing will be explored next.</div>`);return}if(b.dataset.scope){scope=b.dataset.scope;$('#shop').value=scope;close();render();return}if(b.hasAttribute('data-compose')){open('Write a message',`<form id="message-form"><label class="field">To<select id="recipient"><option>All shops</option>${shops.map(n=>`<option>${n} team</option>`).join('')}</select></label><label class="field">Subject<input id="subject" required maxlength="100"></label><label class="field">Message<textarea id="message" required maxlength="2000"></textarea></label><p class="small muted">Demo only. This saves a sample message; nobody is contacted.</p><button class="btn">Save demo message</button></form>`);return}if(b.hasAttribute('data-read')){read=true;open('Kirkland team',`<p class="eyebrow">Today · 9:15 AM</p><h2>Saturday opening hours</h2><p>We’re opening at 9 AM this Saturday. Please check your availability before the end of the day.</p><p class="small muted">Sample announcement · Read</p><button class="text-btn" data-inbox>← Back to inbox</button>`);return}if(b.hasAttribute('data-inbox'))messages()});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='rate-form'){const p=people.find(p=>p.id===+e.target.dataset.id),v=Number($('#rate').value);if(!Number.isFinite(v)||v<1||v>9999)return;if(p.paid){p.nextRate=v;open('Rate saved',`<h2>Next week: ${money(v)}</h2><p>${p.name}’s recorded payment stays at ${money(p.rate)}.</p><button class="btn" data-person="${p.id}">Back to barber</button>`)}else{p.rate=v;detail(p.id)}render();notify('Rental rate saved in demo')}if(e.target.id==='message-form'){sent.unshift({to:$('#recipient').value,subject:$('#subject').value,body:$('#message').value});messages();notify('Demo message saved')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#people-list').innerHTML=peopleList()}});document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;render()}});
$('#shop').onchange=e=>{scope=e.target.value;render()};$('#messages').onclick=messages;$('#close').onclick=close;$('#sheet').addEventListener('cancel',e=>{e.preventDefault();close()});$('#reset').onclick=()=>{people=structuredClone(initial);read=false;sent=[];filter='all';query='';period='week';scope='all';$('#shop').value='all';tab='Home';render();window.scrollTo(0,0);notify('Demo reset')};render();
