<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Barbergame — Barber First Run Experience</title>
<link rel="stylesheet" href="/barber-game/assets/flow-viewer.css">
<style>
:root{--phone:#222}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif}
.states{display:flex;flex-direction:column;gap:2px;padding:0;margin:0}
.state{display:grid;grid-template-columns:24px 1fr;align-items:center;min-height:34px;color:var(--flow-rail)}
.state-eye{width:24px;height:30px;border:0;background:transparent;color:var(--flow-rail);padding:5px 4px;display:grid;place-items:center}
.state-eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.state-select{height:30px;border:0;background:transparent;color:#111;padding:0 4px;display:grid;grid-template-columns:22px 1fr;gap:7px;align-items:center;text-align:left;font-size:11px;font-weight:700}
.state-num{width:20px;height:20px;background:var(--flow-rail);color:#fff;border:1px solid var(--flow-rail);display:grid;place-items:center;font-size:9px}
.stage{position:relative;min-height:0}
.phone{position:absolute;left:50%;top:50%;width:414px;height:866px;padding:12px;background:#090a0b;border:2px solid #25272a;border-radius:48px;overflow:visible;box-shadow:0 26px 70px rgba(0,0,0,.45),inset 0 0 0 1px #000;transform:translate(-50%,-50%);transform-origin:center center}
.device-screen{width:390px;height:842px;background:var(--phone);border-radius:36px;overflow:hidden;position:relative}
.phone:before{content:"";position:absolute;z-index:8;top:5px;left:50%;transform:translateX(-50%);width:58px;height:5px;border-radius:999px;background:#292b2e}
.phone:after{content:"";position:absolute;z-index:8;top:8px;right:70px;width:6px;height:6px;border-radius:50%;background:#1b1d20;box-shadow:0 0 0 1px #303236}
.phone-head{height:78px;padding:0 20px;display:grid;grid-template-columns:1fr auto;align-items:center;background:#222;color:#aaa}
.phone-head .menu{justify-self:end;font-size:24px}
.placeholder{height:764px;display:grid;place-items:center;padding:32px;color:#aaa;text-align:center}
.placeholder strong{display:block;color:#fff;font-size:26px;letter-spacing:-.03em;margin-bottom:8px}
.caption{text-align:center;color:rgba(255,255,255,.7);font-size:12px;margin-top:12px}
@media(max-width:800px){.phone{width:414px;height:866px}}
</style>
</head>
<body>
<div class="flow-viewer-shell">
  <aside class="flow-sidebar">
    <a class="back" href="/barber-game/">← The Barbergame</a>
    <h1>Barber<br>first run</h1>
    <p class="flow-subtitle">First experience immediately after onboarding.</p>
    <nav class="states">
      <div class="state">
        <button class="state-eye" type="button" aria-label="Visible">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        </button>
        <button class="state-select" type="button"><span class="state-num">1</span><span>First run</span></button>
      </div>
    </nav>
  </aside>
  <section class="flow-main">
    <div class="stage-wrap">
      <div class="stage">
        <div class="phone">
          <div class="device-screen">
            <div class="phone-head"><div></div><div class="menu">☰</div></div>
            <div class="placeholder"><div><strong>Barber First Run Experience</strong>Ready for the first post-onboarding state.</div></div>
          </div>
        </div>
      </div>
      <div class="caption">First run — initial landing state after Barber Onboarding.</div>
    </div>
  </section>
</div>
<script>
if(sessionStorage.getItem('tbg-auth')!=='1') location.replace('/barber-game/');
function fitPhone(){
  const stage=document.querySelector('.stage');
  const phone=document.querySelector('.phone');
  if(!stage||!phone) return;
  const box=stage.getBoundingClientRect();
  const maxH=Math.max(420,window.innerHeight-box.top-54);
  const maxW=Math.max(280,stage.clientWidth-12);
  const scale=Math.min(1,maxH/866,maxW/414);
  phone.style.transform='translate(-50%,-50%) scale('+scale+')';
  stage.style.height=maxH+'px';
}
window.addEventListener('resize',fitPhone);
requestAnimationFrame(fitPhone);
</script>
</body>
</html>
