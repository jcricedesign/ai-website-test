<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbergame Desktop</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}iframe{display:block;border:0;width:100%;height:100vh}</style></head><body><iframe id="prototype" src="../barbergame-mobile/app.html?v=20260908-desktop-close"></iframe><script>

`;d.head.appendChild(s);const nav=d.querySelector('.nav'),top=d.querySelector('.top');if(nav&&top)top.insertAdjacentElement('afterend',nav);

const close=d.querySelector('.modeclose');if(close){close.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(typeof w.closeMode==='function')w.closeMode()},true)}
