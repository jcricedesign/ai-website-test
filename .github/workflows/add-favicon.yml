name: Add favicon

on:
  push:
    paths:
      - '.github/workflows/add-favicon.yml'

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sigil favicon to HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<link rel="icon" href="/assets/common/JCR_sigil.png" type="image/png">'
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'rel="icon"' in text or "rel='icon'" in text:
                  continue
              if '<head>' in text:
                  text = text.replace('<head>', '<head>\n' + tag, 1)
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit favicon links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use JCR sigil as site favicon [skip ci]"
          git push
