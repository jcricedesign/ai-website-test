name: Build information wall atlas

on:
  push:
    branches: [main]
    paths:
      - 'playground/portfolio-next/information-wall/**'
      - '.github/workflows/build-information-wall-atlas.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python playground/portfolio-next/information-wall/build_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: information-wall-atlas
          path: playground/portfolio-next/information-wall/generated/
