name: Build information wall atlas

on:
  push:
    branches: [main]
    paths:
      - 'playground/portfolio-next/information-wall/**'
      - '.github/workflows/build-information-wall-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python playground/portfolio-next/information-wall/build_atlas.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Build information wall atlas
          file_pattern: playground/portfolio-next/information-wall/generated/*
