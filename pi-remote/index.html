<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Display"><title>Portfolio Display</title><style>:root{color-scheme:dark;--bg:#111;--text:#f5f5f2;--muted:#989894;--rule:rgba(255,255,255,.14);--soft:rgba(255,255,255,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100svh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding:2px 0 15px}.brand{font-size:.88rem;font-weight:700}.status{font-size:.7rem;color:var(--muted)}main{flex:1;padding:20px 0}.primary,.secondary,.utility{appearance:none;width:100%;border:0;border-radius:20px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}.primary{min-height:130px;padding:28px;background:var(--text);color:var(--bg);font-size:1.9rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.secondary{min-height:72px;padding:15px;background:var(--soft);color:var(--text)}.utility{min-height:52px;padding:12px;background:transparent;color:var(--muted);border:1px solid var(--rule);font-size:.82rem}.system{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}.system .utility{min-height:44px;font-size:.7rem;padding:9px 5px}.feedback{min-height:34px;margin:12px 4px 0;font-size:.76rem;color:var(--muted)}.feedback.error{color:#ff9e9e}.edit-toggle{margin-top:18px}.edit{display:none;margin-top:12px;padding:18px;border:1px solid var(--rule);border-radius:22px;background:var(--soft)}.edit.open{display:block}.edit .eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}.edit h2{font-size:1.25rem;margin:0 0 14px}.edit textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--rule);border-radius:14px;padding:14px;background:#171717;color:var(--text);font:inherit;font-size:1rem;line-height:1.4}.edit-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.send{background:var(--text);color:var(--bg)}.revert{background:transparent;color:var(--text);border:1px solid var(--rule)}.send,.revert{min-height:54px;border-radius:14px;font:inherit;font-weight:700}.edit-note{font-size:.68rem;line-height:1.45;color:var(--muted);margin:12px 2px 0}.foot{border-top:1px solid var(--rule);padding:12px 0 0;font-size:.66rem;color:var(--muted)}button:disabled{opacity:.45}@media(min-width:700px){body{max-width:520px;margin:auto}}</style></head><body><header class="top"><div class="brand">JR · Display</div><div class="status" id="connection">Checking Pi…</div></header><main><button class="primary" type="button" data-action="next">Next</button><div class="row"><button class="secondary" type="button" data-action="back">Back</button><button class="secondary" type="button" data-action="home">Home</button></div><div class="row"><button class="utility" type="button" data-action="top">Top</button><button class="utility" type="button" data-action="bottom">Bottom</button></div><div class="row"><button class="utility" type="button" data-action="theme">Theme</button><button class="utility" type="button" data-action="screensaver">Screensaver</button></div><button class="utility edit-toggle" id="editToggle" type="button" aria-expanded="false" aria-controls="liveEdit">Live Edit</button><section class="edit" id="liveEdit"><p class="eyebrow">Selected · Home</p><h2>Hero headline</h2><textarea id="headline" maxlength="240">I work on products and businesses before the answers are obvious.</textarea><div class="edit-actions"><button class="send" id="sendLive" type="button">Send Live</button><button class="revert" id="revert" type="button">Revert</button></div><p class="edit-note">Experimental and local only. Changes affect the current 10' presentation, not the website, and reset with the local service.</p></section><div class="system"><button class="utility" type="button" data-action="wake">Wake</button><button class="utility" type="button" data-action="refresh">Refresh</button><button class="utility" type="button" data-action="restart">Restart</button></div><p class="feedback" id="feedback" aria-live="polite">Ready.</p></main><footer class="foot">Local control · portfolio-pi.local</footer><script>const feedback=document.getElementById('feedback'),connection=document.getElementById('connection'),buttons=[...document.querySelectorAll('[data-action]')],editToggle=document.getElementById('editToggle'),edit=document.getElementById('liveEdit'),headline=document.getElementById('headline'),sendLive=document.getElementById('sendLive'),revert=document.getElementById('revert');async function health(){try{const r=await fetch('/health',{cache:'no-store'}),d=await r.json();connection.textContent=r.ok?'Pi online':'Pi unavailable';return d}catch(e){connection.textContent='Pi unavailable';return null}}async function act(name){buttons.forEach(b=>b.disabled=true);feedback.classList.remove('error');const labels={next:'Advancing…',back:'Going back…',home:'Going home…',wake:'Waking display…',top:'Going to top…',bottom:'Going to bottom…',theme:'Changing theme…',screensaver:'Starting screensaver…',refresh:'Refreshing…',restart:'Restarting…'};feedback.textContent=labels[name]||'Working…';try{const r=await fetch('/api/'+name,{method:'POST',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Action failed');feedback.textContent=d.message||'Done';connection.textContent='Pi online';if(navigator.vibrate)navigator.vibrate(12)}catch(e){feedback.textContent=e.message||'Could not reach the Pi';feedback.classList.add('error');connection.textContent='Check Pi'}finally{buttons.forEach(b=>b.disabled=false)}}async function live(path,payload){feedback.classList.remove('error');try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):'{}',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Live Edit failed');feedback.textContent=d.message;return true}catch(e){feedback.textContent=e.message;feedback.classList.add('error');return false}}editToggle.onclick=()=>{const open=!edit.classList.contains('open');edit.classList.toggle('open',open);editToggle.setAttribute('aria-expanded',String(open));if(open)headline.focus()};sendLive.onclick=()=>live('/api/live-edit',{object:'home.hero.headline',value:headline.value});revert.onclick=()=>live('/api/live-edit/revert');buttons.forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));health();</script></body></html>
