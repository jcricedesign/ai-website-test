<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f4f1ea"><title>Multitouch Sandbox</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:#f4f1ea}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#f4f1ea}body{position:fixed;inset:0}#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.object{--x:50vw;--y:50vh;--size:112px;--scale:1;position:absolute;left:0;top:0;width:var(--size);height:var(--size);display:grid;place-items:center;transform:translate3d(calc(var(--x) - var(--size)/2),calc(var(--y) - var(--size)/2),0) scale(var(--scale));color:#fff;font-size:34px;font-weight:700;line-height:1;cursor:grab;touch-action:none;will-change:transform,filter;box-shadow:0 8px 30px rgba(0,0,0,.12);transition:transform 150ms cubic-bezier(.2,.8,.2,1),box-shadow 150ms ease,filter 150ms ease}.object[data-shape=circle]{border-radius:50%}.object[data-shape=square]{border-radius:18px}.object[data-shape=round]{border-radius:35%}.object[data-shape=diamond]{border-radius:18px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.object[data-shape=hex]{clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%)}.object.active{--scale:1.035;cursor:grabbing;box-shadow:0 18px 42px rgba(0,0,0,.22);filter:brightness(1.04);transition:box-shadow 100ms ease,filter 100ms ease}.object.settle{animation:settle 330ms cubic-bezier(.2,.9,.3,1)}@keyframes settle{0%{scale:1.035}45%{scale:.975}72%{scale:1.012}100%{scale:1}}.object.magnetic{filter:brightness(1.09);box-shadow:0 12px 38px rgba(0,0,0,.2)}.object.uniting{animation:unitePulse 360ms ease both}@keyframes unitePulse{0%{filter:brightness(1)}45%{filter:brightness(1.35);scale:1.08}100%{filter:brightness(1);scale:1}}.joined{position:absolute;display:flex;align-items:center;justify-content:center;gap:0;touch-action:none;cursor:grab;filter:drop-shadow(0 10px 18px rgba(0,0,0,.16));animation:joinedIn 420ms cubic-bezier(.2,.9,.25,1) both}.joined .object{position:relative;left:auto;top:auto;transform:none!important;margin:-8px;pointer-events:none;box-shadow:none}.joined.active{scale:1.025;filter:drop-shadow(0 18px 25px rgba(0,0,0,.24))}@keyframes joinedIn{0%{scale:.88}55%{scale:1.07}100%{scale:1}}#add{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:100;width:64px;height:64px;border:0;border-radius:50%;background:#151515;color:#fff;font:300 42px/1 -apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:0 0 5px;box-shadow:0 6px 24px rgba(0,0,0,.18);touch-action:manipulation}#add:active{transform:scale(.96)}#status{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:90;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(0,0,0,.35);pointer-events:none}@media(max-width:500px){.object{--size:96px;font-size:29px}#add{width:58px;height:58px;font-size:38px}}
</style></head><body><main id="stage" aria-label="Multitouch interaction sandbox"></main><div id="status" aria-live="polite"></div><button id="add" type="button" aria-label="Add object">+</button>
<script>
(()=>{const stage=document.getElementById('stage'),add=document.getElementById('add'),status=document.getElementById('status');const specs=[['#e5483f','circle'],['#356fd4','square'],['#e3ae24','diamond'],['#2e9967','hex'],['#8a57c7','round'],['#e4772d','circle']];const pointers=new Map();let count=0,z=1,candidate=null,candidateSince=0,joinedCount=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function update(){const n=stage.querySelectorAll(':scope > .object,:scope > .joined').length;status.textContent=`${n} ${n===1?'object':'objects'} · ${pointers.size} ${pointers.size===1?'touch':'touches'}`}function pos(el){return{x:+el.dataset.x,y:+el.dataset.y}}function setPos(el,x,y){el.dataset.x=x;el.dataset.y=y;el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');if(el.classList.contains('joined')){el.style.left=x+'px';el.style.top=y+'px';el.style.transform='translate(-50%,-50%)'}}function make(){count++;const [color,shape]=specs[(count-1)%specs.length],o=document.createElement('div');o.className='object';o.dataset.id=count;o.dataset.shape=shape;o.textContent=count;o.style.background=color;const r=stage.getBoundingClientRect(),x=r.width/2+((count-1)%3-1)*34,y=r.height/2+((count-1)%3-1)*34;setPos(o,x,y);o.style.zIndex=++z;['pointerdown','pointermove','pointerup','pointercancel','lostpointercapture'].forEach(t=>o.addEventListener(t,t==='pointerdown'?down:t==='pointermove'?move:end));stage.appendChild(o);update()}function down(e){e.preventDefault();const o=e.currentTarget,p=pos(o);o.setPointerCapture(e.pointerId);o.classList.remove('settle');o.classList.add('active');o.style.zIndex=++z;pointers.set(e.pointerId,{object:o,dx:e.clientX-p.x,dy:e.clientY-p.y});update()}function move(e){const p=pointers.get(e.pointerId);if(!p||p.object!==e.currentTarget)return;e.preventDefault();const o=p.object,r=stage.getBoundingClientRect(),b=o.getBoundingClientRect(),x=clamp(e.clientX-p.dx,b.width/2,r.width-b.width/2),y=clamp(e.clientY-p.dy,b.height/2,r.height-b.height/2);setPos(o,x,y);checkMagnet(o)}function end(e){const p=pointers.get(e.pointerId);if(!p)return;pointers.delete(e.pointerId);const o=p.object;if(![...pointers.values()].some(q=>q.object===o)){o.classList.remove('active');o.classList.add('settle');setTimeout(()=>o.classList.remove('settle'),350)}clearCandidate();update()}function clearCandidate(){if(candidate){candidate.a.classList.remove('magnetic');candidate.b.classList.remove('magnetic')}candidate=null;candidateSince=0}function checkMagnet(moving){if(moving.classList.contains('joined'))return;const a=pos(moving),others=[...stage.querySelectorAll(':scope > .object')].filter(o=>o!==moving&&!o.classList.contains('uniting'));let best=null,bestD=Infinity;for(const o of others){const b=pos(o),dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(Math.abs(dy)<70&&d<165&&d<bestD){best=o;bestD=d}}if(!best){clearCandidate();return}if(!candidate||!((candidate.a===moving&&candidate.b===best)||(candidate.a===best&&candidate.b===moving))){clearCandidate();candidate={a:moving,b:best};candidateSince=performance.now();moving.classList.add('magnetic');best.classList.add('magnetic')}const bp=pos(best),pull=.09;setPos(moving,a.x+(bp.x-a.x)*pull,a.y+(bp.y-a.y)*pull);if(performance.now()-candidateSince>=500)unite(candidate.a,candidate.b)}function unite(a,b){if(!a.isConnected||!b.isConnected)return;clearCandidate();a.classList.add('uniting');b.classList.add('uniting');const pa=pos(a),pb=pos(b),mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;setPos(a,mx-42,my);setPos(b,mx+42,my);setTimeout(()=>{if(!a.isConnected||!b.isConnected)return;for(const [id,p] of pointers)if(p.object===a||p.object===b)pointers.delete(id);const group=document.createElement('div');group.className='joined';group.dataset.x=mx;group.dataset.y=my;group.dataset.id='joined-'+(++joinedCount);group.style.zIndex=++z;a.classList.remove('active','uniting','magnetic','settle');b.classList.remove('active','uniting','magnetic','settle');group.append(a,b);stage.appendChild(group);setPos(group,mx,my);group.addEventListener('pointerdown',groupDown);group.addEventListener('pointermove',groupMove);group.addEventListener('pointerup',groupEnd);group.addEventListener('pointercancel',groupEnd);update()},280)}function groupDown(e){e.preventDefault();const g=e.currentTarget,p=pos(g);g.setPointerCapture(e.pointerId);g.classList.add('active');g.style.zIndex=++z;pointers.set(e.pointerId,{object:g,dx:e.clientX-p.x,dy:e.clientY-p.y});update()}function groupMove(e){const p=pointers.get(e.pointerId);if(!p||p.object!==e.currentTarget)return;e.preventDefault();const r=stage.getBoundingClientRect(),g=p.object,b=g.getBoundingClientRect();setPos(g,clamp(e.clientX-p.dx,b.width/2,r.width-b.width/2),clamp(e.clientY-p.dy,b.height/2,r.height-b.height/2))}function groupEnd(e){const p=pointers.get(e.pointerId);if(!p)return;pointers.delete(e.pointerId);p.object.classList.remove('active');update()}add.addEventListener('click',make);make();make();update()})();
</script></body></html>
