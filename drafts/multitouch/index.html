(()=>{const stage=document.getElementById('stage'),add=document.getElementById('add'),status=document.getElementById('status'),surface=document.getElementById('surface');const specs=[['#e5483f','circle'],['#356fd4','square'],['#e3ae24','diamond'],['#2e9967','hex'],['#8a57c7','round'],['#e4772d','circle']];const pointers=new Map();let count=0,z=1,candidate=null,candidateSince=0,joinedCount=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function update(){const n=stage.querySelectorAll(':scope > .object,:scope > .joined').length;status.textContent=`${n} ${n===1?'object':'objects'} · ${pointers.size} ${pointers.size===1?'touch':'touches'}`}function pos(el){return{x:+el.dataset.x,y:+el.dataset.y}}function setPos(el,x,y){el.dataset.x=x;el.dataset.y=y;el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');if(el.classList.contains('joined')){el.style.left=x+'px';el.style.top=y+'px';el.style.transform='translate(-50%,-50%) scaleX(var(--stretch,1))'}}function size(el){const b=el.getBoundingClientRect();return{w:b.width,h:b.height}}function colorOf(el){if(el.classList.contains('joined'))return getComputedStyle(el.querySelector('.object')).backgroundColor;return getComputedStyle(el).backgroundColor}function nearestEdge(el){const r=stage.getBoundingClientRect(),p=pos(el),s=size(el),d={left:p.x-s.w/2,right:r.width-(p.x+s.w/2),top:p.y-s.h/2,bottom:r.height-(p.y+s.h/2)};const edge=Object.keys(d).reduce((a,b)=>d[a]<d[b]?a:b);return{edge,distance:d[edge],r,s,p}}function hideSurface(){surface.className='';surface.style.opacity=''}function edgeCheck(el){const e=nearestEdge(el),zone=190,near=e.distance<zone;el.classList.toggle('edge-near',near);if(!near){hideSurface();return e}const force=clamp((zone-e.distance)/zone,0,1),reach=18+force*92,span=Math.max(118,(e.edge==='left'||e.edge==='right'?e.s.h:e.s.w)*(1.12+force*.5));surface.className='on '+e.edge;surface.style.setProperty('--surface-color',colorOf(el));surface.style.setProperty('--reach',reach+'px');surface.style.s .width/2+18),clamp(e.clientY-p.dy,b.height/2-18,r.height-b.height/2+18));edgeCheck(o);if(!o.classList.contains('edge-near'))checkMagnet(o)}function end(e){const p=pointers.get(e.pointerId);if(!p)return;pointers.delete(e.pointerId);const o=p.object;if(![...pointers.values()].some(q=>q.object===o)){o.classList.remove('active');dock(o)}o.classList.remove('edge-near');hideSurface();clearCandidate();update()}function clearCandidate(){if(candidate){candidate.a.classList.remove('magnetic');candidate.b.classList.remove('magnetic')}candidate=null;candidateSince=0}function checkMagnet(moving){const a=pos(moving),others=[...stage.querySelectorAll(':scope > .object')].filter(o=>o!==moving&&!o.classList.contains('uniting')&&!o.dataset.docked);let best=null,bestD=Infinity;for(const o of others){const b=pos(o),d=Math.hypot(b.x-a.x,b.y-a.y);if(d<165&&d<bestD){best=o;bestD=d}}if(!best){clearCandidate();return}if(!candidate||!((candidate.a===moving&&candidate.b===best)||(candidate.a===best&&candidate.b===moving))){clearCandidate();candidate={a:moving,b:best};candidateSince=performance.now();moving.classList.add('magnetic');best.classList.add('magnetic')}const bp=pos(best),pull=.09;setPos(moving,a.x+(bp.x-a.x)*pull,a.y+(bp.y-a.y)*pull);if(performance.now()-candidateSince>=500)unite(candidate.a,candidate.b)}function unite(a,b){if(!a.isConnected||!b.isConnected)return;const pa=pos(a),pb=pos(b),dx=pb.x-pa.x,dy=pb.y-pa.y;let first=a,second=b,vertical=false;if(Math.abs(dx)>=Math.abs(dy)){if(pa.x>pb.x){first=b;second=a}}else{vertical=true;if(pa.y>pb.y){first=b;second=a}}clearCandidate();a.classList.add('uniting');b.classList.add('uniting');const mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2,off=42;if(vertical){setPos(first,mx,my-off);setPos(second,mx,my+off)}else{setPos(first,mx-off,my);setPos(second,mx+off,my)}setTimeout(()=>{if(!a.isConnected||!b.isConnected)return;for(const[id,p]of pointers)if(p.object===a||p.object===b)pointers.delete(id);const g=document.createElement('div');g.className='joined'+(vertical?' vertical':'');g.dataset.x=mx;g.dataset.y=my;g.dataset.axis=vertical?'vertical':'horizontal';g.dataset.id='joined-'+(++joinedCount);g.style.zIndex=++z;first.classList.remove('active','uniting','magnetic');second.classList.remove('active','uniting','magnetic');g.append(first,second);stage.appendChild(g);setPos(g,mx,my);['pointerdown','pointermove','pointerup','pointercancel','lostpointercapture'].forEach(t=>g.addEventListener(t,t==='pointerdown'?groupDown:t==='pointermove'?groupMove:groupEnd));update()},280)}function groupPointers(g){return[...pointers.entries()].filter(([,p])=>p.object===g)}function groupDown(e){e.preventDefault();const g=e.currentTarget,p=pos(g);undock(g);g.setPointerCapture(e.pointerId);g.classList.add('active');g.style.zIndex=++z;pointers.set(e.pointerId,{object:g,dx:e.clientX-p.x,dy:e.clientY-p.y,x:e.clientX,y:e.clientY});const pts=groupPointers(g);if(pts.length===2){const r=g.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,[p1,p2]=pts.map(([,q])=>q),ok=g.dataset.axis==='vertical'?((p1.y<cy&&p2.y>cy)||(p2.y<cy&&p1.y>cy)):((p1.x<cx&&p2.x>cx)||(p2.x<cx&&p1.x>cx));if(ok){g.dataset.splitBase=String(Math.hypot(p2.x-p1.x,p2.y-p1.y));g.classList.add('splitting')}}update()}function groupMove(e){const p=pointers.get(e.pointerId);if(!p||p.object!==e.currentTarget)return;e.preventDefault();p.x=e.clientX;p.y=e.clientY;const g=p.object,pts=groupPointers(g);if(pts.length===2&&g.classList.contains('splitting')){const[a,b]=pts.map(([,q])=>q),base=+g.dataset.splitBase||Math.hypot(b.x-a.x,b.y-a.y),d=Math.hypot(b.x-a.x,b.y-a.y),delta=Math.max(0,d-base);g.style.setProperty('--stretch',String(1+Math.min(delta/300,.12)));setPos(g,+g.dataset.x,+g.dataset.y);if(delta>38)splitGroup(g,pts);return}if(pts.length>1)return;const r=stage.getBoundingClientRect(),b=g.getBoundingClientRect();setPos(g,clamp(e.clientX-p.dx,b.width/2-18,r.width-b.width/2+18),clamp(e.clientY-p.dy,b.height/2-18,r.height-b.height/2+18));edgeCheck(g)}function splitGroup(g,pts)
